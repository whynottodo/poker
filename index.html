<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#14171c;color:#e8e8e8;font-family:"Microsoft YaHei",sans-serif;overflow-x:hidden}

<script>
// ============================================================================
//  PeerJS 预加载
// ============================================================================
const __peerJsReady = new Promise((resolve, reject) => {
    if (window.Peer) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.bootcdn.net/ajax/libs/peerjs/1.5.4/peerjs.min.js';
    s.async = true;
    s.onload = resolve;
    s.onerror = () => reject(new Error('PeerJS 加载失败'));
    document.head.appendChild(s);
});

// ============================================================================
//  Card
// ============================================================================
const RL = ["2","3","4","5","6","7","8","9","T","J","Q","K","A"];
const SS = ["♣","♦","♥","♠"];
class Card {
    constructor(v) { this.v = v; }
    rank() { return this.v >> 2; }
    suit() { return this.v & 3; }
    valid() { return this.v < 52; }
    isRed() { return (this.v & 3) === 1 || (this.v & 3) === 2; }
    label() { return this.valid() ? RL[this.v >> 2] : "?"; }
    symbol() { return this.valid() ? SS[this.v & 3] : "?"; }
}
const INV = new Card(0xFF);

// ============================================================================
//  Evaluator（优化版）
// ============================================================================
const ST_HIGH=0,ST_PAIR=1,ST_TWO_PAIR=2,ST_TRIPS=3,ST_STRAIGHT=4,
      ST_FLUSH=5,ST_FULL_HOUSE=6,ST_QUADS=7,ST_STRAIGHT_FLUSH=8;

function eval5(a, b, c, d, e) {
    const ra = a >> 2, rb = b >> 2, rc = c >> 2, rd = d >> 2, re = e >> 2;
    const rm = (1 << ra) | (1 << rb) | (1 << rc) | (1 << rd) | (1 << re);
    const flush = ((a ^ b) | (b ^ c) | (c ^ d) | (d ^ e)) & 3 === 0;
    let nc = rm;
    nc = nc - ((nc >> 1) & 0x5555);
    nc = (nc & 0x3333) + ((nc >> 2) & 0x3333);
    nc = (nc + (nc >> 4)) & 0x0F0F;
    nc = (nc + (nc >> 8)) & 0x1F;
    if (nc === 5) {
        if (ra - re === 4) return ((flush ? 8 : 4) << 20) | (ra << 16);
        if (ra === 12 && re === 0 && rb === 3 && rc === 2 && rd === 1)
            return ((flush ? 8 : 4) << 20) | (3 << 16);
    }
    if (flush) return (5 << 20) | (ra << 16) | (rb << 12) | (rc << 8) | (rd << 4) | re;
    if (ra === rb) {
        if (rb === rc) {
            if (rc === rd) {
                if (rd === re) return (7 << 20) | (ra << 16);
                return (7 << 20) | (ra << 16) | (re << 12);
            }
            if (rd === re) return (6 << 20) | (ra << 16) | (rd << 12);
            return (3 << 20) | (ra << 16) | (rd << 12) | (re << 8);
        }
        if (rc === rd) {
            if (rd === re) return (6 << 20) | (ra << 16) | (rd << 12);
            return (2 << 20) | (ra << 16) | (rc << 12) | (re << 8);
        }
        if (rd === re) return (2 << 20) | (ra << 16) | (rd << 12) | (rc << 8);
        return (1 << 20) | (ra << 16) | (rc << 12) | (rd << 8) | (re << 4);
    }
    if (rb === rc) {
        if (rc === rd) {
            if (rd === re) return (7 << 20) | (rb << 16) | (ra << 12);
            return (3 << 20) | (rb << 16) | (ra << 12) | (re << 8);
        }
        if (rd === re) return (2 << 20) | (rb << 16) | (rd << 12) | (ra << 8);
        return (1 << 20) | (rb << 16) | (ra << 12) | (rd << 8) | (re << 4);
    }
    if (rc === rd) {
        if (rd === re) return (3 << 20) | (rc << 16) | (ra << 12) | (rb << 8);
        return (1 << 20) | (rc << 16) | (ra << 12) | (rb << 8) | (re << 4);
    }
    if (rd === re) return (1 << 20) | (rd << 16) | (ra << 12) | (rb << 8) | (rc << 4);
    return (0 << 20) | (ra << 16) | (rb << 12) | (rc << 8) | (rd << 4) | re;
}

function eval7(v0, v1, v2, v3, v4, v5, v6) {
    const v = [v0, v1, v2, v3, v4, v5, v6];
    for (let i = 1; i < 7; i++) {
        const key = v[i], kr = key >> 2;
        let j = i - 1;
        while (j >= 0 && (v[j] >> 2) < kr) { v[j + 1] = v[j]; --j; }
        v[j + 1] = key;
    }
    let best = 0;
    for (let a = 0; a < 3; a++)
    for (let b = a + 1; b < 4; b++)
    for (let c = b + 1; c < 5; c++)
    for (let d = c + 1; d < 6; d++)
    for (let e = d + 1; e < 7; e++) {
        const val = eval5(v[a], v[b], v[c], v[d], v[e]);
        if (val > best) best = val;
    }
    return best;
}

// ============================================================================
//  Table / Player
// ============================================================================
const ST_PREFLOP=1, ST_FLOP=2, ST_TURN=3, ST_RIVER=4, ST_SHOWDOWN=5, ST_OVER=6;
const STREET_NAMES = ["未开始","翻牌前","翻牌","转牌","河牌","摊牌","本手结束"];
const ACT_FOLD=0, ACT_CHECK=1, ACT_CALL=2, ACT_BET=3, ACT_RAISE=4, ACT_ALLIN=5;

class Player {
    constructor(seat) {
        this.seat = seat;
        this.stack = 0; this.betRound = 0; this.betTotal = 0;
        this.hole = [INV, INV];
        this.occupied = false; this.inHand = false;
        this.folded = false; this.allIn = false; this.acted = false;
    }
    canAct() { return this.inHand && !this.folded && !this.allIn && this.stack > 0; }
    alive() { return this.inHand && !this.folded; }
}

class Table {
    constructor(numSeats, sb, bb, stack) {
        this.numSeats = numSeats;
        this.smallBlind = sb; this.bigBlind = bb;
        this.startingStack = stack;
        this.players = Array.from({length:numSeats}, (_,i) => new Player(i));
        this.button = -1;
        this.board = [INV, INV, INV, INV, INV];
        this.boardCount = 0;
        this.street = 0;
        this.toAct = -1;
        this.currentBet = 0; this.minRaise = 0; this.pot = 0;
        this.activeCount = 0;
        this.winners = [];
        this.wonAmount = new Array(numSeats).fill(0);
        this.deck = [];
        this.rngState = 0x12345678;
        this.wentToShowdown = false;
    }
    rng() {
        let x = this.rngState;
        x ^= x << 13; x >>>= 0;
        x ^= x >> 17;
        x ^= x << 5; x >>>= 0;
        this.rngState = x;
        return x / 4294967296;
    }
    seat(i, stack) { this.players[i].occupied = true; this.players[i].stack = stack; }
    nextInHand(from) {
        for (let i = 1; i <= this.numSeats; i++) {
            const idx = (from + i) % this.numSeats;
            if (this.players[idx].inHand) return idx;
        }
        return -1;
    }
    nextCanAct(from) {
        for (let i = 0; i < this.numSeats; i++) {
            const idx = (from + i) % this.numSeats;
            if (this.players[idx].canAct()) return idx;
        }
        return -1;
    }
    roundOver() {
        for (const p of this.players) {
            if (!p.canAct()) continue;
            if (!p.acted) return false;
            if (p.betRound < this.currentBet) return false;
        }
        return true;
    }
    startHand(seed) {
        this.rngState = seed >>> 0 || 0x12345678;
        this.wentToShowdown = false;
        for (const p of this.players) {
            p.inHand = p.occupied && p.stack > 0;
            p.folded = false; p.allIn = false; p.acted = false;
            p.betRound = 0; p.betTotal = 0;
            p.hole[0] = INV; p.hole[1] = INV;
        }
        for (let i = 0; i < 5; i++) this.board[i] = INV;
        this.boardCount = 0; this.pot = 0;
        this.winners = []; this.wonAmount.fill(0);
        this.activeCount = 0;
        for (const p of this.players) if (p.inHand) this.activeCount++;
        if (this.activeCount < 2) { this.street = ST_OVER; return; }
        do { this.button = (this.button + 1) % this.numSeats; }
        while (!this.players[this.button].inHand);
        this.deck = new Array(52);
        for (let i = 0; i < 52; i++) this.deck[i] = i;
        for (let i = 51; i > 0; i--) {
            const j = Math.floor(this.rng() * (i + 1));
            const tmp = this.deck[i]; this.deck[i] = this.deck[j]; this.deck[j] = tmp;
        }
        let di = 0;
        for (let k = 0; k < 2; k++) {
            let i = (this.button + 1) % this.numSeats;
            for (let m = 0; m < this.numSeats; m++) {
                if (this.players[i].inHand)
                    this.players[i].hole[k] = new Card(this.deck[di++]);
                i = (i + 1) % this.numSeats;
            }
        }
        const sb = this.nextInHand(this.button);
        const bb = this.nextInHand(sb);
        this.postBlind(sb, this.smallBlind);
        this.postBlind(bb, this.bigBlind);
        this.street = ST_PREFLOP;
        this.currentBet = this.bigBlind;
        this.minRaise = this.bigBlind;
        this.toAct = this.nextCanAct((bb + 1) % this.numSeats);
        if (this.players.filter(p => p.canAct()).length <= 1) this.runOut();
    }
    postBlind(seat, amount) {
        const p = this.players[seat];
        const actual = Math.min(amount, p.stack);
        p.stack -= actual; p.betRound += actual; p.betTotal += actual;
        this.pot += actual;
        if (p.stack === 0) p.allIn = true;
    }
    act(action, amount = 0) {
        if (this.toAct < 0 || this.street === ST_OVER) return;
        const p = this.players[this.toAct];
        switch (action) {
            case ACT_FOLD: p.folded = true; p.acted = true; this.activeCount--; break;
            case ACT_CHECK: p.acted = true; break;
            case ACT_CALL: {
                const toCall = this.currentBet - p.betRound;
                const actual = Math.min(toCall, p.stack);
                p.stack -= actual; p.betRound += actual;
                p.betTotal += actual; this.pot += actual;
                if (p.stack === 0) p.allIn = true;
                p.acted = true; break;
            }
            case ACT_BET:
            case ACT_RAISE: {
                let target = Math.max(amount, this.currentBet + this.minRaise);
                let delta = Math.min(target - p.betRound, p.stack);
                p.stack -= delta; p.betRound += delta; p.betTotal += delta;
                this.pot += delta;
                const rs = p.betRound - this.currentBet;
                if (rs > 0) {
                    const full = rs >= this.minRaise;
                    this.currentBet = p.betRound;
                    if (full) {
                        this.minRaise = rs;
                        for (const q of this.players)
                            if (q !== p && q.canAct()) q.acted = false;
                    }
                }
                if (p.stack === 0) p.allIn = true;
                p.acted = true; break;
            }
            case ACT_ALLIN: {
                const delta = p.stack;
                p.stack = 0;
                p.betRound += delta; p.betTotal += delta; this.pot += delta;
                p.allIn = true;
                if (p.betRound > this.currentBet) {
                    const rs = p.betRound - this.currentBet;
                    const full = rs >= this.minRaise;
                    this.currentBet = p.betRound;
                    if (full) {
                        this.minRaise = rs;
                        for (const q of this.players)
                            if (q !== p && q.canAct()) q.acted = false;
                    }
                }
                p.acted = true; break;
            }
        }
        if (this.activeCount <= 1) { this.awardLastAlive(); return; }
        if (this.roundOver()) this.endRound();
        else this.toAct = this.nextCanAct((this.toAct + 1) % this.numSeats);
    }
    endRound() {
        for (const p of this.players) { p.betRound = 0; p.acted = false; }
        this.currentBet = 0; this.minRaise = this.bigBlind;
        if (this.players.filter(p => p.canAct()).length <= 1) { this.runOut(); return; }
        switch (this.street) {
            case ST_PREFLOP: this.dealBoard(3); this.street = ST_FLOP; break;
            case ST_FLOP: this.dealBoard(4); this.street = ST_TURN; break;
            case ST_TURN: this.dealBoard(5); this.street = ST_RIVER; break;
            case ST_RIVER: this.gotoShowdown(); return;
            default: return;
        }
        this.toAct = this.nextCanAct((this.button + 1) % this.numSeats);
    }
    dealBoard(target) {
        while (this.boardCount < target)
            this.board[this.boardCount++] = new Card(this.deck.pop());
    }
    runOut() {
        while (this.boardCount < 5)
            this.board[this.boardCount++] = new Card(this.deck.pop());
        this.gotoShowdown();
    }
    awardLastAlive() {
        for (const p of this.players) {
            if (p.alive()) {
                p.stack += this.pot;
                this.wonAmount[p.seat] = this.pot;
                this.winners = [p.seat];
                this.pot = 0;
                break;
            }
        }
        this.street = ST_OVER;
    }
    gotoShowdown() {
        this.wentToShowdown = true;
        this.street = ST_SHOWDOWN;
        this.distributePots();
        this.street = ST_OVER;
    }
    distributePots() {
        const levels = [];
        for (const p of this.players)
            if (p.inHand && p.betTotal > 0) levels.push(p.betTotal);
        levels.sort((a, b) => a - b);
        const uniq = [...new Set(levels)];
        const wonAny = new Array(this.numSeats).fill(false);
        let prev = 0;
        for (const level of uniq) {
            let layer = 0;
            const participants = [];
            for (const p of this.players) {
                if (!p.inHand) continue;
                const contrib = Math.min(p.betTotal, level) - prev;
                if (contrib > 0) { layer += contrib; participants.push(p.seat); }
            }
            prev = level;
            if (layer === 0) continue;
            let best = 0, winners = [];
            for (const seat of participants) {
                const p = this.players[seat];
                if (!p.alive()) continue;
                const v = eval7(p.hole[0].v, p.hole[1].v,
                    this.board[0].v, this.board[1].v, this.board[2].v,
                    this.board[3].v, this.board[4].v);
                if (winners.length === 0 || v > best) { best = v; winners = [seat]; }
                else if (v === best) winners.push(seat);
            }
            if (winners.length === 0) continue;
            const share = Math.floor(layer / winners.length);
            const rem = layer % winners.length;
            winners.forEach((seat, k) => {
                this.players[seat].stack += share;
                this.wonAmount[seat] += share;
                if (k === 0) {
                    this.players[seat].stack += rem;
                    this.wonAmount[seat] += rem;
                }
                wonAny[seat] = true;
            });
        }
        this.winners = [];
        for (let i = 0; i < this.numSeats; i++) if (wonAny[i]) this.winners.push(i);
        this.pot = 0;
    }
}

// ============================================================================
//  GTO 范围表
// ============================================================================
function handToStr(c0, c1) {
    let r0 = c0.rank(), r1 = c1.rank();
    const suited = c0.suit() === c1.suit();
    if (r0 < r1) { const t = r0; r0 = r1; r1 = t; }
    const R = "23456789TJQKA";
    if (r0 === r1) return R[r0] + R[r1];
    return R[r0] + R[r1] + (suited ? "s" : "o");
}

function parseRange(str) {
    const s = new Set();
    for (const tok of str.split(/\s+/)) if (tok) s.add(tok);
    return s;
}

const GTO_RANGES = {
    UTG: {
        open:    "AA KK QQ JJ TT 99 AKs AQs AJs ATs A5s A4s A3s A2s KQs KJs QJs JTs T9s AKo AQo AJo KQo",
        vsRaise: "AA KK QQ JJ TT 99 AKs AQs AJs ATs KQs AKo AQo",
        vs3bet:  "AA KK QQ JJ AKs AKo"
    },
    MP: {
        open:    "AA KK QQ JJ TT 99 88 77 AKs AQs AJs ATs A9s A5s A4s A3s A2s KQs KJs KTs QJs QTs JTs T9s 98s AKo AQo AJo ATo KQo KJo",
        vsRaise: "AA KK QQ JJ TT 99 AKs AQs AJs ATs KQs KJs AKo AQo AJo",
        vs3bet:  "AA KK QQ JJ AKs AQs AKo"

const _rangeCache = new Map();
function getRange(pos, kind) {
    const key = pos + "_" + kind;
    let r = _rangeCache.get(key);
    if (!r) {
        r = parseRange((GTO_RANGES[pos] || {})[kind] || "");
        _rangeCache.set(key, r);
    }
    return r;
}

function handStrength01(c0, c1) {
    let r0 = c0.rank(), r1 = c1.rank();
    if (r0 < r1) { const t = r0; r0 = r1; r1 = t; }
    const suited = c0.suit() === c1.suit();
    if (r0 === r1) return 0.55 + (r0 / 12) * 0.45;
    let s = (r0 / 12) * 0.55 + (r1 / 12) * 0.25;
    if (suited) s += 0.10;
    const gap = r0 - r1 - 1;
    if (gap === 0) s += 0.15;
    else if (gap === 1) s += 0.10;
    else if (gap === 2) s += 0.04;
    else if (gap >= 4) s -= 0.08;
    if (r0 >= 10 && r1 >= 9) s += 0.05;
    return Math.max(0, Math.min(1, s));
}

function blockerAdjust(hole, board, boardCount) {
    if (boardCount < 3) return 0;
    let adj = 0;
    for (const c of hole) {
        const r = c.rank();
        if (r === 12) adj += 0.03;
        else if (r === 11) adj += 0.02;
    }
    const boardSuits = [0, 0, 0, 0];
    for (let i = 0; i < boardCount; i++) boardSuits[board[i].suit()]++;
    for (const c of hole) {
        const s = c.suit();
        if (boardSuits[s] >= 2) adj += 0.04;
        if (boardSuits[s] >= 3) adj += 0.06;
    }
    const boardRanks = new Set();
    for (let i = 0; i < boardCount; i++) boardRanks.add(board[i].rank());
    for (const c of hole) {
        const r = c.rank();
        if (boardRanks.has(r - 1) || boardRanks.has(r + 1)) adj += 0.02;
    }
    return Math.max(-0.15, Math.min(0.15, adj));
}

function geoBetFrac(pot, stack, streetsLeft) {
    if (streetsLeft <= 0 || pot <= 0) return 1.0;
    const target = 1 + 2 * stack / pot;
    const x = (Math.pow(target, 1 / streetsLeft) - 1) / 2;
    return Math.max(0.3, Math.min(1.5, x));
}

function boardTexture(board, boardCount) {
    if (boardCount < 3) return 0.5;
    const ranks = [];
    const suits = [0, 0, 0, 0];
    for (let i = 0; i < boardCount; i++) {
        ranks.push(board[i].rank());
        suits[board[i].suit()]++;
    }
    ranks.sort((a, b) => b - a);
    let wet = 0;
    for (let i = 0; i < ranks.length - 1; i++) {
        const gap = ranks[i] - ranks[i + 1];
        if (gap === 1) wet += 0.15;
        else if (gap === 2) wet += 0.08;
    }
    const maxSuit = Math.max(...suits);
    if (maxSuit >= 3) wet += 0.25;
    if (maxSuit >= 4) wet += 0.20;
    if (ranks[0] >= 11) wet -= 0.05;
    return Math.max(0, Math.min(1, wet));
}

class Bot {
    constructor() {
        this.iterations = 250;
        this.valueEquity = 0.58;
        this.raiseEquity = 0.72;
        this.raiseRate = 0.60;
        this.bluffEquity = 0.32;
        this.slowplayRate = 0.18;
        this.floatRate = 0.28;
        this.checkRaiseRate = 0.22;
        this.probeRate = 0.50;
        this.opponents = new Map();
        this.currentHand = new Map();
        this.lastButton = -1;
        this.tempBias = 0.85 + Math.random() * 0.3;
        this.aggressionBias = 0.85 + Math.random() * 0.3;
    }

    decide(t, seat) {
        const p = t.players[seat];
        if (!p.inHand || p.folded) return { action: ACT_CHECK, amount: 0 };
        if (!p.hole[0].valid() || !p.hole[1].valid())
            return { action: ACT_FOLD, amount: 0 };
        this.observe(t, seat);
        if (t.street === ST_PREFLOP) return this.preflop(t, seat);
        return this.postflop(t, seat);
    }

    preflop(t, seat) {
        const p = t.players[seat];
        const toCall = t.currentBet - p.betRound;
        const n = t.numSeats;
        const rel = this.relToButton(t, seat);

        let pos;
        if (n <= 6) {
            if (rel === 0) pos = "BTN";
            else if (rel === 1) pos = "SB";
            else if (rel === 2) pos = "BB";
            else {
                const d = n - 1 - rel;
                if (d <= 0) pos = "CO";
                else if (d === 1) pos = "MP";
                else if (d === 2) pos = "MP";
                else pos = "UTG";
            }
        } else {
            if (rel === 0) pos = "BTN9";
            else if (rel === 1) pos = "SB9";
            else if (rel === 2) pos = "BB9";
            else if (rel === n - 1) pos = "LATE9";
            else if (rel >= n - 4) pos = "MID9";
            else pos = "EARLY9";
        }

        const facing3bet = t.currentBet > t.bigBlind * 3;
        const facingRaise = t.currentBet > t.bigBlind * 1.5;
        let kind = "open";
        if (facing3bet) kind = "vs3bet";
        else if (facingRaise) kind = "vsRaise";

        if (toCall === 0 && t.currentBet <= t.bigBlind) {
            const hs = handStrength01(p.hole[0], p.hole[1]);
            if (hs > 0.75 && Math.random() < 0.30) return this.makeRaise(t, p, 0.9);
            return { action: ACT_CHECK, amount: 0 };
        }

        const range = getRange(pos, kind);
        const hs = handToStr(p.hole[0], p.hole[1]);
        const inRange = range.has(hs);

        const T = this.currentTemp(t, seat, 0);

        if (!inRange) {
            if (Math.random() < 0.03 / this.aggressionBias) {
                if (toCall === 0) return { action: ACT_CHECK, amount: 0 };
                if (toCall <= t.bigBlind && Math.random() < 0.5)
                    return { action: ACT_CALL, amount: 0 };
            }
            if (toCall === 0) return { action: ACT_CHECK, amount: 0 };
            return { action: ACT_FOLD, amount: 0 };
        }

        const isStrong = hs[0] === "A" || (hs.length === 2 && hs[0] === hs[1]);
        let rp = isStrong ? 0.70 : 0.35;
        if (pos === "BTN" || pos === "BTN9") rp += 0.15;
        if (pos === "SB" || pos === "SB9") rp += 0.10;
        if (!facingRaise) rp += 0.10;
        rp *= this.aggressionBias;
        rp = Math.min(0.90, Math.max(0.10, rp));
        rp = this.tempScale(rp, T);

        if (p.stack > toCall && Math.random() < rp) return this.makeRaise(t, p, 1.0);
        if (toCall === 0) return { action: ACT_CHECK, amount: 0 };
        return { action: ACT_CALL, amount: 0 };
    }

    postflop(t, seat) {
        const p = t.players[seat];
        const toCall = t.currentBet - p.betRound;
        const pot = t.pot;
        const need = toCall > 0 ? toCall / (pot + toCall) : 0;
        const ip = this.relToButton(t, seat) === 0;
        const texture = boardTexture(t.board, t.boardCount);

        const eqRaw = this.equityWithRange(t, seat);
        const blocker = blockerAdjust(p.hole, t.board, t.boardCount);
        const eqAdjusted = Math.max(0, Math.min(1, eqRaw + blocker * 0.5));

        const oppSummary = this.opponentSummary(t, seat);
        let rangeDiscount = 0.42;
        if (oppSummary.hands >= 5) {
            const factor = 1 + (0.35 - oppSummary.avgVpip) * 2.5;
            rangeDiscount *= Math.max(0.5, Math.min(1.8, factor));
        }

        let pressure = 0;
        if (toCall > 0) {
            pressure = toCall / Math.max(pot, t.bigBlind);
            if (pressure > 1.5) pressure = 1.5;
            pressure /= 1.5;
        }
        const eq = eqAdjusted * (1 - rangeDiscount * pressure);
        const T = this.currentTemp(t, seat, pressure);

        const streetsLeft = 5 - t.boardCount + 1;
        const geoFrac = geoBetFrac(pot, p.stack, streetsLeft);

        if (toCall === 0) {
            if (eq > 0.82) {
                let slow = this.slowplayRate;
                if (!ip) slow *= 1.3;
                slow = this.tempScale(slow, T);
                if (Math.random() < slow) return { action: ACT_CHECK, amount: 0 };
                const frac = Math.max(geoFrac * 0.9, 0.55);
                return this.makeRaise(t, p, frac);
            }
            if (eq > this.valueEquity) {
                const f = this.tempScale(ip ? 0.75 : 0.60, T);
                if (Math.random() < f) {
                    const frac = texture > 0.5 ? geoFrac * 0.9 : geoFrac * 0.75;
                    return this.makeRaise(t, p, Math.max(frac, 0.4));
                }
                return { action: ACT_CHECK, amount: 0 };
            }
            if (eq > 0.45) {
                const f = ip ? 0.55 : 0.28;
                if (Math.random() < this.tempScale(f, T))
                    return this.makeRaise(t, p, 0.42);
                return { action: ACT_CHECK, amount: 0 };
            }
            if (eq < this.bluffEquity) {
                const bf = ip ? 0.30 : 0.20;
                if (Math.random() < this.tempScale(bf * this.aggressionBias, T))
                    return this.makeRaise(t, p, Math.max(geoFrac, 0.5));
                return { action: ACT_CHECK, amount: 0 };
            }
            if (!ip && Math.random() < this.probeRate * 0.4)
                return this.makeRaise(t, p, 0.45);
            return { action: ACT_CHECK, amount: 0 };
        }

        const spr = pot > 0 ? p.stack / pot : 100;
        if (spr < 3) {
            if (eq > 0.55) return { action: ACT_CALL, amount: 0 };
            if (eq > 0.45 && need < 0.30) return { action: ACT_CALL, amount: 0 };
            return { action: ACT_FOLD, amount: 0 };
        }

        if (eq > 0.85) {
            const rp = this.tempScale(ip ? 0.78 : 0.62, T);
            if (Math.random() < rp && p.stack > toCall) {
                const target = Math.max(t.currentBet * 3, t.currentBet + t.minRaise);
                return { action: ACT_RAISE,
                         amount: Math.min(target, p.betRound + p.stack) };
            }
            return { action: ACT_CALL, amount: 0 };
        }
        if (eq > 0.70) {
            const rr = this.tempScale(0.25 * this.aggressionBias, T);
            if (Math.random() < rr && p.stack > toCall * 2) {
                const target = t.currentBet + t.minRaise;
                return { action: ACT_RAISE,
                         amount: Math.min(target, p.betRound + p.stack) };
            }
            return { action: ACT_CALL, amount: 0 };
        }
        if (eq > need + 0.05) return { action: ACT_CALL, amount: 0 };

        const br = this.tempScale((ip ? 0.10 : 0.04) * this.aggressionBias, T);
        if (Math.random() < br && p.stack > toCall * 4) {
            const target = t.currentBet + t.minRaise;
            return { action: ACT_RAISE,
                     amount: Math.min(target, p.betRound + p.stack) };
        }
        return { action: ACT_FOLD, amount: 0 };
    }

    equityWithRange(t, seat) {
        const me = t.players[seat];
        const h0 = me.hole[0].v, h1 = me.hole[1].v;
        const used = new Set([h0, h1]);
        for (let i = 0; i < t.boardCount; i++) used.add(t.board[i].v);
        const pool = [];
        for (let v = 0; v < 52; v++) if (!used.has(v)) pool.push(v);
        const opps = [];
        for (let i = 0; i < t.numSeats; i++) {
            if (i === seat) continue;
            if (!t.players[i].inHand || t.players[i].folded) continue;
            opps.push({ seat: i, minRank: this.inferOppRange(t, i) });
        }
        if (opps.length === 0) return 1.0;

        const board = new Array(5);
        for (let i = 0; i < t.boardCount; i++) board[i] = t.board[i].v;
        const boardNeed = 5 - t.boardCount;
        let score = 0;
        const iter = this.iterations;
        const work = pool.slice();
        const workLen = work.length;

        for (let it = 0; it < iter; it++) {
            const need = boardNeed + opps.length * 2;
            for (let i = 0; i < need; i++) {
                const j = i + Math.floor(Math.random() * (workLen - i));
                const tmp = work[i]; work[i] = work[j]; work[j] = tmp;
            }
            let idx = 0;
            for (let i = t.boardCount; i < 5; i++) board[i] = work[idx++];
            const mine = eval7(h0, h1, board[0], board[1], board[2], board[3], board[4]);
            let better = 0, equal = 0;
            for (const opp of opps) {
                let o0 = work[idx], o1 = work[idx + 1];
                for (let attempt = 0; attempt < 6; attempt++) {
                    const rk = handStrength01(new Card(o0), new Card(o1));
                    if (rk >= opp.minRank || attempt === 5) break;
                    idx += 2;
                    if (idx + 2 > workLen) idx = 0;
                    o0 = work[idx]; o1 = work[idx + 1];
                }
                idx += 2;
                if (idx + 2 > workLen) idx = 0;
                const ov = eval7(o0, o1, board[0], board[1], board[2], board[3], board[4]);
                if (ov > mine) { better = 1; break; }
                if (ov === mine) equal++;
            }
            if (!better) score += 1.0 / (equal + 1);
        }
        return score / iter;
    }

    inferOppRange(t, oppSeat) {
        const p = t.players[oppSeat];
        if (p.folded) return 1.0;
        if (t.street === ST_PREFLOP) {
            const bbRatio = p.betRound / t.bigBlind;
            if (bbRatio >= 5) return 0.78;
            if (bbRatio >= 3) return 0.68;
            if (bbRatio >= 1) return 0.48;
            return 0.28;
        }
        if (p.betRound > t.currentBet) return 0.78;
        if (p.betRound === t.currentBet && t.currentBet > 0) return 0.52;
        return 0.28;
    }

    observe(t, mySeat) {
        if (t.button !== this.lastButton) {
            for (const [seat, rec] of this.currentHand) {
                if (rec.inHand) {
                    const s = this.getStats(seat);
                    s.hands++;
                    if (rec.vpip) s.vpip++;
                    if (rec.pfr) s.pfr++;
                    if (rec.raises > 0) s.aggr += rec.raises;
                }
            }
            this.currentHand.clear();
            this.lastButton = t.button;
        }
        for (let i = 0; i < t.numSeats; i++) {
            if (i === mySeat) continue;
            const p = t.players[i];
            if (!p.occupied || !p.inHand) continue;
            let rec = this.currentHand.get(i);
            if (!rec) {
                rec = { inHand: true, vpip: false, pfr: false, raises: 0 };
                this.currentHand.set(i, rec);
            }
            if (t.street === ST_PREFLOP) {
                if (p.betRound > 0 && !p.folded) rec.vpip = true;
                if (p.betRound > t.bigBlind) rec.pfr = true;
            }
            if (t.currentBet > 0 && p.betRound > t.currentBet) rec.raises++;
        }
    }

    getStats(seat) {
        let s = this.opponents.get(seat);
        if (!s) { s = { hands: 0, vpip: 0, pfr: 0, aggr: 0 }; this.opponents.set(seat, s); }
        return s;
    }

    opponentSummary(t, mySeat) {
        let vpip = 0, count = 0;
        for (let i = 0; i < t.numSeats; i++) {
            if (i === mySeat) continue;
            const p = t.players[i];
            if (!p.inHand || p.folded) continue;
            const s = this.getStats(i);
            if (s.hands >= 3) { vpip += s.vpip / s.hands; count++; }
        }
        return { avgVpip: count > 0 ? vpip / count : 0.35, hands: count };
    }

    tempScale(p, T) {
        if (T === 1 || p <= 0.001 || p >= 0.999) return p;
        const logit = Math.log(p / (1 - p));
        return 1 / (1 + Math.exp(-logit / T));
    }

    currentTemp(t, mySeat, pressure) {
        const me = t.players[mySeat];
        const spr = t.pot > 0 ? me.stack / t.pot : 10;
        let base = 1.0;
        if (spr < 3) base = 0.65;
        else if (spr < 6) base = 0.85;
        else if (spr > 15) base = 1.15;
        base *= (1 - 0.35 * pressure);
        if (t.pot < t.bigBlind * 5) base *= 1.10;
        else if (t.pot > t.bigBlind * 40) base *= 0.90;
        const noise = 0.90 + Math.random() * 0.20;
        return Math.max(0.3, Math.min(1.8, base * this.tempBias * noise));
    }

    relToButton(t, seat) {
        const n = t.numSeats;
        return ((seat - t.button) % n + n) % n;
    }

    makeRaise(t, p, frac) {
        const toCall = t.currentBet - p.betRound;
        let target = t.currentBet <= 0
            ? Math.floor(t.pot * frac)
            : t.currentBet + Math.floor((t.pot + toCall) * frac);
        const lo = t.currentBet + t.minRaise;
        const hi = p.betRound + p.stack;
        target = Math.max(lo, Math.min(target, hi));
        if (target >= hi) return { action: ACT_ALLIN, amount: 0 };
        return { action: t.currentBet === 0 ? ACT_BET : ACT_RAISE, amount: target };
    }
}

//  网络层
// ============================================================================
let peer = null;
let conns = [];
let connSeats = new Map();
let hostConn = null;
let isHost = false;
let mySeat = 0;
let roomCode = '';
let nextSeat = 1;

function genRoomCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
}

function startAsHost() {
    isHost = true;
    mySeat = 0;
    roomCode = genRoomCode();

    document.getElementById('lobbyForm').style.display = 'none';
    document.getElementById('hostInfo').style.display = 'block';
    document.getElementById('roomCode').textContent = roomCode;
    document.getElementById('hostStatus').textContent = '正在连接信令服务器…';
    document.getElementById('hostStatus').style.color = '#f0c040';

    __peerJsReady.then(() => {
        peer = new Peer('POKER-' + roomCode);
        peer.on('open', () => {
            document.getElementById('hostStatus').textContent = '房间已就绪';
            document.getElementById('hostStatus').style.color = '#64dc78';
        });
        peer.on('error', e => {
            document.getElementById('hostStatus').textContent = '错误：' + e.message;
            document.getElementById('hostStatus').style.color = '#d23232';
        });
        peer.on('connection', conn => {
            conn.on('open', () => {
                conns.push(conn);
                const seat = nextSeat++;
                connSeats.set(conn, seat);
                conn.send({ type: 'init', seat, roomCode });
                document.getElementById('peerCount').textContent = conns.length;
            });
            conn.on('data', data => handleClientMessage(conn, data));
            conn.on('close', () => {
                conns = conns.filter(c => c !== conn);
                connSeats.delete(conn);
                document.getElementById('peerCount').textContent = conns.length;
            });
        });
    }).catch(() => {
        document.getElementById('hostStatus').textContent = 'PeerJS 加载失败';
        document.getElementById('hostStatus').style.color = '#d23232';
    });
}

function handleClientMessage(conn, data) {
    if (data.type === 'action') {
        const seat = connSeats.get(conn);
        if (seat === undefined) return;
        if (table.toAct !== seat) return;
        humanAction(seat, data.action, data.amount);
    }
}

function cancelHost() {
    if (peer) { peer.destroy(); peer = null; }
    conns = []; connSeats.clear(); nextSeat = 1;
    isHost = false;
    document.getElementById('lobbyForm').style.display = 'block';
    document.getElementById('hostInfo').style.display = 'none';
}

function startGameAsHost() {
    const cfg = readLobbyConfig();
    const humanSeats = 1 + conns.length;
    cfg.numSeats = Math.max(cfg.numSeats, humanSeats);
    gameConfig = cfg;

    for (const conn of conns) conn.send({ type: 'start', config: cfg });

    table = new Table(cfg.numSeats, cfg.sb, cfg.bb, cfg.stack);
    for (let i = 0; i < cfg.numSeats; i++) table.seat(i, cfg.stack);
    bots = [];
    for (let i = 0; i < cfg.numSeats; i++)
        bots.push(i < humanSeats ? null : new Bot());
    humanSeatsSet = new Set();
    humanSeatsSet.add(0);
    for (const [, s] of connSeats) humanSeatsSet.add(s);

    gameOver = false; handNum = 0; lastAction = "";
    waitingNextHand = false;

    showGame();
    startNextHand();
}

function startAsClient(code) {
    document.getElementById('joinStatus').textContent = '正在连接房主…';
    document.getElementById('joinStatus').style.color = '#f0c040';

    __peerJsReady.then(() => {
        peer = new Peer();
        peer.on('open', () => {
            hostConn = peer.connect('POKER-' + code, { reliable: true });
            hostConn.on('open', () => {
                document.getElementById('joinStatus').textContent = '已连接，等待房主开始…';
                document.getElementById('joinStatus').style.color = '#64dc78';
            });
            hostConn.on('data', data => handleHostMessage(data));
            hostConn.on('close', () => {
                alert('与房主断开');
                location.reload();
            });
        });
        peer.on('error', e => {
            document.getElementById('joinStatus').textContent = '连接失败：' + e.message;
            document.getElementById('joinStatus').style.color = '#d23232';
        });
    }).catch(() => {
        document.getElementById('joinStatus').textContent = 'PeerJS 加载失败';
        document.getElementById('joinStatus').style.color = '#d23232';
    });
}

function handleHostMessage(data) {
    if (data.type === 'init') {
        mySeat = data.seat;
        roomCode = data.roomCode;
    } else if (data.type === 'start') {
        gameConfig = data.config;
        table = new Table(gameConfig.numSeats, gameConfig.sb, gameConfig.bb, gameConfig.stack);
        bots = [];
        gameOver = false; handNum = 0; lastAction = "";
        waitingNextHand = false;
        showGame();
    } else if (data.type === 'state') {
        applyState(data.view);
        handNum = data.handNum;
        lastAction = data.lastAction || "";
        waitingNextHand = (table.street === ST_OVER) && !data.gameOver;
        gameOver = data.gameOver;
        render();
        updateControls();
    }
}

function applyState(v) {
    table.numSeats = v.numSeats;
    table.button = v.button;
    table.boardCount = v.boardCount;
    for (let i = 0; i < 5; i++) table.board[i] = new Card(v.board[i]);
    table.street = v.street;
    table.toAct = v.toAct;
    table.currentBet = v.currentBet;
    table.minRaise = v.minRaise;
    table.pot = v.pot;
    table.activeCount = v.activeCount;
    table.winners = v.winners;
    table.wonAmount = v.wonAmount;
    table.wentToShowdown = v.wentToShowdown || false;
    for (let i = 0; i < v.numSeats; i++) {
        const p = table.players[i];
        const d = v.players[i];
        p.stack = d.stack; p.betRound = d.betRound; p.betTotal = d.betTotal;
        p.hole = [new Card(d.hole[0]), new Card(d.hole[1])];
        p.occupied = d.occupied; p.inHand = d.inHand;
        p.folded = d.folded; p.allIn = d.allIn; p.acted = d.acted;
    }
}

function serializeTableView(t, viewerSeat) {
    const showdown = t.wentToShowdown && (t.street === ST_SHOWDOWN || t.street === ST_OVER);
    return {
        numSeats: t.numSeats, button: t.button,
        boardCount: t.boardCount, board: t.board.map(c => c.v),
        street: t.street, toAct: t.toAct,
        currentBet: t.currentBet, minRaise: t.minRaise,
        pot: t.pot, activeCount: t.activeCount,
        winners: t.winners.slice(), wonAmount: t.wonAmount.slice(),
        wentToShowdown: t.wentToShowdown,
        players: t.players.map(p => ({
            stack: p.stack, betRound: p.betRound, betTotal: p.betTotal,
            hole: (p.seat === viewerSeat || showdown) ? [p.hole[0].v, p.hole[1].v] : [0xFF, 0xFF],
            occupied: p.occupied, inHand: p.inHand, folded: p.folded,
            allIn: p.allIn, acted: p.acted
        }))
    };
}

function broadcastState() {
    if (!isHost) return;
    for (const conn of conns) {
        const seat = connSeats.get(conn);
        conn.send({
            type: 'state',
            view: serializeTableView(table, seat),
            handNum: handNum,
            lastAction: lastAction,
            gameOver: gameOver
        });
    }
    render();
    updateControls();
}

//  游戏控制
// ============================================================================
let table = null;
let bots = [];
let gameConfig = { numSeats: 6, sb: 1, bb: 2, stack: 200 };
let gameOver = false;
let handNum = 0;
let lastAction = "";
let waitingNextHand = false;
let humanSeatsSet = new Set();

function isHumanSeat(seat) { return humanSeatsSet.has(seat); }

function readLobbyConfig() {
    const parts = document.getElementById('blinds').value.split('-');
    return {
        numSeats: parseInt(document.getElementById('seatCount').value),
        sb: parseInt(parts[0]),
        bb: parseInt(parts[1]),
        stack: parseInt(document.getElementById('startStack').value) || 200
    };
}

function startSoloGame() {
    const cfg = readLobbyConfig();
    gameConfig = cfg;
    table = new Table(cfg.numSeats, cfg.sb, cfg.bb, cfg.stack);
    for (let i = 0; i < cfg.numSeats; i++) table.seat(i, cfg.stack);
    bots = [null];
    for (let i = 1; i < cfg.numSeats; i++) bots.push(new Bot());
    humanSeatsSet = new Set([0]);
    isHost = true; mySeat = 0;
    gameOver = false; handNum = 0; lastAction = "";
    waitingNextHand = false;
    showGame();
    startNextHand();
}

function showGame() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('app').style.display = 'block';
}

function startNextHand() {
    if (gameOver) return;
    let busted = false;
    for (let i = 0; i < table.numSeats; i++) {
        if (table.players[i].occupied && table.players[i].stack <= 0) { busted = true; break; }
    }
    let aliveCount = 0;
    for (let i = 0; i < table.numSeats; i++)
        if (table.players[i].occupied && table.players[i].stack > 0) aliveCount++;
    if (aliveCount < 2) busted = true;

    if (busted) {
        gameOver = true;
        waitingNextHand = false;
        if (isHost && conns.length > 0) broadcastState();
        render();
        updateControls();
        return;
    }

    handNum++;
    table.startHand(Date.now() ^ (handNum * 7919));
    waitingNextHand = false;
    lastAction = "";
    log("=== 第 " + handNum + " 手开始 ===");
    if (isHost && conns.length > 0) broadcastState();
    render();
    updateControls();
    if (table.street !== ST_OVER) scheduleStep();
}

function scheduleStep() {
    if (table.street === ST_OVER) { onHandEnd(); return; }
    if (table.toAct < 0) return;

    if (isHumanSeat(table.toAct)) {
        if (isHost && conns.length > 0) broadcastState();
        updateControls();
        render();
        return;
    }
    setTimeout(() => {
        if (table.street === ST_OVER || table.toAct < 0) return;
        const seat = table.toAct;
        const d = bots[seat].decide(table, seat);
        const before = snapshot(table.players[seat]);
        table.act(d.action, d.amount);
        const after = snapshot(table.players[seat]);
        describeAction(seat, before, after);
        if (isHost && conns.length > 0) broadcastState();
        else render();
        if (table.street === ST_OVER) onHandEnd();
        else scheduleStep();
    }, 500);
}

function onHandEnd() {
    waitingNextHand = true;
    render();
    updateControls();
    if (isHost && conns.length > 0) broadcastState();
}

function snapshot(p) {
    return { folded: p.folded, allIn: p.allIn, betRound: p.betRound, stack: p.stack };
}

function describeAction(seat, before, after) {
    const who = seat === mySeat ? "你" : "座位" + seat;
    let msg;
    if (!before.folded && after.folded) msg = who + " 弃牌";
    else if (!before.allIn && after.allIn) msg = who + " 全下 $" + after.betRound;
    else if (after.betRound > before.betRound) {
        if (before.betRound === 0) msg = who + " 下注 $" + after.betRound;
        else msg = who + " 加注到 $" + after.betRound;
    }
    else if (after.stack === before.stack) msg = who + " 过牌";
    else msg = who + " 跟注 $" + (before.stack - after.stack);
    lastAction = msg;
    log(msg);
}

function log(msg) {
    const el = document.getElementById("log");
    const lines = el.textContent.split("\n").filter(x => x && x !== "—");
    lines.push(msg);
    while (lines.length > 8) lines.shift();
    el.textContent = lines.join("\n");
}

function humanAction(seat, action, amount) {
    if (table.toAct !== seat) return;
    const before = snapshot(table.players[seat]);
    table.act(action, amount);
    const after = snapshot(table.players[seat]);
    describeAction(seat, before, after);
    if (isHost && conns.length > 0) broadcastState();
    else { render(); updateControls(); }
    if (table.street === ST_OVER) onHandEnd();
    else scheduleStep();
}

function onHumanAct(action, amount) {
    if (isHost) humanAction(mySeat, action, amount);
    else hostConn.send({ type: 'action', action, amount });
}

// ============================================================================
//  UI 渲染
// ============================================================================
const canvas = document.getElementById("table");
const ctx = canvas.getContext("2d");
const W = 1100, H = 700;
const CX = 550, CY = 340, RX = 440, RY = 230;

const COLOR = {
    bg:"#14171c", felt:"#14552c", feltEdge:"#5a3a1a",
    cardFace:"#fafaf5", cardBack:"#2d4196", cardBorder:"#787878",
    text:"#e8e8e8", dim:"#909090", red:"#d23232", black:"#191919",
    gold:"#e6be46", goldBright:"#ffd850", green:"#64dc78",
    cyan:"#5ac8dc", seat:"#2d323c", seatAct:"#4d6491",
    seatFold:"#1e1e22", seatWin:"#4a6a38",
};

function render() {
    ctx.fillStyle = COLOR.bg;
    ctx.fillRect(0, 0, W, H);
    if (!table || gameOver) { renderGameOver(); return; }
    ctx.fillStyle = COLOR.feltEdge;
    ctx.beginPath(); ctx.ellipse(CX, CY, RX+16, RY+16, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COLOR.felt;
    ctx.beginPath(); ctx.ellipse(CX, CY, RX, RY, 0, 0, Math.PI*2); ctx.fill();
    drawBoard();
    ctx.fillStyle = COLOR.gold;
    ctx.font = "bold 32px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (table.street === ST_OVER && table.winners.length > 0) {
        let text = "★ ";
        if (table.winners.length === 1) {
            const w = table.winners[0];
            text += (w === mySeat ? "你" : "座位" + w) + " 赢得 $" + table.wonAmount[w];
        } else {
            text += "平局：";
            for (const w of table.winners)
                text += (w === mySeat ? "你" : "座" + w) + " $" + table.wonAmount[w] + "  ";
        }
        ctx.fillStyle = COLOR.goldBright;
        ctx.fillText(text, CX, CY - RY + 60);
    } else {
        ctx.fillText("底池 $" + table.pot, CX, CY - RY + 60);
    }
    const my = (mySeat >= 0) ? mySeat : 0;
    for (let i = 0; i < table.numSeats; i++) {
        const displayIdx = (i - my + table.numSeats) % table.numSeats;
        const ang = Math.PI/2 + (2*Math.PI*displayIdx) / table.numSeats;
        const px = CX + Math.cos(ang) * RX * 0.92;
        const py = CY + Math.sin(ang) * RY * 1.08;
        drawSeat(px, py, table.players[i], i);
    }
    drawStatusBar();
}

function drawBoard() {
    const CW = 64, CH = 88, GAP = 10;
    const totalW = CW*5 + GAP*4;
    const x0 = CX - totalW/2;
    const y0 = CY - CH/2;
    for (let i = 0; i < 5; i++) {
        const x = x0 + i*(CW+GAP);
        if (i < table.boardCount) drawCard(x, y0, CW, CH, table.board[i], true);
        else drawCardSlot(x, y0, CW, CH);
    }
}

function drawCard(x, y, w, h, c, faceUp) {
    roundRect(x, y, w, h, 8);
    if (!faceUp || !c.valid()) {
        ctx.fillStyle = COLOR.cardBack; ctx.fill();
        ctx.strokeStyle = "#b0b8e0"; ctx.lineWidth = 1;
        roundRect(x+5, y+5, w-10, h-10, 5); ctx.stroke();
        return;
    }
    ctx.fillStyle = COLOR.cardFace; ctx.fill();
    ctx.strokeStyle = COLOR.cardBorder; ctx.lineWidth = 1; ctx.stroke();
    const col = c.isRed() ? COLOR.red : COLOR.black;
    ctx.fillStyle = col;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "bold " + Math.floor(h*0.32) + "px Consolas, monospace";
    ctx.fillText(c.label(), x+6, y+4);
    ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.font = Math.floor(h*0.48) + "px 'Segoe UI Symbol'";
    ctx.fillText(c.symbol(), x+w-6, y+h-4);
}

function drawCardSlot(x, y, w, h) {
    roundRect(x, y, w, h, 8);
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 2; ctx.setLineDash([6,4]); ctx.stroke();
    ctx.setLineDash([]);
}

function drawSeat(px, py, p, idx) {
    const SW = 160, SH = 66;
    const sx = px - SW/2, sy = py - SH/2;
    const isMe = idx === mySeat;
    const isActive = idx === table.toAct && table.street !== ST_OVER;
    const isWinner = table.street === ST_OVER && table.winners.includes(idx);
    let bg = COLOR.seat;
    if (isWinner) bg = COLOR.seatWin;
    else if (p.folded) bg = COLOR.seatFold;
    else if (isActive) bg = COLOR.seatAct;
    roundRect(sx, sy, SW, SH, 12);
    ctx.fillStyle = bg; ctx.fill();
    if (isWinner) { ctx.strokeStyle = COLOR.goldBright; ctx.lineWidth = 4; ctx.stroke(); }
    else if (isActive) { ctx.strokeStyle = COLOR.gold; ctx.lineWidth = 3; ctx.stroke(); }
    else { ctx.strokeStyle = "#5a5f6a"; ctx.lineWidth = 1; ctx.stroke(); }

    ctx.textAlign = "left"; ctx.textBaseline = "top";
    let name = isMe ? "你" : (idx === 0 && isHost ? "房主" : "座位 " + idx);
    if (isWinner) name = "★ " + name;
    ctx.fillStyle = isWinner ? COLOR.goldBright : p.folded ? COLOR.dim : COLOR.text;
    ctx.font = "bold 15px 'Microsoft YaHei', sans-serif";
    ctx.fillText(name, sx+12, sy+6);

    ctx.font = "bold 18px Consolas, monospace";
    ctx.fillStyle = p.folded ? COLOR.dim : COLOR.gold;
    ctx.fillText("$" + p.stack, sx+12, sy+28);

    ctx.textAlign = "right";
    ctx.font = "bold 13px 'Microsoft YaHei', sans-serif";
    const arx = sx + SW - 10, ary = sy + 32;
    if (p.allIn) { ctx.fillStyle = COLOR.red; ctx.fillText("全下", arx, ary); }
    else if (p.folded) { ctx.fillStyle = COLOR.dim; ctx.fillText("弃牌", arx, ary); }
    else if (p.betRound > 0) {
        ctx.fillStyle = COLOR.green;
        ctx.fillText("下注 $" + p.betRound, arx, ary);
    }

    if (!p.folded && p.inHand) {
        const CW = 46, CH = 64, GAP = 6;
        const totalW = CW*2 + GAP;
        const hx = px - totalW/2;
        const hy = py > CY ? py - SH/2 - 8 - CH : py + SH/2 + 8;
        const showdown = table.wentToShowdown && (table.street === ST_SHOWDOWN || table.street === ST_OVER);
        const showHole = isMe || showdown;
        for (let i = 0; i < 2; i++)
            drawCard(hx + i*(CW+GAP), hy, CW, CH, p.hole[i], showHole);
    }
}

function drawStatusBar() {
    ctx.fillStyle = "#0f1218";
    ctx.fillRect(0, 0, W, 40);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "bold 16px 'Microsoft YaHei', sans-serif";
    ctx.fillStyle = COLOR.text;
    const left = "第 " + handNum + " 手   |   " + STREET_NAMES[table.street]
               + "   |   底池 $" + table.pot;
    ctx.fillText(left, 16, 20);
    if (lastAction) {
        ctx.textAlign = "center";
        ctx.fillStyle = COLOR.cyan;
        ctx.font = "15px 'Microsoft YaHei', sans-serif";
        ctx.fillText(lastAction, W/2 + 100, 20);
    }
    let status = "", col = COLOR.text;
    if (gameOver) { status = "游戏结束"; col = COLOR.red; }
    else if (table.street === ST_OVER) { status = "本手结束"; col = COLOR.gold; }
    else if (table.toAct === mySeat) { status = "轮到你"; col = COLOR.green; }
    else if (table.toAct >= 0) {
        status = "等待 " + (table.toAct === 0 ? "房主" : "座位 " + table.toAct);
        col = COLOR.dim;
    }
    ctx.textAlign = "right"; ctx.fillStyle = col;
    ctx.font = "bold 16px 'Microsoft YaHei', sans-serif";
    ctx.fillText(status, W-16, 20);
}

function renderGameOver() {
    if (!table) return;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = COLOR.goldBright;
    ctx.font = "bold 48px 'Microsoft YaHei', sans-serif";
    ctx.fillText("游戏结束", CX, 100);
    const rows = [];
    for (let i = 0; i < table.numSeats; i++) {
        if (!table.players[i].occupied) continue;
        rows.push({ seat: i, stack: table.players[i].stack });
    }
    rows.sort((a, b) => b.stack - a.stack);
    const startY = 200, rowH = 50;
    const panelW = 640, panelX = CX - panelW/2;
    roundRect(panelX, 160, panelW, rows.length*rowH + 40, 16);
    ctx.fillStyle = "#20242e"; ctx.fill();
    ctx.strokeStyle = "#3a70b0"; ctx.lineWidth = 2; ctx.stroke();
    rows.forEach((r, i) => {
        const y = startY + i*rowH;
        const isMe = r.seat === mySeat;
        if (isMe) {
            ctx.fillStyle = "#2a3a54";
            roundRect(panelX+15, y-18, panelW-30, rowH-8, 8); ctx.fill();
        }
        ctx.textAlign = "left";
        ctx.fillStyle = isMe ? COLOR.goldBright : COLOR.text;
        ctx.font = "bold 20px 'Microsoft YaHei', sans-serif";
        ctx.fillText("第 " + (i+1) + " 名", panelX+40, y);
        ctx.fillText(isMe ? "你" : (r.seat === 0 ? "房主" : "座位 " + r.seat),
                     panelX+200, y);
        ctx.textAlign = "right"; ctx.fillStyle = COLOR.gold;
        ctx.font = "bold 22px Consolas, monospace";
        ctx.fillText("$" + r.stack, panelX + panelW - 40, y);
    });
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.arcTo(x+w, y, x+w, y+r, r);
    ctx.lineTo(x+w, y+h-r);
    ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    ctx.lineTo(x+r, y+h);
    ctx.arcTo(x, y+h, x, y+h-r, r);
    ctx.lineTo(x, y+r);
    ctx.arcTo(x, y, x+r, y, r);
    ctx.closePath();
}

// ============================================================================
//  控制按钮
// ============================================================================
function updateControls() {
    const el = document.getElementById("controls");
    el.innerHTML = "";
    if (!table) return;
    if (gameOver) {
        el.appendChild(makeBtn("重新开始", "primary", () => location.reload()));
        return;
    }
    if (waitingNextHand) {
        if (isHost) el.appendChild(makeBtn("下一手", "primary", () => startNextHand()));
        else {
            const b = makeBtn("等待房主开始下一手…", "", () => {});
            b.disabled = true;
            el.appendChild(b);
        }
        return;
    }
    const isMyTurn = table.toAct === mySeat;
    const me = table.players[mySeat];
    if (!me) return;
    const toCall = table.currentBet - me.betRound;
    const bFold = makeBtn("弃牌", "danger", () => onHumanAct(ACT_FOLD, 0));
    const bCall = makeBtn(
        toCall > 0 ? "跟注 $" + Math.min(toCall, me.stack) : "过牌", "",
        () => onHumanAct(toCall > 0 ? ACT_CALL : ACT_CHECK, 0));
    const bAllIn = makeBtn("全下", "warn", () => onHumanAct(ACT_ALLIN, 0));
    bFold.disabled = bCall.disabled = bAllIn.disabled = !isMyTurn;
    el.appendChild(bFold); el.appendChild(bCall);
    const minT = table.currentBet + table.minRaise;
    const maxT = me.betRound + me.stack;
    const input = document.createElement("input");
    input.type = "number";
    input.value = Math.min(minT, maxT);
    input.min = minT; input.max = maxT;
    input.disabled = !isMyTurn || maxT <= table.currentBet;
    el.appendChild(input);
    const bRaise = makeBtn("加注", "primary", () => {
        const amt = parseInt(input.value) || minT;
        onHumanAct(ACT_RAISE, Math.max(minT, Math.min(amt, maxT)));
    });
    bRaise.disabled = !isMyTurn || maxT <= table.currentBet;
    el.appendChild(bRaise); el.appendChild(bAllIn);
    if (isMyTurn && maxT > table.currentBet) {
        const quick = [
            ["最小", minT],
            ["½ 池", table.currentBet + Math.floor(table.pot/2)],
            ["底池", table.currentBet + table.pot],
            ["全下", maxT],
        ];
        for (const [label, v] of quick) {
            const val = Math.max(minT, Math.min(v, maxT));
            const b = makeBtn(label, "", () => { input.value = val; });
            b.disabled = !isMyTurn;
            el.appendChild(b);
        }
    }
}

function makeBtn(text, cls, onClick) {
    const b = document.createElement("button");
    b.textContent = text;
    if (cls) b.className = cls;
    b.onclick = onClick;
    return b;
}

// ============================================================================
//  大厅事件
// ============================================================================
document.getElementById("btnHost").onclick = () => startAsHost();
document.getElementById("btnSolo").onclick = () => startSoloGame();
document.getElementById("btnJoin").onclick = () => {
    document.getElementById("lobbyForm").style.display = "none";
    document.getElementById("joinInfo").style.display = "block";
};
document.getElementById("btnConnect").onclick = () => {
    const code = document.getElementById("joinCode").value.trim().toUpperCase();
    if (code.length !== 6) {
        document.getElementById("joinStatus").textContent = "房间码是 6 位";
        return;
    }
    document.getElementById("joinStatus").textContent = "连接中…";
    isHost = false;
    startAsClient(code);
};
document.getElementById("btnCancelJoin").onclick = () => {
    if (peer) { peer.destroy(); peer = null; }
    document.getElementById("lobbyForm").style.display = "block";
    document.getElementById("joinInfo").style.display = "none";
    document.getElementById("joinStatus").textContent = "";
};
document.getElementById("btnStartGame").onclick = () => startGameAsHost();
document.getElementById("btnCancelHost").onclick = () => cancelHost();

</script>
