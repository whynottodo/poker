<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>德州扑克</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #14171c; color: #e8e8e8;
       font-family: "Microsoft YaHei", sans-serif; overflow-x: hidden; }
#app { max-width: 1100px; margin: 0 auto; padding: 12px; }
#status { text-align: center; font-size: 20px; font-weight: bold;
          padding: 8px; color: #f0c040; min-height: 30px; }
#table {
    display: block;
    width: 100%;
    height: auto;              /* ★ 关键：保持宽高比 */
    max-width: 1100px;
    margin: 0 auto;
    background: #14171c;
    border-radius: 8px;
}
#log { margin: 12px 0; padding: 10px 16px; background: #1e222a;
       border-radius: 6px; font-size: 14px; line-height: 1.7;
       min-height: 60px; max-height: 120px; overflow-y: auto; color: #b0b8c0; }
.controls { display: flex; gap: 10px; justify-content: center;
            padding: 12px; flex-wrap: wrap; }
button { padding: 10px 22px; font-size: 15px; border-radius: 6px;
         border: 1px solid #3a4050; background: #252b38; color: #e8e8e8;
         cursor: pointer; font-family: inherit; }
button:hover:not(:disabled) { background: #303748; }
button:disabled { opacity: 0.35; cursor: not-allowed; }
button.primary { background: #2d5aa8; border-color: #2d5aa8; }
button.primary:hover:not(:disabled) { background: #3768c0; }
button.danger { background: #8a2b2b; border-color: #8a2b2b; }
button.danger:hover:not(:disabled) { background: #a53535; }
button.warn { background: #8a6b1a; border-color: #8a6b1a; }
button.warn:hover:not(:disabled) { background: #a5801f; }
input, select { padding: 9px 10px; font-size: 15px; border-radius: 5px;
                border: 1px solid #3a4050; background: #1a1e26; color: #e8e8e8;
                font-family: inherit; }
input:focus, select:focus { outline: none; border-color: #4a70b0; }
#lobby { display: flex; flex-direction: column; align-items: center;
         justify-content: center; min-height: 95vh; padding: 20px; }
#lobby h1 { font-size: 44px; color: #e6be46; margin: 12px 0 24px;
            letter-spacing: 8px; }
.lobby-panel { background: #20242e; border: 2px solid #3a70b0;
               border-radius: 16px; padding: 28px 36px; min-width: 420px; }
.row { display: flex; align-items: center; margin: 12px 0;
       justify-content: space-between; }
.row label { color: #d0d0d0; font-size: 16px; }
.row input, .row select { width: 220px; }
.buttons { display: flex; gap: 16px; margin-top: 22px; justify-content: center; }
.buttons button { padding: 12px 30px; font-size: 17px; }
#roomCode { font-size: 56px; font-family: Consolas, monospace;
            letter-spacing: 10px; color: #ffd850; text-align: center;
            margin: 18px 0; font-weight: bold; }
#hostInfo, #joinInfo { text-align: center; }
#hostInfo p, #joinInfo p { color: #c0c0c0; font-size: 16px; margin: 8px 0; }
#joinCode { font-size: 30px; width: 220px; text-align: center;
            letter-spacing: 8px; text-transform: uppercase;
            font-family: Consolas, monospace; }
#joinStatus { color: #f0c040; margin-top: 12px; min-height: 24px; }
/* ===== 手机适配 ===== */
@media (max-width: 768px) {
    #app { padding: 4px; max-width: 100vw; }

    #lobby { padding: 10px; min-height: 100vh; }
    #lobby h1 { font-size: 26px; letter-spacing: 4px; margin: 8px 0 16px; }

    .lobby-panel {
        min-width: 0;
        width: 94%;
        padding: 18px 16px;
        border-radius: 12px;
    }
    .row {
        flex-direction: column;
        align-items: stretch;
        margin: 10px 0;
    }
    .row label { margin-bottom: 4px; font-size: 14px; color: #b0b0b0; }
    .row input, .row select { width: 100%; font-size: 16px; }

    .buttons { flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .buttons button { padding: 10px 16px; font-size: 15px; flex: 1 1 auto; min-width: 100px; }

    #roomCode { font-size: 36px; letter-spacing: 6px; margin: 12px 0; }
    #joinCode { font-size: 22px; width: 160px; letter-spacing: 4px; }

    #status { font-size: 15px; padding: 4px; min-height: 22px; }
    #log { font-size: 12px; min-height: 44px; max-height: 80px; padding: 6px 10px; margin: 6px 0; }

    .controls { padding: 6px; gap: 6px; }
    .controls button { padding: 8px 12px; font-size: 13px; }
    .controls input { width: 64px; font-size: 14px; padding: 6px; }
}

/* 竖屏时提示用户横屏 */
@media (max-width: 768px) and (orientation: portrait) {
    #table { transform: rotate(0deg); }
    body::before {
        content: "📱 横屏体验更佳";
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(230, 190, 70, 0.9);
        color: #14171c;
        padding: 6px 14px;
        border-radius: 16px;
        font-size: 12px;
        font-weight: bold;
        z-index: 999;
        pointer-events: none;
    }
}
</style>

<body>

  <div class="lobby-panel" id="lobbyForm">

<div id="app" style="display:none">
  <div id="status">准备开始</div>
  <canvas id="table" width="1100" height="700"></canvas>

  <div class="controls" id="controls"></div>

<script src="https://cdn.bootcdn.net/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
// ============================================================================
//  Card
// ============================================================================
const RANK_LABELS = ["2","3","4","5","6","7","8","9","T","J","Q","K","A"];
const SUIT_SYMBOLS = ["♣","♦","♥","♠"];

class Card {
    constructor(v) { this.v = v; }
    rank() { return this.v >> 2; }
    suit() { return this.v & 3; }
    valid() { return this.v < 52; }
    isRed() { return this.suit() === 1 || this.suit() === 2; }
    label() { return this.valid() ? RANK_LABELS[this.rank()] : "?"; }
    symbol() { return this.valid() ? SUIT_SYMBOLS[this.suit()] : "?"; }
}
const INV = new Card(0xFF);

// ============================================================================
//  Evaluator
// ============================================================================
const HIGH_CARD=0, PAIR=1, TWO_PAIR=2, TRIPS=3, STRAIGHT=4,
      FLUSH=5, FULL_HOUSE=6, QUADS=7, STRAIGHT_FLUSH=8;
const HAND_NAMES = ["高牌","对子","两对","三条","顺子","同花","葫芦","四条","同花顺"];

function eval5(vs) {
    const sorted = vs.slice().sort((a,b) => (b>>2)-(a>>2));
    const r = sorted.map(v => v>>2);
    const s = sorted.map(v => v&3);
    const flush = s[0]===s[1] && s[1]===s[2] && s[2]===s[3] && s[3]===s[4];

    let straight = -1;
    if (r[0]-r[4]===4 && r[0]!==r[1] && r[1]!==r[2] && r[2]!==r[3] && r[3]!==r[4])
        straight = r[0];
    else if (r[0]===12 && r[1]===3 && r[2]===2 && r[3]===1 && r[4]===0)
        straight = 3;

    if (straight >= 0) {
        const cat = flush ? STRAIGHT_FLUSH : STRAIGHT;
        return (cat<<20) | (straight<<16);
    }
    if (flush) {
        let v = FLUSH<<20;
        for (let i=0; i<5; i++) v |= r[i] << (16-4*i);
        return v;
    }
    const counts = {};
    for (const x of r) counts[x] = (counts[x]||0)+1;
    const groups = Object.entries(counts).map(([k,v]) => [+k,v]);
    groups.sort((a,b) => b[1]-a[1] || b[0]-a[0]);
    const pack = (cat, ranks) => {
        let v = cat<<20;
        for (let i=0; i<ranks.length && i<5; i++) v |= ranks[i] << (16-4*i);
        return v;
    };
    if (groups[0][1]===4) return pack(QUADS, [groups[0][0], groups[1][0]]);
    if (groups[0][1]===3 && groups[1] && groups[1][1]===2)
        return pack(FULL_HOUSE, [groups[0][0], groups[1][0]]);
    if (groups[0][1]===3)
        return pack(TRIPS, [groups[0][0], groups[1][0], groups[2][0]]);
    if (groups[0][1]===2 && groups[1] && groups[1][1]===2)
        return pack(TWO_PAIR, [groups[0][0], groups[1][0], groups[2][0]]);
    if (groups[0][1]===2)
        return pack(PAIR, [groups[0][0], groups[1][0], groups[2][0], groups[3][0]]);
    return pack(HIGH_CARD, r);
}

function eval7(vs) {
    let best = 0;
    for (let a=0;a<3;a++) for (let b=a+1;b<4;b++) for (let c=b+1;c<5;c++)
    for (let d=c+1;d<6;d++) for (let e=d+1;e<7;e++) {
        const v = eval5([vs[a],vs[b],vs[c],vs[d],vs[e]]);
        if (v > best) best = v;
    }
    return best;
}

// ============================================================================
//  Table / Player
// ============================================================================
const ST_IDLE=0, ST_PREFLOP=1, ST_FLOP=2, ST_TURN=3, ST_RIVER=4,
      ST_SHOWDOWN=5, ST_OVER=6;
const STREET_NAMES = ["未开始","翻牌前","翻牌","转牌","河牌","摊牌","本手结束"];
const ACT_FOLD=0, ACT_CHECK=1, ACT_CALL=2, ACT_BET=3, ACT_RAISE=4, ACT_ALLIN=5;

class Player {
    constructor(seat) {
        this.seat = seat;
        this.stack = 0; this.betRound = 0; this.betTotal = 0;
        this.hole = [INV, INV];
        this.occupied = false; this.inHand = false;
        this.folded = false; this.allIn = false; this.acted = false;
    }
    canAct() { return this.inHand && !this.folded && !this.allIn && this.stack > 0; }
    alive() { return this.inHand && !this.folded; }
}

class Table {
    constructor(numSeats, sb, bb, stack) {
        this.numSeats = numSeats;
        this.smallBlind = sb; this.bigBlind = bb;
        this.startingStack = stack;
        this.players = Array.from({length:numSeats}, (_,i) => new Player(i));
        this.button = -1;
        this.board = [INV, INV, INV, INV, INV];
        this.boardCount = 0;
        this.street = ST_IDLE;
        this.toAct = -1;
        this.currentBet = 0; this.minRaise = 0; this.pot = 0;
        this.activeCount = 0;
        this.winners = [];
        this.wonAmount = new Array(numSeats).fill(0);
        this.deck = [];
        this.rngState = 0x12345678;
        this.wentToShowdown = false;
    }
    rng() {
        let x = this.rngState;
        x ^= x << 13; x >>>= 0;
        x ^= x >> 17;
        x ^= x << 5; x >>>= 0;
        this.rngState = x;
        return x / 4294967296;
    }
    seat(i, stack) { this.players[i].occupied = true; this.players[i].stack = stack; }

    nextInHand(from) {
        for (let i=1; i<=this.numSeats; i++) {
            const idx = (from+i) % this.numSeats;
            if (this.players[idx].inHand) return idx;
        }
        return -1;
    }
    nextCanAct(from) {
        for (let i=0; i<this.numSeats; i++) {
            const idx = (from+i) % this.numSeats;
            if (this.players[idx].canAct()) return idx;
        }
        return -1;
    }
    roundOver() {
        for (const p of this.players) {
            if (!p.canAct()) continue;
            if (!p.acted) return false;
            if (p.betRound < this.currentBet) return false;
        }
        return true;
    }

    startHand(seed) {
        this.rngState = seed >>> 0 || 0x12345678;
        this.wentToShowdown = false;
        for (const p of this.players) {
            p.inHand = p.occupied && p.stack > 0;
            p.folded = false; p.allIn = false; p.acted = false;
            p.betRound = 0; p.betTotal = 0;
            p.hole = [INV, INV];
        }
        for (let i=0; i<5; i++) this.board[i] = INV;
        this.boardCount = 0; this.pot = 0;
        this.winners = []; this.wonAmount.fill(0);

        this.activeCount = this.players.filter(p => p.inHand).length;
        if (this.activeCount < 2) { this.street = ST_OVER; return; }

        do { this.button = (this.button+1) % this.numSeats; }
        while (!this.players[this.button].inHand);

        this.deck = [];
        for (let i=0; i<52; i++) this.deck.push(i);
        for (let i=51; i>0; i--) {
            const j = Math.floor(this.rng() * (i+1));
            [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
        }
        let di = 0;
        for (let k=0; k<2; k++) {
            let i = (this.button+1) % this.numSeats;
            for (let m=0; m<this.numSeats; m++) {
                if (this.players[i].inHand)
                    this.players[i].hole[k] = new Card(this.deck[di++]);
                i = (i+1) % this.numSeats;
            }
        }
        const sb = this.nextInHand(this.button);
        const bb = this.nextInHand(sb);
        this.postBlind(sb, this.smallBlind);
        this.postBlind(bb, this.bigBlind);

        this.street = ST_PREFLOP;
        this.currentBet = this.bigBlind;
        this.minRaise = this.bigBlind;
        this.toAct = this.nextCanAct((bb+1) % this.numSeats);

        if (this.players.filter(p => p.canAct()).length <= 1) this.runOut();
    }

    postBlind(seat, amount) {
        const p = this.players[seat];
        const actual = Math.min(amount, p.stack);
        p.stack -= actual; p.betRound += actual;
        p.betTotal += actual; this.pot += actual;
        if (p.stack === 0) p.allIn = true;
    }

    act(action, amount = 0) {
        if (this.toAct < 0 || this.street === ST_OVER) return;
        const p = this.players[this.toAct];
        switch (action) {
            case ACT_FOLD: p.folded = true; p.acted = true; this.activeCount--; break;
            case ACT_CHECK: p.acted = true; break;
            case ACT_CALL: {
                const toCall = this.currentBet - p.betRound;
                const actual = Math.min(toCall, p.stack);
                p.stack -= actual; p.betRound += actual;
                p.betTotal += actual; this.pot += actual;
                if (p.stack === 0) p.allIn = true;
                p.acted = true; break;
            }
            case ACT_BET:
            case ACT_RAISE: {
                let target = Math.max(amount, this.currentBet + this.minRaise);
                let delta = Math.min(target - p.betRound, p.stack);
                p.stack -= delta; p.betRound += delta;
                p.betTotal += delta; this.pot += delta;
                const rs = p.betRound - this.currentBet;
                if (rs > 0) {
                    const full = rs >= this.minRaise;
                    this.currentBet = p.betRound;
                    if (full) {
                        this.minRaise = rs;
                        for (const q of this.players)
                            if (q !== p && q.canAct()) q.acted = false;
                    }
                }
                if (p.stack === 0) p.allIn = true;
                p.acted = true; break;
            }
            case ACT_ALLIN: {
                const delta = p.stack;
                p.stack = 0;
                p.betRound += delta; p.betTotal += delta; this.pot += delta;
                p.allIn = true;
                if (p.betRound > this.currentBet) {
                    const rs = p.betRound - this.currentBet;
                    const full = rs >= this.minRaise;
                    this.currentBet = p.betRound;
                    if (full) {
                        this.minRaise = rs;
                        for (const q of this.players)
                            if (q !== p && q.canAct()) q.acted = false;
                    }
                }
                p.acted = true; break;
            }
        }
        if (this.activeCount <= 1) { this.awardLastAlive(); return; }
        if (this.roundOver()) this.endRound();
        else this.toAct = this.nextCanAct((this.toAct+1) % this.numSeats);
    }

    endRound() {
        for (const p of this.players) { p.betRound = 0; p.acted = false; }
        this.currentBet = 0; this.minRaise = this.bigBlind;
        if (this.players.filter(p => p.canAct()).length <= 1) { this.runOut(); return; }
        switch (this.street) {
            case ST_PREFLOP: this.dealBoard(3); this.street = ST_FLOP; break;
            case ST_FLOP:    this.dealBoard(4); this.street = ST_TURN; break;
            case ST_TURN:    this.dealBoard(5); this.street = ST_RIVER; break;
            case ST_RIVER:   this.gotoShowdown(); return;
            default: return;
        }
        this.toAct = this.nextCanAct((this.button+1) % this.numSeats);
    }
    dealBoard(target) {
        while (this.boardCount < target)
            this.board[this.boardCount++] = new Card(this.deck.pop());
    }
    runOut() {
        while (this.boardCount < 5)
            this.board[this.boardCount++] = new Card(this.deck.pop());
        this.gotoShowdown();
    }
    awardLastAlive() {
        for (const p of this.players) {
            if (p.alive()) {
                p.stack += this.pot;
                this.wonAmount[p.seat] = this.pot;
                this.winners = [p.seat];
                this.pot = 0;
                break;
            }
        }
        this.street = ST_OVER;
    }
    gotoShowdown() {
        this.wentToShowdown = true;
        this.street = ST_SHOWDOWN;
        this.distributePots();
        this.street = ST_OVER;
    }
    distributePots() {
        const levels = [];
        for (const p of this.players)
            if (p.inHand && p.betTotal > 0) levels.push(p.betTotal);
        levels.sort((a,b) => a-b);
        const uniq = [...new Set(levels)];
        const wonAny = new Array(this.numSeats).fill(false);
        let prev = 0;
        for (const level of uniq) {
            let layer = 0;
            const participants = [];
            for (const p of this.players) {
                if (!p.inHand) continue;
                const contrib = Math.min(p.betTotal, level) - prev;
                if (contrib > 0) { layer += contrib; participants.push(p.seat); }
            }
            prev = level;
            if (layer === 0) continue;
            let best = 0, winners = [];
            for (const seat of participants) {
                const p = this.players[seat];
                if (!p.alive()) continue;
                const seven = [p.hole[0].v, p.hole[1].v,
                    this.board[0].v, this.board[1].v, this.board[2].v,
                    this.board[3].v, this.board[4].v];
                const v = eval7(seven);
                if (winners.length === 0 || v > best) { best = v; winners = [seat]; }
                else if (v === best) winners.push(seat);
            }
            if (winners.length === 0) continue;
            const share = Math.floor(layer / winners.length);
            const rem = layer % winners.length;
            winners.forEach((seat, k) => {
                this.players[seat].stack += share;
                this.wonAmount[seat] += share;
                if (k === 0) {
                    this.players[seat].stack += rem;
                    this.wonAmount[seat] += rem;
                }
                wonAny[seat] = true;
            });
        }
        this.winners = [];
        for (let i=0; i<this.numSeats; i++) if (wonAny[i]) this.winners.push(i);
        this.pot = 0;
    }
}

// ============================================================================
//  Bot
// ============================================================================
function chenScore(c1, c2) {
    let r1 = c1.rank(), r2 = c2.rank();
    if (r1 < r2) [r1, r2] = [r2, r1];
    if (r1 === r2) return Math.max(5, (r1+2)*2);
    let score;
    switch (r1) {
        case 12: score = 10; break;
        case 11: score = 8; break;
        case 10: score = 7; break;
        case 9: score = 6; break;
        default: score = (r1+2)/2;
    }
    if (c1.suit() === c2.suit()) score += 2;
    const gap = r1 - r2 - 1;
    if (gap === 1) score -= 1;
    else if (gap === 2) score -= 2;
    else if (gap === 3) score -= 4;
    else if (gap >= 4) score -= 5;
    if (r1 >= 9 && r2 >= 9) score += 1;
    return Math.max(0, score);
}

class Bot {
    decide(t, seat) {
        if (t.street === ST_PREFLOP) return this.preflop(t, seat);
        return this.postflop(t, seat);
    }

    // ============ 翻前 ============
    preflop(t, seat) {
        const p = t.players[seat];
        const toCall = t.currentBet - p.betRound;
        const cs = chenScore(p.hole[0], p.hole[1]);

        // 位置：相对按钮的距离
        const rel = (seat - t.button + t.numSeats) % t.numSeats;
        let th;
        if (rel === 1) th = 6;         // SB
        else if (rel === 2) th = 4;    // BB
        else if (rel === 0) th = 2;    // BTN
        else {
            const d = t.numSeats - 1 - rel;   // 距离 CO
            if (d <= 0) th = 5;               // CO
            else if (d === 1) th = 7;         // HJ
            else if (d === 2) th = 9;         // MP
            else th = 10;                     // UTG
        }

        const facingRaise = t.currentBet > t.bigBlind * 1.5;
        const facing3bet = t.currentBet > t.bigBlind * 3.5;
        if (facing3bet) th += 4;
        else if (facingRaise) th += 2.5;

        // 活跃对手数
        const activeOpp = t.players.filter(q => q !== p && q.alive()).length;
        if (activeOpp >= 3) th += 1;
        if (activeOpp >= 5) th += 1;

        // 小对子隐含赔率：深码放宽
        if (!facingRaise && p.hole[0].rank() === p.hole[1].rank()
            && p.hole[0].rank() <= 5 && p.stack > t.bigBlind * 25)
            th = Math.min(th, 4);

        // 概率化决策：避免死板
        const playProb = 1 / (1 + Math.exp(-(cs - th) / 2));
        if (Math.random() > playProb) {
            if (toCall === 0) return { action: ACT_CHECK, amount: 0 };
            return { action: ACT_FOLD, amount: 0 };
        }

        // BTN 偷盲
        if (rel === 0 && activeOpp <= 2 && !facingRaise && Math.random() < 0.55) {
            const target = Math.max(t.bigBlind * 3, t.currentBet + t.minRaise);
            return { action: ACT_RAISE,
                     amount: Math.min(target, p.betRound + p.stack) };
        }

        // 强度 → 加注频率
        const diff = cs - th;
        let strength = diff < 2 ? 0 : diff < 4 ? 1 : diff < 7 ? 2 : 3;
        let raiseProb = [0.12, 0.38, 0.75, 0.65][strength];
        if (rel === 0) raiseProb += 0.20;
        else if (rel === t.numSeats - 1) raiseProb += 0.12;

        if (p.stack > toCall && Math.random() < Math.min(1, raiseProb)) {
            let target = Math.max(t.bigBlind * 3, t.currentBet + t.minRaise);
            target = Math.min(target, p.betRound + p.stack);
            return { action: t.currentBet === 0 ? ACT_BET : ACT_RAISE, amount: target };
        }
        if (toCall === 0) return { action: ACT_CHECK, amount: 0 };
        return { action: ACT_CALL, amount: 0 };
    }

    // ============ 翻后（强化版） ============
    postflop(t, seat) {
        const p = t.players[seat];
        const toCall = t.currentBet - p.betRound;

        // 7 张牌评估
        const seven = [
            p.hole[0].v, p.hole[1].v,
            t.board[0].v, t.board[1].v, t.board[2].v,
            t.board[3].v, t.board[4].v
        ];
        const code = eval7(seven);
        const cat = code >> 20;
        const topRank = (code >> 16) & 0xF;

        // ---------- 精确强度（0-100） ----------
        let strength = 0;
        switch (cat) {
            case 0:  // 高牌
                strength = 8 + topRank * 2;        // 8-32
                break;
            case 1:  // 一对
                // 顶对 vs 中对 vs 底对用 topRank 粗略区分
                strength = 35 + topRank * 2;       // 35-59
                break;
            case 2:  // 两对
                strength = 62 + topRank * 1.5;     // 62-80
                break;
            case 3:  // 三条
                strength = 82;
                break;
            case 4:  // 顺子
                strength = 88;
                break;
            case 5:  // 同花
                strength = 91;
                break;
            case 6:  // 葫芦
                strength = 94;
                break;
            case 7:  // 四条
                strength = 97;
                break;
            case 8:  // 同花顺
                strength = 100;
                break;
        }

        // 位置感知
        const ip = this.hasPosition(t, seat);

        // 底池赔率 / SPR
        const pot = t.pot;
        const need = toCall > 0 ? toCall / (pot + toCall) : 0;
        const spr = pot > 0 ? p.stack / pot : 100;

        // ---------- 无人下注 ----------
        if (toCall === 0) {
            // 超强牌
            if (strength >= 85) {
                if (Math.random() < 0.85) return this.bet(t, p, 0.65);
                return { action: ACT_CHECK, amount: 0 };
            }
            // 强牌
            if (strength >= 60) {
                if (Math.random() < 0.75) return this.bet(t, p, 0.55);
                return { action: ACT_CHECK, amount: 0 };
            }
            // 中等
            if (strength >= 40) {
                if (Math.random() < 0.55) return this.bet(t, p, 0.45);
                return { action: ACT_CHECK, amount: 0 };
            }
            // 弱牌：诈唬（IP 更频繁）
            const bluffRate = ip ? 0.28 : 0.18;
            if (Math.random() < bluffRate) return this.bet(t, p, 0.5);
            return { action: ACT_CHECK, amount: 0 };
        }

        // ---------- 面对下注 ----------
        // 极强：加注
        if (strength >= 88) {
            if (Math.random() < 0.72 && p.stack > toCall * 2) {
                const target = Math.max(t.currentBet * 3, t.currentBet + t.minRaise);
                return { action: ACT_RAISE,
                         amount: Math.min(target, p.betRound + p.stack) };
            }
            return { action: ACT_CALL, amount: 0 };
        }
        // 强牌：跟为主，偶尔加
        if (strength >= 72) {
            if (Math.random() < 0.28 && p.stack > toCall * 2) {
                const target = t.currentBet + t.minRaise;
                return { action: ACT_RAISE,
                         amount: Math.min(target, p.betRound + p.stack) };
            }
            return { action: ACT_CALL, amount: 0 };
        }
        // 中等：按赔率跟
        if (strength >= 50) {
            if (need < 0.4) return { action: ACT_CALL, amount: 0 };
            if (Math.random() < 0.08 && ip) {
                const target = t.currentBet + t.minRaise;
                return { action: ACT_RAISE,
                         amount: Math.min(target, p.betRound + p.stack) };
            }
            return { action: ACT_FOLD, amount: 0 };
        }
        // 弱牌：看赔率，偶尔半诈唬
        if (strength >= 30) {
            if (need < 0.25 && Math.random() < 0.5) {
                return { action: ACT_CALL, amount: 0 };
            }
            return { action: ACT_FOLD, amount: 0 };
        }
        // 极弱：偶尔诈唬
        if (Math.random() < 0.06 && ip && p.stack > toCall * 4) {
            const target = t.currentBet + t.minRaise;
            return { action: ACT_RAISE,
                     amount: Math.min(target, p.betRound + p.stack) };
        }
        return { action: ACT_FOLD, amount: 0 };
    }

    // ============ 位置判断 ============
    hasPosition(t, seat) {
        // 后面没有活跃玩家 = 我在最后行动
        for (let i = 1; i < t.numSeats; i++) {
            const s = (seat + i) % t.numSeats;
            if (t.players[s].alive()) return false;
        }
        return true;
    }

    // ============ 下注尺度 ============
    bet(t, p, frac) {
        let target = t.currentBet + Math.floor(t.pot * frac);
        const lo = t.currentBet + t.minRaise;
        const hi = p.betRound + p.stack;
        target = Math.max(lo, Math.min(target, hi));
        if (target >= hi) return { action: ACT_ALLIN, amount: 0 };
        return { action: t.currentBet === 0 ? ACT_BET : ACT_RAISE, amount: target };
    }
}

//  网络层
// ============================================================================
let peer = null;
let conns = [];              // 房主：所有客户端连接
let connSeats = new Map();   // 房主：conn → seat 号
let hostConn = null;         // 客户端：房主的连接
let isHost = false;
let mySeat = 0;
let roomCode = '';
let nextSeat = 1;

function genRoomCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
}

// -------- 房主 --------
function startAsHost() {
    isHost = true;
    mySeat = 0;
    roomCode = genRoomCode();
    peer = new Peer('POKER-' + roomCode);

    peer.on('open', () => {
        document.getElementById('lobbyForm').style.display = 'none';
        document.getElementById('hostInfo').style.display = 'block';
        document.getElementById('roomCode').textContent = roomCode;
    });
    peer.on('error', e => {
        alert('创建房间失败：' + e.message);
        cancelHost();
    });
    peer.on('connection', conn => {
        conn.on('open', () => {
            conns.push(conn);
            const seat = nextSeat++;
            connSeats.set(conn, seat);
            conn.send({ type: 'init', seat, roomCode });
            document.getElementById('peerCount').textContent = conns.length;
        });
        conn.on('data', data => handleClientMessage(conn, data));
        conn.on('close', () => {
            conns = conns.filter(c => c !== conn);
            connSeats.delete(conn);
            document.getElementById('peerCount').textContent = conns.length;
        });
    });
}

function handleClientMessage(conn, data) {
    if (data.type === 'action') {
        const seat = connSeats.get(conn);
        if (seat === undefined) return;
        if (table.toAct !== seat) return;
        humanAction(seat, data.action, data.amount);
    }
}

function cancelHost() {
    if (peer) { peer.destroy(); peer = null; }
    conns = []; connSeats.clear(); nextSeat = 1;
    isHost = false;
    document.getElementById('lobbyForm').style.display = 'block';
    document.getElementById('hostInfo').style.display = 'none';
}

function startGameAsHost() {
    const cfg = readLobbyConfig();
    const humanSeats = 1 + conns.length;
    cfg.numSeats = Math.max(cfg.numSeats, humanSeats);
    gameConfig = cfg;

    // 通知所有客户端游戏配置
    for (const conn of conns) {
        conn.send({ type: 'start', config: cfg });
    }

    // 创建 table 和 bots
    table = new Table(cfg.numSeats, cfg.sb, cfg.bb, cfg.stack);
    for (let i = 0; i < cfg.numSeats; i++) table.seat(i, cfg.stack);
    bots = [];
    for (let i = 0; i < cfg.numSeats; i++) {
        bots.push(i < humanSeats ? null : new Bot());
    }
    humanSeatsSet = new Set();
    humanSeatsSet.add(0);
    for (const [, s] of connSeats) humanSeatsSet.add(s);

    gameOver = false;
    handNum = 0;
    lastAction = "";
    waitingNextHand = false;

    showGame();
    startNextHand();
}

// -------- 客户端 --------
function startAsClient(code) {
    peer = new Peer();
    peer.on('open', () => {
        hostConn = peer.connect('POKER-' + code, { reliable: true });
        hostConn.on('open', () => {
            document.getElementById('joinStatus').textContent = '已连接，等待房主开始…';
        });
        hostConn.on('data', data => handleHostMessage(data));
        hostConn.on('close', () => {
            alert('与房主断开');
            location.reload();
        });
    });
    peer.on('error', e => {
        document.getElementById('joinStatus').textContent = '连接失败：' + e.message;
    });
}

function handleHostMessage(data) {
    if (data.type === 'init') {
        mySeat = data.seat;
        roomCode = data.roomCode;
    }
    else if (data.type === 'start') {
        gameConfig = data.config;
        // 初始化本地 table（渲染用）
        table = new Table(gameConfig.numSeats, gameConfig.sb,
                          gameConfig.bb, gameConfig.stack);
        bots = [];
        gameOver = false;
        handNum = 0;
        lastAction = "";
        waitingNextHand = false;
        showGame();
    }
    else if (data.type === 'state') {
        applyState(data.view);
        handNum = data.handNum;
        lastAction = data.lastAction || "";
        waitingNextHand = (table.street === ST_OVER) && !data.gameOver;
        gameOver = data.gameOver;
        render();
        updateControls();
    }
}

function applyState(v) {
    table.numSeats = v.numSeats;
    table.button = v.button;
    table.boardCount = v.boardCount;
    for (let i = 0; i < 5; i++) table.board[i] = new Card(v.board[i]);
    table.street = v.street;
    table.toAct = v.toAct;
    table.currentBet = v.currentBet;
    table.minRaise = v.minRaise;
    table.pot = v.pot;
    table.activeCount = v.activeCount;
    table.winners = v.winners;
    table.wonAmount = v.wonAmount;
    table.wentToShowdown = v.wentToShowdown;
    for (let i = 0; i < v.numSeats; i++) {
        const p = table.players[i];
        const d = v.players[i];
        p.stack = d.stack;
        p.betRound = d.betRound;
        p.betTotal = d.betTotal;
        p.hole = [new Card(d.hole[0]), new Card(d.hole[1])];
        p.occupied = d.occupied;
        p.inHand = d.inHand;
        p.folded = d.folded;
        p.allIn = d.allIn;
        p.acted = d.acted;
    }
}

// -------- 序列化 --------
function serializeTableView(t, viewerSeat) {
    const showdown = t.wentToShowdown &&
                 (t.street === ST_SHOWDOWN || t.street === ST_OVER);
    return {
        numSeats: t.numSeats,
        wentToShowdown: t.wentToShowdown,
        button: t.button,
        boardCount: t.boardCount,
        board: t.board.map(c => c.v),
        street: t.street,
        toAct: t.toAct,
        currentBet: t.currentBet,
        minRaise: t.minRaise,
        pot: t.pot,
        activeCount: t.activeCount,
        winners: t.winners.slice(),
        wonAmount: t.wonAmount.slice(),
        players: t.players.map(p => ({
            stack: p.stack,
            betRound: p.betRound,
            betTotal: p.betTotal,
            hole: (p.seat === viewerSeat || showdown)
                    ? [p.hole[0].v, p.hole[1].v]
                    : [0xFF, 0xFF],
            occupied: p.occupied,
            inHand: p.inHand,
            folded: p.folded,
            allIn: p.allIn,
            acted: p.acted
        }))
    };
}

function broadcastState() {
    if (!isHost) return;
    for (const conn of conns) {
        const seat = connSeats.get(conn);
        conn.send({
            type: 'state',
            view: serializeTableView(table, seat),
            handNum: handNum,
            lastAction: lastAction,
            gameOver: gameOver
        });
    }
    render();
    updateControls();
}

//  游戏控制
// ============================================================================
let table = null;
let bots = [];
let gameConfig = { numSeats: 6, sb: 1, bb: 2, stack: 200 };
let gameOver = false;
let handNum = 0;
let lastAction = "";
let waitingNextHand = false;
let humanSeatsSet = new Set();

function isHumanSeat(seat) { return humanSeatsSet.has(seat); }

function readLobbyConfig() {
    const parts = document.getElementById('blinds').value.split('-');
    return {
        numSeats: parseInt(document.getElementById('seatCount').value),
        sb: parseInt(parts[0]),
        bb: parseInt(parts[1]),
        stack: parseInt(document.getElementById('startStack').value) || 200
    };
}

function startSoloGame() {
    const cfg = readLobbyConfig();
    gameConfig = cfg;
    table = new Table(cfg.numSeats, cfg.sb, cfg.bb, cfg.stack);
    for (let i = 0; i < cfg.numSeats; i++) table.seat(i, cfg.stack);
    bots = [null];
    for (let i = 1; i < cfg.numSeats; i++) bots.push(new Bot());
    humanSeatsSet = new Set([0]);
    isHost = true;
    mySeat = 0;

    gameOver = false; handNum = 0; lastAction = "";
    waitingNextHand = false;

    showGame();
    startNextHand();
}

function showGame() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('app').style.display = 'block';
}

function startNextHand() {
    if (gameOver) return;

    // 检查是否有人输光
    let busted = false;
    for (let i = 0; i < table.numSeats; i++) {
        if (table.players[i].occupied && table.players[i].stack <= 0) {
            busted = true; break;
        }
    }
    // 检查是否只剩一个还有筹码的玩家
    let aliveCount = 0;
    for (let i = 0; i < table.numSeats; i++) {
        if (table.players[i].occupied && table.players[i].stack > 0) aliveCount++;
    }
    if (aliveCount < 2) busted = true;

    if (busted) {
        gameOver = true;
        waitingNextHand = false;
        if (isHost && conns.length > 0) {
            broadcastState();   // ★ 关键：把 gameOver 广播出去
        }
        render();
        updateControls();
        return;
    }

    handNum++;
    table.startHand(Date.now() ^ (handNum * 7919));
    waitingNextHand = false;
    lastAction = "";
    log("=== 第 " + handNum + " 手开始 ===");
    if (isHost && conns.length > 0) broadcastState();
    render();
    updateControls();
    if (table.street !== ST_OVER) scheduleStep();
}

function scheduleStep() {
    if (table.street === ST_OVER) { onHandEnd(); return; }
    if (table.toAct < 0) return;

    if (isHumanSeat(table.toAct)) {
        if (isHost && conns.length > 0) broadcastState();
        updateControls();
        render();
        return;
    }
    setTimeout(() => {
        if (table.street === ST_OVER || table.toAct < 0) return;
        const seat = table.toAct;
        const d = bots[seat].decide(table, seat);
        const before = snapshot(table.players[seat]);
        table.act(d.action, d.amount);
        const after = snapshot(table.players[seat]);
        describeAction(seat, before, after);
        if (isHost && conns.length > 0) broadcastState();
        else { render(); }
        if (table.street === ST_OVER) onHandEnd();
        else scheduleStep();
    }, 700);
}

function onHandEnd() {
    waitingNextHand = true;
    render();
    updateControls();
    if (isHost && conns.length > 0) broadcastState();
}

function snapshot(p) {
    return { folded: p.folded, allIn: p.allIn,
             betRound: p.betRound, stack: p.stack };
}

function describeAction(seat, before, after) {
    const who = seat === mySeat ? "你" : "座位" + seat;
    let msg;
    if (!before.folded && after.folded) msg = who + " 弃牌";
    else if (!before.allIn && after.allIn) msg = who + " 全下 $" + after.betRound;
    else if (after.betRound > before.betRound) {
        if (before.betRound === 0) msg = who + " 下注 $" + after.betRound;
        else msg = who + " 加注到 $" + after.betRound;
    }
    else if (after.stack === before.stack) msg = who + " 过牌";
    else msg = who + " 跟注 $" + (before.stack - after.stack);
    lastAction = msg;
    log(msg);
}

function log(msg) {
    const el = document.getElementById("log");
    const lines = el.textContent.split("\n").filter(x => x && x !== "—");
    lines.push(msg);
    while (lines.length > 8) lines.shift();
    el.textContent = lines.join("\n");
}

function humanAction(seat, action, amount) {
    if (table.toAct !== seat) return;
    const before = snapshot(table.players[seat]);
    table.act(action, amount);
    const after = snapshot(table.players[seat]);
    describeAction(seat, before, after);
    if (isHost && conns.length > 0) broadcastState();
    else { render(); updateControls(); }
    if (table.street === ST_OVER) onHandEnd();
    else scheduleStep();
}

function onHumanAct(action, amount) {
    if (!isHost || (conns.length > 0 && mySeat !== 0 && !humanSeatsSet.has(0))) {
        // 客户端发动作给房主
    }
    if (isHost) {
        humanAction(mySeat, action, amount);
    } else {
        hostConn.send({ type: 'action', action, amount });
    }
}

// ============================================================================
const canvas = document.getElementById("table");
const ctx = canvas.getContext("2d");
const W = 1100, H = 700;
const CX = 550, CY = 340, RX = 440, RY = 230;

const COLOR = {
    bg:"#14171c", felt:"#14552c", feltEdge:"#5a3a1a",
    cardFace:"#fafaf5", cardBack:"#2d4196", cardBorder:"#787878",
    text:"#e8e8e8", dim:"#909090", red:"#d23232", black:"#191919",
    gold:"#e6be46", goldBright:"#ffd850", green:"#64dc78",
    cyan:"#5ac8dc", seat:"#2d323c", seatAct:"#4d6491",
    seatFold:"#1e1e22", seatWin:"#4a6a38",
};

function render() {
    ctx.fillStyle = COLOR.bg;
    ctx.fillRect(0, 0, W, H);
    if (!table || gameOver) { renderGameOver(); return; }

    ctx.fillStyle = COLOR.feltEdge;
    ctx.beginPath(); ctx.ellipse(CX, CY, RX+16, RY+16, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COLOR.felt;
    ctx.beginPath(); ctx.ellipse(CX, CY, RX, RY, 0, 0, Math.PI*2); ctx.fill();

    drawBoard();

    ctx.fillStyle = COLOR.gold;
    ctx.font = "bold 32px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (table.street === ST_OVER && table.winners.length > 0) {
        let text = "★ ";
        if (table.winners.length === 1) {
            const w = table.winners[0];
            text += (w === mySeat ? "你" : "座位" + w)
                  + " 赢得 $" + table.wonAmount[w];
        } else {
            text += "平局：";
            for (const w of table.winners)
                text += (w === mySeat ? "你" : "座" + w)
                      + " $" + table.wonAmount[w] + "  ";
        }
        ctx.fillStyle = COLOR.goldBright;
        ctx.fillText(text, CX, CY - RY + 60);
    } else {
        ctx.fillText("底池 $" + table.pot, CX, CY - RY + 60);
    }

    const my = (mySeat >= 0) ? mySeat : 0;
    for (let i = 0; i < table.numSeats; i++) {
        const displayIdx = (i - my + table.numSeats) % table.numSeats;
        const ang = Math.PI/2 + (2*Math.PI*displayIdx) / table.numSeats;
        const px = CX + Math.cos(ang) * RX * 0.92;
        const py = CY + Math.sin(ang) * RY * 1.08;
        drawSeat(px, py, table.players[i], i);
    }
    drawStatusBar();
}

function drawBoard() {
    const CW = 64, CH = 88, GAP = 10;
    const totalW = CW*5 + GAP*4;
    const x0 = CX - totalW/2;
    const y0 = CY - CH/2;
    for (let i = 0; i < 5; i++) {
        const x = x0 + i*(CW+GAP);
        if (i < table.boardCount) drawCard(x, y0, CW, CH, table.board[i], true);
        else drawCardSlot(x, y0, CW, CH);
    }
}

function drawCard(x, y, w, h, c, faceUp) {
    roundRect(x, y, w, h, 8);
    if (!faceUp || !c.valid()) {
        ctx.fillStyle = COLOR.cardBack; ctx.fill();
        ctx.strokeStyle = "#b0b8e0"; ctx.lineWidth = 1;
        roundRect(x+5, y+5, w-10, h-10, 5); ctx.stroke();
        return;
    }
    ctx.fillStyle = COLOR.cardFace; ctx.fill();
    ctx.strokeStyle = COLOR.cardBorder; ctx.lineWidth = 1; ctx.stroke();
    const col = c.isRed() ? COLOR.red : COLOR.black;
    ctx.fillStyle = col;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "bold " + Math.floor(h*0.32) + "px Consolas, monospace";
    ctx.fillText(c.label(), x+6, y+4);
    ctx.textAlign = "right"; ctx.textBaseline = "bottom";
    ctx.font = Math.floor(h*0.48) + "px 'Segoe UI Symbol'";
    ctx.fillText(c.symbol(), x+w-6, y+h-4);
}

function drawCardSlot(x, y, w, h) {
    roundRect(x, y, w, h, 8);
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 2; ctx.setLineDash([6,4]); ctx.stroke();
    ctx.setLineDash([]);
}

function drawSeat(px, py, p, idx) {
    const SW = 160, SH = 66;
    const sx = px - SW/2, sy = py - SH/2;
    const isMe = idx === mySeat;
    const isActive = idx === table.toAct && table.street !== ST_OVER;
    const isWinner = table.street === ST_OVER && table.winners.includes(idx);

    let bg = COLOR.seat;
    if (isWinner) bg = COLOR.seatWin;
    else if (p.folded) bg = COLOR.seatFold;
    else if (isActive) bg = COLOR.seatAct;

    roundRect(sx, sy, SW, SH, 12);
    ctx.fillStyle = bg; ctx.fill();
    if (isWinner) {
        ctx.strokeStyle = COLOR.goldBright; ctx.lineWidth = 4; ctx.stroke();
    } else if (isActive) {
        ctx.strokeStyle = COLOR.gold; ctx.lineWidth = 3; ctx.stroke();
    } else {
        ctx.strokeStyle = "#5a5f6a"; ctx.lineWidth = 1; ctx.stroke();
    }

    ctx.textAlign = "left"; ctx.textBaseline = "top";
    let name = isMe ? "你" : (idx === 0 && isHost ? "房主" : "座位 " + idx);
    if (isWinner) name = "★ " + name;
    ctx.fillStyle = isWinner ? COLOR.goldBright
                 : p.folded ? COLOR.dim : COLOR.text;
    ctx.font = "bold 15px 'Microsoft YaHei', sans-serif";
    ctx.fillText(name, sx+12, sy+6);

    ctx.font = "bold 18px Consolas, monospace";
    ctx.fillStyle = p.folded ? COLOR.dim : COLOR.gold;
    ctx.fillText("$" + p.stack, sx+12, sy+28);

    ctx.textAlign = "right";
    ctx.font = "bold 13px 'Microsoft YaHei', sans-serif";
    const arx = sx + SW - 10, ary = sy + 32;
    if (p.allIn) { ctx.fillStyle = COLOR.red; ctx.fillText("全下", arx, ary); }
    else if (p.folded) { ctx.fillStyle = COLOR.dim; ctx.fillText("弃牌", arx, ary); }
    else if (p.betRound > 0) {
        ctx.fillStyle = COLOR.green;
        ctx.fillText("下注 $" + p.betRound, arx, ary);
    }

    if (!p.folded && p.inHand) {
        const CW = 46, CH = 64, GAP = 6;
        const totalW = CW*2 + GAP;
        const hx = px - totalW/2;
        const hy = py > CY ? py - SH/2 - 8 - CH : py + SH/2 + 8;
        const showdown = table.wentToShowdown &&
                 (table.street === ST_SHOWDOWN || table.street === ST_OVER);
        const showHole = isMe || showdown;
        for (let i = 0; i < 2; i++)
            drawCard(hx + i*(CW+GAP), hy, CW, CH, p.hole[i], showHole);
    }
}

function drawStatusBar() {
    ctx.fillStyle = "#0f1218";
    ctx.fillRect(0, 0, W, 40);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "bold 16px 'Microsoft YaHei', sans-serif";
    ctx.fillStyle = COLOR.text;
    const left = "第 " + handNum + " 手   |   " + STREET_NAMES[table.street]
               + "   |   底池 $" + table.pot;
    ctx.fillText(left, 16, 20);
    if (lastAction) {
        ctx.textAlign = "center";
        ctx.fillStyle = COLOR.cyan;
        ctx.font = "15px 'Microsoft YaHei', sans-serif";
        ctx.fillText(lastAction, W/2 + 100, 20);
    }
    let status = "", col = COLOR.text;
    if (gameOver) { status = "游戏结束"; col = COLOR.red; }
    else if (table.street === ST_OVER) { status = "本手结束"; col = COLOR.gold; }
    else if (table.toAct === mySeat) { status = "轮到你"; col = COLOR.green; }
    else if (table.toAct >= 0) {
        status = "等待 " + (table.toAct === 0 ? "房主" : "座位 " + table.toAct);
        col = COLOR.dim;
    }
    ctx.textAlign = "right"; ctx.fillStyle = col;
    ctx.font = "bold 16px 'Microsoft YaHei', sans-serif";
    ctx.fillText(status, W-16, 20);
}

function renderGameOver() {
    if (!table) return;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = COLOR.goldBright;
    ctx.font = "bold 48px 'Microsoft YaHei', sans-serif";
    ctx.fillText("游戏结束", CX, 100);

    const rows = [];
    for (let i = 0; i < table.numSeats; i++) {
        if (!table.players[i].occupied) continue;
        rows.push({ seat: i, stack: table.players[i].stack });
    }
    rows.sort((a,b) => b.stack - a.stack);

    ctx.font = "bold 22px 'Microsoft YaHei', sans-serif";
    const startY = 200, rowH = 50;
    const panelW = 640, panelX = CX - panelW/2;
    roundRect(panelX, 160, panelW, rows.length*rowH + 40, 16);
    ctx.fillStyle = "#20242e"; ctx.fill();
    ctx.strokeStyle = "#3a70b0"; ctx.lineWidth = 2; ctx.stroke();

    rows.forEach((r, i) => {
        const y = startY + i*rowH;
        const isMe = r.seat === mySeat;
        if (isMe) {
            ctx.fillStyle = "#2a3a54";
            roundRect(panelX+15, y-18, panelW-30, rowH-8, 8); ctx.fill();
        }
        ctx.textAlign = "left";
        ctx.fillStyle = isMe ? COLOR.goldBright : COLOR.text;
        ctx.font = "bold 20px 'Microsoft YaHei', sans-serif";
        ctx.fillText("第 " + (i+1) + " 名", panelX+40, y);
        ctx.fillText(isMe ? "你" : (r.seat === 0 ? "房主" : "座位 " + r.seat),
                     panelX+200, y);
        ctx.textAlign = "right"; ctx.fillStyle = COLOR.gold;
        ctx.font = "bold 22px Consolas, monospace";
        ctx.fillText("$" + r.stack, panelX + panelW - 40, y);
    });
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.arcTo(x+w, y, x+w, y+r, r);
    ctx.lineTo(x+w, y+h-r);
    ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    ctx.lineTo(x+r, y+h);
    ctx.arcTo(x, y+h, x, y+h-r, r);
    ctx.lineTo(x, y+r);
    ctx.arcTo(x, y, x+r, y, r);
    ctx.closePath();
}

// ============================================================================
//  控制按钮
// ============================================================================
function updateControls() {
    const el = document.getElementById("controls");
    el.innerHTML = "";
    if (!table) return;

    if (gameOver) {
        el.appendChild(makeBtn("重新开始", "primary", () => location.reload()));
        return;
    }

    if (waitingNextHand) {
        if (isHost) {
            el.appendChild(makeBtn("下一手", "primary", () => startNextHand()));
        } else {
            const b = makeBtn("等待房主开始下一手…", "", () => {});
            b.disabled = true;
            el.appendChild(b);
        }
        return;
    }

    const isMyTurn = table.toAct === mySeat;
    const me = table.players[mySeat];
    if (!me) return;
    const toCall = table.currentBet - me.betRound;

    const bFold = makeBtn("弃牌", "danger", () => onHumanAct(ACT_FOLD, 0));
    const bCall = makeBtn(
        toCall > 0 ? "跟注 $" + Math.min(toCall, me.stack) : "过牌", "",
        () => onHumanAct(toCall > 0 ? ACT_CALL : ACT_CHECK, 0));
    const bAllIn = makeBtn("全下", "warn", () => onHumanAct(ACT_ALLIN, 0));
    bFold.disabled = bCall.disabled = bAllIn.disabled = !isMyTurn;
    el.appendChild(bFold);
    el.appendChild(bCall);

    const minT = table.currentBet + table.minRaise;
    const maxT = me.betRound + me.stack;
    const input = document.createElement("input");
    input.type = "number";
    input.value = Math.min(minT, maxT);
    input.min = minT; input.max = maxT;
    input.disabled = !isMyTurn || maxT <= table.currentBet;
    el.appendChild(input);

    const bRaise = makeBtn("加注", "primary", () => {
        const amt = parseInt(input.value) || minT;
        onHumanAct(ACT_RAISE, Math.max(minT, Math.min(amt, maxT)));
    });
    bRaise.disabled = !isMyTurn || maxT <= table.currentBet;
    el.appendChild(bRaise);
    el.appendChild(bAllIn);

    if (isMyTurn && maxT > table.currentBet) {
        const quick = [
            ["最小", minT],
            ["½ 池", table.currentBet + Math.floor(table.pot/2)],
            ["底池", table.currentBet + table.pot],
            ["全下", maxT],
        ];
        for (const [label, v] of quick) {
            const val = Math.max(minT, Math.min(v, maxT));
            const b = makeBtn(label, "", () => { input.value = val; });
            b.disabled = !isMyTurn;
            el.appendChild(b);
        }
    }
}

function makeBtn(text, cls, onClick) {
    const b = document.createElement("button");
    b.textContent = text;
    if (cls) b.className = cls;
    b.onclick = onClick;
    return b;
}

// ============================================================================
//  大厅事件绑定
// ============================================================================
document.getElementById("btnHost").onclick = () => startAsHost();
document.getElementById("btnSolo").onclick = () => startSoloGame();

document.getElementById("btnJoin").onclick = () => {
    document.getElementById("lobbyForm").style.display = "none";
    document.getElementById("joinInfo").style.display = "block";
};

document.getElementById("btnConnect").onclick = () => {
    const code = document.getElementById("joinCode").value.trim().toUpperCase();
    if (code.length !== 6) {
        document.getElementById("joinStatus").textContent = "房间码是 6 位";
        return;
    }
    document.getElementById("joinStatus").textContent = "连接中…";
    isHost = false;
    startAsClient(code);
};

document.getElementById("btnCancelJoin").onclick = () => {
    if (peer) { peer.destroy(); peer = null; }
    document.getElementById("lobbyForm").style.display = "block";
    document.getElementById("joinInfo").style.display = "none";
    document.getElementById("joinStatus").textContent = "";
};

document.getElementById("btnStartGame").onclick = () => startGameAsHost();
document.getElementById("btnCancelHost").onclick = () => cancelHost();

</script>
