<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>德州扑克 · 2–12 人</title>
<style>
  :root{
    --bg:#0a0d12;
    --bg2:#11151d;
    --panel:#151b25;
    --panel2:#1b2230;
    --line:#2b3444;
    --text:#e6e9ef;
    --muted:#8d97a8;
    --gold:#e8c05a;
    --gold2:#ffd97a;
    --blue:#3f6fa8;
    --blue2:#5085c4;
    --red:#8e3333;
    --red2:#aa4040;
    --green:#54a67a;
    --shadow:0 20px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(66,94,138,.18), transparent 60%),
      radial-gradient(900px 500px at 15% 110%, rgba(120,86,30,.10), transparent 60%),
      linear-gradient(180deg,#0b0f15 0%, #080a0e 100%);
    color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow-x:hidden;
  }
  .hidden{display:none !important}
  .screen{max-width:1240px;margin:0 auto;padding:14px}
  button{
    font-family:inherit;
    border:1px solid var(--line);
    background:linear-gradient(180deg,#242c3a,#1b222e);
    color:var(--text);
    border-radius:9px;
    padding:10px 18px;
    font-size:15px;
    cursor:pointer;
    transition:background .15s, transform .06s, border-color .15s, opacity .15s;
    user-select:none;
  }
  button:hover:not(:disabled){background:linear-gradient(180deg,#2d3748,#222b3a);border-color:#3a475c}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.34;cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#3c6ba5,#2d5485);border-color:#4a7ab5;color:#fff}
  button.primary:hover:not(:disabled){background:linear-gradient(180deg,#487bb8,#356093)}
  button.gold{background:linear-gradient(180deg,#8a6a24,#6b5118);border-color:#a98635;color:#ffe6a8}
  button.gold:hover:not(:disabled){background:linear-gradient(180deg,#a07c2c,#7d5f1d)}
  button.danger{background:linear-gradient(180deg,#823434,#652626);border-color:#9b3f3f;color:#ffe0e0}
  button.danger:hover:not(:disabled){background:linear-gradient(180deg,#9c4141,#793030)}
  button.ghost{background:transparent;border-color:#333d4e;color:#aab4c4}
  button.ghost:hover:not(:disabled){background:#1a2130}
  input,select{
    font-family:inherit;
    padding:10px 12px;
    font-size:15px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#0f141c;
    color:var(--text);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus,select:focus{border-color:#4a78b0;box-shadow:0 0 0 3px rgba(74,120,176,.14)}
  input[type=number]{appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{appearance:none;margin:0}

  /* ---------------- Lobby ---------------- */
  #lobby.screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 14px 40px;
  }
  .brand{text-align:center;margin-bottom:22px}
  .brand .suits{
    font-size:22px;letter-spacing:12px;color:#6d5140;margin-bottom:4px;
    text-shadow:0 0 18px rgba(232,192,90,.15);
  }
  .brand h1{
    margin:0;
    font-size:46px;
    letter-spacing:14px;
    text-indent:14px;
    font-weight:800;
    background:linear-gradient(180deg,#fff0c2 0%,#e8c05a 48%,#b8872e 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 18px rgba(180,130,40,.22));
  }
  .brand .sub{color:#7f8a9d;font-size:12px;letter-spacing:5px;margin-top:8px}
  .panel{
    background:linear-gradient(180deg,rgba(27,34,47,.96),rgba(18,23,32,.96));
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:24px 26px;
  }
  #lobbyForm{width:min(460px,94vw)}
  .field{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:13px 0}
  .field label{color:#c3cad6;font-size:15px;white-space:nowrap}
  .field input,.field select{width:210px}
  .lobby-buttons{display:flex;gap:10px;margin-top:22px}
  .lobby-buttons button{flex:1;padding:12px 8px;font-size:15px}
  .hint{color:#768195;font-size:12px;text-align:center;margin-top:16px;line-height:1.6}
  #hostInfo,#joinInfo{width:min(460px,94vw);text-align:center}
  #hostInfo h2,#joinInfo h2{margin:0 0 6px;font-size:18px;color:#cdd5e2;font-weight:600}
  #roomCode{
    font-family:Consolas,"SF Mono",monospace;
    font-size:52px;
    letter-spacing:12px;
    text-indent:12px;
    color:var(--gold2);
    text-shadow:0 0 28px rgba(255,215,110,.25);
    margin:12px 0 4px;
    font-weight:800;
  }
  .room-sub{color:#8c96a8;font-size:13px}
  #hostStatus,#joinStatus{color:#d8b75e;font-size:13px;min-height:20px;margin:12px 0 0;line-height:1.6}
  #hostPlayers{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  #hostPlayers li{
    background:#0f141c;border:1px solid #2a3445;border-radius:999px;
    padding:5px 12px;font-size:13px;color:#c5cedc
  }
  #hostPlayers li.host{border-color:#6b5724;color:#ffdf95}
  #joinCode{
    width:230px;text-align:center;text-transform:uppercase;
    font-family:Consolas,monospace;font-size:30px;letter-spacing:8px;text-indent:8px;
    padding:8px 10px;color:#ffe19a;
  }
  .join-buttons{display:flex;gap:10px;margin-top:16px}
  .join-buttons button{flex:1}

  /* ---------------- Game ---------------- */
  #game.screen{
    padding:8px 14px 22px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 290px;
    grid-template-areas:"top top" "status status" "table log" "controls controls";
    column-gap:12px;
  }
  #topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 6px}
  #tableInfo{color:#8d97a8;font-size:13px;letter-spacing:.5px}
  #tableInfo b{color:#cdd5e2;font-weight:600}
  #btnLeave{padding:7px 14px;font-size:13px}
  #status{
    grid-area:status;
    text-align:center;
    min-height:28px;
    font-size:16px;
    color:#e9c765;
    letter-spacing:.5px;
    padding:2px 0 6px;
    text-shadow:0 0 16px rgba(233,199,101,.12);
  }
  #tableWrap{
    grid-area:table;
    position:relative;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #242d3b;
    box-shadow:0 26px 70px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02);
    background:#0b0f15;
  }
  #table{display:block;width:100%;height:auto}
  #log{
    grid-area:log;
    padding:10px 14px;
    min-height:0;
    overflow-y:auto;
    border-radius:12px;
    background:linear-gradient(180deg,rgba(22,28,38,.92),rgba(15,19,26,.92));
    border:1px solid #222b39;
    font-size:12.5px;
    line-height:1.7;
    color:#b8c2d1;
    font-family:Consolas,"Microsoft YaHei",monospace;
    scrollbar-width:thin;
  }
  .log-line.white{color:#d5dce8}
  .log-line.hand{color:var(--gold);font-weight:700;letter-spacing:1px}
  .log-line.street{color:#7fc6a0}
  .log-line.action{color:#c6cfdd}
  .log-line.win{color:#ffd97a;font-weight:700}
  .log-line.you{color:#8fb8ff}
  .log-line.system{color:#b3a0d6}
  .log-line.showdown{color:#cbb7ff}
  #controls{grid-area:controls;margin-top:10px}
  .action-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .action-row button{min-width:112px;padding:12px 18px;font-size:16px;font-weight:600}
  #btnAllIn{background:linear-gradient(180deg,#5e2a2a,#471f1f);border-color:#7b3838;color:#ffc9c9}
  #btnAllIn:hover:not(:disabled){background:linear-gradient(180deg,#713333,#562626)}
  #raisePanel{
    max-width:620px;
    margin:10px auto 0;
    background:linear-gradient(180deg,rgba(24,31,43,.95),rgba(16,21,29,.95));
    border:1px solid #293346;
    border-radius:14px;
    padding:12px 16px;
  }
  .raise-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  #raiseLabel{color:#d6c08a;font-size:14px;font-weight:600}
  #raiseAmount{width:120px;text-align:right;padding:7px 10px;font-size:15px}
  #raiseSlider{
    width:100%;
    -webkit-appearance:none;appearance:none;
    height:6px;border-radius:999px;
    background:linear-gradient(90deg,#3f6fa8,#8a6a24);
    outline:none;padding:0;border:none;
  }
  #raiseSlider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe7a8,#c79a37 70%);
    border:2px solid #f4d27b;box-shadow:0 2px 10px rgba(0,0,0,.5);cursor:pointer;
  }
  #raiseSlider::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;
    background:#e8c05a;border:2px solid #f4d27b;cursor:pointer;
  }
  .quick-row{display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap}
  .quick-row button{padding:6px 14px;font-size:13px;border-radius:999px;color:#b9c4d6}

  /* ---------------- Overlay ---------------- */
  #overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:rgba(4,6,10,.72);
    backdrop-filter:blur(6px);
    padding:18px;
  }
  .overlay-card{
    width:min(420px,94vw);
    text-align:center;
    background:linear-gradient(180deg,#1c2431,#121821);
    border:1px solid #344052;
    border-radius:18px;
    box-shadow:0 30px 90px rgba(0,0,0,.7);
    padding:28px 24px 24px;
  }
  .overlay-card h2{margin:0 0 10px;font-size:24px;color:#f1d27e;letter-spacing:2px}
  .overlay-card p{margin:0 0 20px;color:#aeb8c8;font-size:14px;line-height:1.7}
  .overlay-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .overlay-buttons button{min-width:120px}

  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    z-index:60;background:#222b3a;border:1px solid #3a475c;color:#dfe6f2;
    padding:10px 18px;border-radius:999px;font-size:13px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .2s, bottom .2s;
  }
  #toast.show{opacity:1;bottom:36px}

  @media(min-width:821px) and (max-width:1100px){
    #game.screen{display:block;overflow-x:hidden}
    #log{max-height:120px;min-height:74px;margin-top:10px}
  }

  @media(max-width:820px){
    .screen{padding:8px}
    #game.screen{display:block;overflow-x:hidden}
    #lobby.screen{padding:20px 10px 30px}
    .brand h1{font-size:32px;letter-spacing:8px;text-indent:8px}
    .brand .suits{font-size:16px;letter-spacing:8px}
    .brand .sub{font-size:10px;letter-spacing:3px}
    #lobbyForm{padding:18px 16px}
    .field{flex-direction:column;align-items:stretch;gap:5px;margin:10px 0}
    .field input,.field select{width:100%}
    .field label{font-size:13px;color:#9aa5b7}
    .lobby-buttons{flex-wrap:wrap}
    .lobby-buttons button{flex:1 1 40%}
    #roomCode{font-size:38px;letter-spacing:8px}
    #joinCode{font-size:24px;width:190px}
    #status{font-size:14px;min-height:22px}
    #tableInfo{font-size:11px}
    #btnLeave{padding:6px 10px;font-size:12px}
    #tableWrap{overflow-x:auto;scrollbar-width:none}
    #tableWrap::-webkit-scrollbar{display:none}
    #table{min-width:840px}
    #log{font-size:11px;max-height:96px;min-height:58px;padding:7px 10px;margin-top:10px}
    .action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .action-row button{width:100%;min-width:0;padding:11px 6px;font-size:14px}
    #raisePanel{padding:10px 12px}
    #raiseLabel{font-size:12px}
    #raiseAmount{width:86px;font-size:13px}
    .quick-row button{padding:5px 10px;font-size:12px}
  }
</style>
</head>
<body>

<!-- ==================== 大厅 ==================== -->
<div id="lobby" class="screen">
  <div class="brand">
    <div class="suits">♠ ♥ ♣ ♦</div>
    <h1>德州扑克</h1>
    <div class="sub">TEXAS HOLD'EM · 2–12 PLAYERS</div>
  </div>

  <div class="panel" id="lobbyForm">
    <div class="field">
      <label for="nickname">昵称</label>
      <input id="nickname" value="玩家" maxlength="12" autocomplete="off">
    </div>
    <div class="field">
      <label for="seatCount">人数</label>
      <select id="seatCount">
        <option value="2">2 人桌</option>
        <option value="3">3 人桌</option>
        <option value="4">4 人桌</option>
        <option value="5">5 人桌</option>
        <option value="6" selected>6 人桌</option>
        <option value="7">7 人桌</option>
        <option value="8">8 人桌</option>
        <option value="9">9 人桌</option>
        <option value="10">10 人桌</option>
        <option value="11">11 人桌</option>
        <option value="12">12 人桌</option>
      </select>
    </div>
    <div class="field">
      <label for="blinds">盲注</label>
      <select id="blinds">
        <option value="1-2" selected>1 / 2</option>
        <option value="2-5">2 / 5</option>
        <option value="5-10">5 / 10</option>
        <option value="10-20">10 / 20</option>
      </select>
    </div>
    <div class="field">
      <label for="startStack">起始筹码</label>
      <input id="startStack" type="number" value="200" min="20" max="100000" step="10">
    </div>
    <div class="lobby-buttons">
      <button id="btnSolo" class="primary">单机开始</button>
      <button id="btnHost" class="gold">创建房间</button>
      <button id="btnJoin" class="ghost">加入房间</button>
    </div>
    <div class="hint">单机模式由电脑补满空位；联机模式房主 + 加入的玩家，剩余座位由电脑补位。</div>
  </div>

  <div class="panel hidden" id="hostInfo">
    <h2>房间已创建</h2>
    <div class="room-sub">把房间码发给朋友</div>
    <div id="roomCode">-----</div>
    <div class="room-sub" id="hostSeatInfo"></div>
    <p id="hostStatus">正在连接信令服务器…</p>
    <ul id="hostPlayers"></ul>
    <div class="join-buttons">
      <button id="btnStartGame" class="primary">开始游戏</button>
      <button id="btnCancelHost" class="danger">取消</button>
    </div>
  </div>

  <div class="panel hidden" id="joinInfo">
    <h2>加入房间</h2>
    <div class="room-sub">输入 5 位房间码</div>
    <p><input id="joinCode" maxlength="5" placeholder="ABCDE" autocomplete="off" spellcheck="false"></p>
    <div class="join-buttons">
      <button id="btnConnect" class="primary">连接</button>
      <button id="btnCancelJoin" class="ghost">返回</button>
    </div>
    <p id="joinStatus"></p>
  </div>
</div>

<!-- ==================== 牌桌 ==================== -->
<div id="game" class="screen hidden">
  <div id="topbar">
    <div id="tableInfo"></div>
    <button id="btnLeave" class="ghost">离开</button>
  </div>
  <div id="status">准备开始</div>
  <div id="tableWrap">
    <canvas id="table" width="1200" height="760"></canvas>
  </div>
  <div id="log"></div>
  <div id="controls">
    <div class="action-row">
      <button id="btnFold" class="danger" disabled>弃牌</button>
      <button id="btnCheckCall" class="primary" disabled>过牌</button>
      <button id="btnRaise" class="gold" disabled>加注</button>
      <button id="btnAllIn" disabled>全下</button>
    </div>
    <div id="raisePanel" class="hidden">
      <div class="raise-line">
        <span id="raiseLabel">加注到 0</span>
        <input id="raiseAmount" type="number" min="0" step="1" value="0">
      </div>
      <input id="raiseSlider" type="range" min="0" max="100" step="1" value="0">
      <div class="quick-row">
        <button data-frac="0.5">½ 池</button>
        <button data-frac="0.67">⅔ 池</button>
        <button data-frac="1">底池</button>
        <button id="btnMaxRaise">最大</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== 弹层 ==================== -->
<div id="overlay" class="hidden">
  <div class="overlay-card">
    <h2 id="overlayTitle"></h2>
    <p id="overlayText"></p>
    <div class="overlay-buttons" id="overlayButtons"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ==================== ENGINE START ==================== */
/* ============================================================================
 *  德州扑克引擎（无 DOM 依赖）
 *  - 2~12 人无限注德州
 *  - 盲注、按钮轮转、单挑特殊规则、边池、平分底池、全下
 *  - 牌力评估：5 张 / 7 张，A2345 轮子顺
 * ==========================================================================*/
'use strict';

const RL = ["2", "3", "4", "5", "6", "7", "8", "9", "T", "J", "Q", "K", "A"];
const SS = ["♣", "♦", "♥", "♠"];

class Card {
    constructor(v) { this.v = v; }
    rank() { return this.v >> 2; }
    suit() { return this.v & 3; }
    valid() { return this.v < 52; }
    isRed() { return (this.v & 3) === 1 || (this.v & 3) === 2; }
    label() { return this.valid() ? RL[this.v >> 2] : "?"; }
    symbol() { return this.valid() ? SS[this.v & 3] : "?"; }
}
const INV = new Card(0xFF);

// ---------------------------------------------------------------------------
//  5 张牌评估（内部会先把点数排成降序，调用方无需预排序）
// ---------------------------------------------------------------------------
function eval5(a, b, c, d, e) {
    let ra = a >> 2, rb = b >> 2, rc = c >> 2, rd = d >> 2, re = e >> 2;

    // 9 比较器排序网络，降序
    let t;
    if (ra < rb) { t = ra; ra = rb; rb = t; }
    if (rd < re) { t = rd; rd = re; re = t; }
    if (rc < re) { t = rc; rc = re; re = t; }
    if (rc < rd) { t = rc; rc = rd; rd = t; }
    if (ra < rd) { t = ra; ra = rd; rd = t; }
    if (ra < rc) { t = ra; ra = rc; rc = t; }
    if (rb < re) { t = rb; rb = re; re = t; }
    if (rb < rd) { t = rb; rb = rd; rd = t; }
    if (rb < rc) { t = rb; rb = rc; rc = t; }

    const rm = (1 << ra) | (1 << rb) | (1 << rc) | (1 << rd) | (1 << re);

    // 同花：所有牌花色相同。注意 === 优先级高于 &，括号不能省。
    const flush = ((((a ^ b) | (b ^ c) | (c ^ d) | (d ^ e)) & 3) === 0);

    let nc = rm;
    nc = nc - ((nc >> 1) & 0x5555);
    nc = (nc & 0x3333) + ((nc >> 2) & 0x3333);
    nc = (nc + (nc >> 4)) & 0x0F0F;
    nc = (nc + (nc >> 8)) & 0x1F;

    if (nc === 5) {
        if (ra - re === 4) {
            return ((flush ? 8 : 4) << 20) | (ra << 16);
        }
        // A2345：A 当 1，降序后为 12,3,2,1,0
        if (ra === 12 && re === 0 && rb === 3 && rc === 2 && rd === 1) {
            return ((flush ? 8 : 4) << 20) | (3 << 16);
        }
    }

    if (flush) {
        return (5 << 20) | (ra << 16) | (rb << 12) | (rc << 8) | (rd << 4) | re;
    }

    if (ra === rb) {
        if (rb === rc) {
            if (rc === rd) {
                if (rd === re) return (7 << 20) | (ra << 16);
                return (7 << 20) | (ra << 16) | (re << 12);
            }
            if (rd === re) return (6 << 20) | (ra << 16) | (rd << 12);      // AAA + BB
            return (3 << 20) | (ra << 16) | (rd << 12) | (re << 8);
        }
        if (rc === rd) {
            if (rd === re) {
                // AA + BBB 型：三条是 rd，对子是 ra。
                // 若写成 (ra<<16)|(rd<<12)，22 333 会被当成 333 22。
                return (6 << 20) | (rd << 16) | (ra << 12);
            }
            return (2 << 20) | (ra << 16) | (rc << 12) | (re << 8);
        }
        if (rd === re) return (2 << 20) | (ra << 16) | (rd << 12) | (rc << 8);
        return (1 << 20) | (ra << 16) | (rc << 12) | (rd << 8) | (re << 4);
    }
    if (rb === rc) {
        if (rc === rd) {
            if (rd === re) return (7 << 20) | (rb << 16) | (ra << 12);
            return (3 << 20) | (rb << 16) | (ra << 12) | (re << 8);
        }
        if (rd === re) return (2 << 20) | (rb << 16) | (rd << 12) | (ra << 8);
        return (1 << 20) | (rb << 16) | (ra << 12) | (rd << 8) | (re << 4);
    }
    if (rc === rd) {
        if (rd === re) return (3 << 20) | (rc << 16) | (ra << 12) | (rb << 8);
        return (1 << 20) | (rc << 16) | (ra << 12) | (rb << 8) | (re << 4);
    }
    if (rd === re) return (1 << 20) | (rd << 16) | (ra << 12) | (rb << 8) | (rc << 4);
    return (0 << 20) | (ra << 16) | (rb << 12) | (rc << 8) | (rd << 4) | re;
}

function eval7(v0, v1, v2, v3, v4, v5, v6) {
    const src = [v0, v1, v2, v3, v4, v5, v6];
    const v = [];
    for (let i = 0; i < 7; i++) {
        if (src[i] >= 0 && src[i] < 52) v.push(src[i]);
    }
    const n = v.length;
    if (n < 5) return 0;

    for (let i = 1; i < n; i++) {
        const key = v[i], kr = key >> 2;
        let j = i - 1;
        while (j >= 0 && (v[j] >> 2) < kr) { v[j + 1] = v[j]; --j; }
        v[j + 1] = key;
    }

    let best = 0;
    for (let a = 0; a <= n - 5; a++)
    for (let b = a + 1; b <= n - 4; b++)
    for (let c = b + 1; c <= n - 3; c++)
    for (let d = c + 1; d <= n - 2; d++)
    for (let e = d + 1; e <= n - 1; e++) {
        const val = eval5(v[a], v[b], v[c], v[d], v[e]);
        if (val > best) best = val;
    }
    return best;
}

const CAT_NAMES = ["高牌", "一对", "两对", "三条", "顺子", "同花", "葫芦", "四条", "同花顺"];

function describeHand(code) {
    if (!code) return "";
    const cat = code >> 20;
    let s = CAT_NAMES[cat] || "";
    if (cat === 8 || cat === 4) {
        const high = (code >> 16) & 0xF;
        s += "（" + RL[high] + " 高）";
    }
    return s;
}

const ST_UNSTARTED = 0, ST_PREFLOP = 1, ST_FLOP = 2, ST_TURN = 3, ST_RIVER = 4, ST_SHOWDOWN = 5, ST_OVER = 6;
const STREET_NAMES = ["未开始", "翻牌前", "翻牌", "转牌", "河牌", "摊牌", "本手结束"];
const ACT = { FOLD: 0, CHECK: 1, CALL: 2, BET: 3, RAISE: 4, ALLIN: 5 };

// ---------------------------------------------------------------------------
//  玩家
// ---------------------------------------------------------------------------
class Player {
    constructor(seat) {
        this.seat = seat;
        this.name = "";
        this.isHuman = false;
        this.stack = 0;
        this.betRound = 0;
        this.betTotal = 0;
        this.hole = [INV, INV];
        this.occupied = false;
        this.inHand = false;
        this.folded = false;
        this.allIn = false;
        this.acted = false;
        this.showdownCode = 0;
    }
    canAct() { return this.inHand && !this.folded && !this.allIn && this.stack > 0; }
    alive() { return this.inHand && !this.folded; }
}

// ---------------------------------------------------------------------------
//  牌桌
// ---------------------------------------------------------------------------
class Table {
    constructor(numSeats, smallBlind, bigBlind, startingStack) {
        this.numSeats = Math.max(2, Math.min(12, numSeats));
        this.smallBlind = smallBlind;
        this.bigBlind = bigBlind;
        this.startingStack = startingStack;
        this.players = Array.from({ length: this.numSeats }, (_, i) => new Player(i));
        this.button = -1;
        this.board = [INV, INV, INV, INV, INV];
        this.boardCount = 0;
        this.street = ST_UNSTARTED;
        this.toAct = -1;
        this.currentBet = 0;
        this.minRaise = bigBlind;
        this.pot = 0;
        this.activeCount = 0;
        this.winners = [];
        this.wonAmount = new Array(this.numSeats).fill(0);
        this.deck = [];
        this.rngState = 0x12345678;
        this.wentToShowdown = false;
        this.preflopAggressor = -1;
        this.handNo = 0;
        this.showdownHands = new Map();
    }

    rng() {
        let x = this.rngState;
        x ^= x << 13; x >>>= 0;
        x ^= x >> 17;
        x ^= x << 5; x >>>= 0;
        this.rngState = x;
        return x / 4294967296;
    }

    seatPlayer(i, name, stack, isHuman) {
        const p = this.players[i];
        p.name = name;
        p.stack = stack;
        p.isHuman = !!isHuman;
        p.occupied = true;
    }

    nextInHand(from) {
        for (let i = 1; i <= this.numSeats; i++) {
            const idx = (from + i) % this.numSeats;
            if (this.players[idx].inHand) return idx;
        }
        return -1;
    }

    nextCanAct(from) {
        for (let i = 0; i < this.numSeats; i++) {
            const idx = ((from + i) % this.numSeats + this.numSeats) % this.numSeats;
            if (this.players[idx].canAct()) return idx;
        }
        return -1;
    }

    playersWithChips() {
        return this.players.filter(p => p.occupied && p.stack > 0);
    }

    startHand(seed) {
        this.handNo++;
        this.rngState = (seed >>> 0) || 0x9E3779B9;
        this.wentToShowdown = false;
        this.preflopAggressor = -1;
        this.showdownHands = new Map();
        this.winners = [];
        this.wonAmount.fill(0);
        this.pot = 0;
        this.currentBet = 0;
        this.minRaise = this.bigBlind;
        this.toAct = -1;
        this.activeCount = 0;

        for (const p of this.players) {
            p.inHand = p.occupied && p.stack > 0;
            p.folded = false;
            p.allIn = false;
            p.acted = false;
            p.betRound = 0;
            p.betTotal = 0;
            p.hole[0] = INV; p.hole[1] = INV;
            p.showdownCode = 0;
            if (p.inHand) this.activeCount++;
        }
        for (let i = 0; i < 5; i++) this.board[i] = INV;
        this.boardCount = 0;

        if (this.activeCount < 2) {
            this.street = ST_OVER;
            return false;
        }

        do { this.button = (this.button + 1) % this.numSeats; }
        while (!this.players[this.button].inHand);

        this.deck = new Array(52);
        for (let i = 0; i < 52; i++) this.deck[i] = i;
        for (let i = 51; i > 0; i--) {
            const j = Math.floor(this.rng() * (i + 1));
            const tmp = this.deck[i]; this.deck[i] = this.deck[j]; this.deck[j] = tmp;
        }

        let di = 0;
        for (let k = 0; k < 2; k++) {
            let i = (this.button + 1) % this.numSeats;
            for (let m = 0; m < this.numSeats; m++) {
                if (this.players[i].inHand) {
                    this.players[i].hole[k] = new Card(this.deck[di++]);
                }
                i = (i + 1) % this.numSeats;
            }
        }

        // 单挑时按钮位就是小盲；其余情况小盲是按钮左手第一位
        const headsUp = this.activeCount === 2;
        const sbSeat = headsUp ? this.button : this.nextInHand(this.button);
        const bbSeat = this.nextInHand(sbSeat);

        this.postBlind(sbSeat, this.smallBlind);
        this.postBlind(bbSeat, this.bigBlind);

        this.street = ST_PREFLOP;
        this.currentBet = this.bigBlind;
        this.minRaise = this.bigBlind;
        this.toAct = this.nextCanAct((bbSeat + 1) % this.numSeats);

        const actors = this.players.filter(p => p.canAct());
        if (actors.length === 0) {
            this.runOut();
        } else if (actors.length === 1 && actors[0].betRound >= this.currentBet) {
            // 只剩一个人能行动，且无需跟注：直接发完公共牌
            this.runOut();
        }
        return true;
    }

    postBlind(seat, amount) {
        const p = this.players[seat];
        const actual = Math.min(amount, p.stack);
        p.stack -= actual;
        p.betRound += actual;
        p.betTotal += actual;
        this.pot += actual;
        if (p.stack === 0) p.allIn = true;
    }

    roundOver() {
        for (const p of this.players) {
            if (!p.canAct()) continue;
            if (!p.acted) return false;
            if (p.betRound < this.currentBet) return false;
        }
        return true;
    }

    act(action, amount = 0) {
        if (this.street === ST_OVER || this.street === ST_UNSTARTED || this.toAct < 0) return false;
        const p = this.players[this.toAct];
        if (!p || !p.canAct()) return false;
        const actorSeat = this.toAct;
        const toCall = this.currentBet - p.betRound;

        switch (action) {
            case ACT.FOLD:
                p.folded = true;
                p.acted = true;
                this.activeCount--;
                break;

            case ACT.CHECK:
                if (toCall > 0) return false;
                p.acted = true;
                break;

            case ACT.CALL: {
                if (toCall <= 0) { p.acted = true; break; }
                const actual = Math.min(toCall, p.stack);
                p.stack -= actual;
                p.betRound += actual;
                p.betTotal += actual;
                this.pot += actual;
                if (p.stack === 0) p.allIn = true;
                p.acted = true;
                break;
            }

            case ACT.BET:
            case ACT.RAISE: {
                if (p.stack <= 0) return false;
                const minTarget = this.currentBet + this.minRaise;
                let target = Math.max(amount, minTarget);
                let delta = Math.min(target - p.betRound, p.stack);
                if (delta <= 0) return false;
                p.stack -= delta;
                p.betRound += delta;
                p.betTotal += delta;
                this.pot += delta;

                if (p.betRound > this.currentBet) {
                    const raiseSize = p.betRound - this.currentBet;
                    const full = raiseSize >= this.minRaise;
                    this.currentBet = p.betRound;
                    if (full) {
                        this.minRaise = raiseSize;
                        for (const q of this.players) {
                            if (q !== p && q.canAct()) q.acted = false;
                        }
                    }
                }
                if (p.stack === 0) p.allIn = true;
                p.acted = true;
                break;
            }

            case ACT.ALLIN: {
                const delta = p.stack;
                if (delta <= 0) return false;
                p.stack = 0;
                p.betRound += delta;
                p.betTotal += delta;
                this.pot += delta;
                p.allIn = true;

                if (p.betRound > this.currentBet) {
                    const raiseSize = p.betRound - this.currentBet;
                    const full = raiseSize >= this.minRaise;
                    this.currentBet = p.betRound;
                    if (full) {
                        this.minRaise = raiseSize;
                        for (const q of this.players) {
                            if (q !== p && q.canAct()) q.acted = false;
                        }
                    }
                }
                p.acted = true;
                break;
            }

            default:
                return false;
        }

        if (this.street === ST_PREFLOP && (action === ACT.BET || action === ACT.RAISE || action === ACT.ALLIN)) {
            this.preflopAggressor = actorSeat;
        }

        if (this.activeCount <= 1) {
            this.awardLastAlive();
            return true;
        }
        if (this.roundOver()) {
            this.endRound();
        } else {
            const next = this.nextCanAct(actorSeat + 1);
            if (next < 0) this.runOut();
            else this.toAct = next;
        }
        return true;
    }

    endRound() {
        for (const p of this.players) {
            p.betRound = 0;
            p.acted = false;
        }
        this.currentBet = 0;
        this.minRaise = this.bigBlind;

        if (this.players.filter(p => p.canAct()).length <= 1) {
            this.runOut();
            return;
        }

        switch (this.street) {
            case ST_PREFLOP: this.dealBoard(3); this.street = ST_FLOP; break;
            case ST_FLOP: this.dealBoard(4); this.street = ST_TURN; break;
            case ST_TURN: this.dealBoard(5); this.street = ST_RIVER; break;
            case ST_RIVER: this.gotoShowdown(); return;
            default: return;
        }

        const next = this.nextCanAct(this.button + 1);
        if (next < 0) this.runOut();
        else this.toAct = next;
    }

    dealBoard(target) {
        while (this.boardCount < target) {
            this.board[this.boardCount++] = new Card(this.deck.pop());
        }
    }

    runOut() {
        while (this.boardCount < 5) {
            this.board[this.boardCount++] = new Card(this.deck.pop());
        }
        this.gotoShowdown();
    }

    awardLastAlive() {
        for (const p of this.players) {
            if (p.alive()) {
                p.stack += this.pot;
                this.wonAmount[p.seat] = this.pot;
                this.winners = [p.seat];
                this.pot = 0;
                break;
            }
        }
        this.street = ST_OVER;
        this.toAct = -1;
    }

    gotoShowdown() {
        this.wentToShowdown = true;
        this.street = ST_SHOWDOWN;
        this.distributePots();
        this.street = ST_OVER;
        this.toAct = -1;
    }

    distributePots() {
        const levels = [...new Set(
            this.players.filter(p => p.inHand && p.betTotal > 0).map(p => p.betTotal)
        )].sort((a, b) => a - b);

        this.winners = [];
        const wonAny = new Array(this.numSeats).fill(false);
        let prev = 0;
        let carry = 0;

        for (const level of levels) {
            let amount = carry;
            carry = 0;
            const eligible = [];

            for (const p of this.players) {
                if (!p.inHand) continue;
                const contrib = Math.min(p.betTotal, level) - prev;
                if (contrib > 0) {
                    amount += contrib;
                    if (p.alive()) eligible.push(p.seat);
                }
            }
            prev = level;

            if (amount <= 0) continue;
            if (eligible.length === 0) {
                carry = amount;
                continue;
            }

            let best = -1;
            let winners = [];
            for (const seat of eligible) {
                const p = this.players[seat];
                const code = eval7(
                    p.hole[0].v, p.hole[1].v,
                    this.board[0].v, this.board[1].v, this.board[2].v,
                    this.board[3].v, this.board[4].v
                );
                p.showdownCode = code;
                this.showdownHands.set(seat, code);
                if (code > best) {
                    best = code;
                    winners = [seat];
                } else if (code === best) {
                    winners.push(seat);
                }
            }
            if (winners.length === 0) continue;

            const share = Math.floor(amount / winners.length);
            let rem = amount % winners.length;

            // 奇数筹码给按钮左手第一位（按钮自己排最后）
            winners.sort((a, b) => {
                const ar = (a - this.button + this.numSeats) % this.numSeats;
                const br = (b - this.button + this.numSeats) % this.numSeats;
                return (ar === 0 ? this.numSeats : ar) - (br === 0 ? this.numSeats : br);
            });

            for (const seat of winners) {
                let give = share;
                if (rem > 0) { give++; rem--; }
                this.players[seat].stack += give;
                this.wonAmount[seat] += give;
                wonAny[seat] = true;
            }
        }

        // 理论上不会出现无人有资格的层；若出现，把死钱给最后赢家
        if (carry > 0) {
            let target = -1;
            for (let i = 0; i < this.numSeats; i++) if (wonAny[i]) { target = i; break; }
            if (target < 0) {
                for (const p of this.players) if (p.alive()) { target = p.seat; break; }
            }
            if (target >= 0) {
                this.players[target].stack += carry;
                this.wonAmount[target] += carry;
                wonAny[target] = true;
            }
        }

        this.winners = [];
        for (let i = 0; i < this.numSeats; i++) if (wonAny[i]) this.winners.push(i);
        this.pot = 0;
    }
}

// ---------------------------------------------------------------------------
//  位置 / 牌力辅助
// ---------------------------------------------------------------------------
function positionName(table, seat) {
    const n = table.numSeats;
    const rel = (seat - table.button + n) % n;
    if (n === 2) return rel === 0 ? "BTN/SB" : "BB";
    if (rel === 0) return "BTN";
    if (rel === 1) return "SB";
    if (rel === 2) return "BB";
    if (rel === n - 1) return "CO";
    if (rel === n - 2) return "HJ";
    if (rel === 3) return "UTG";
    return "MP";
}

function handStrength01(c0, c1) {
    let r0 = c0.rank(), r1 = c1.rank();
    if (r0 < r1) { const t = r0; r0 = r1; r1 = t; }
    const suited = c0.suit() === c1.suit();
    if (r0 === r1) return 0.55 + (r0 / 12) * 0.45;
    let s = (r0 / 12) * 0.55 + (r1 / 12) * 0.25;
    if (suited) s += 0.10;
    const gap = r0 - r1 - 1;
    if (gap === 0) s += 0.15;
    else if (gap === 1) s += 0.10;
    else if (gap === 2) s += 0.04;
    else if (gap >= 4) s -= 0.08;
    if (r0 >= 10 && r1 >= 9) s += 0.05;
    return Math.max(0, Math.min(1, s));
}

function boardTexture(board, boardCount) {
    if (boardCount < 3) return 0.5;
    const ranks = [];
    const suits = [0, 0, 0, 0];
    for (let i = 0; i < boardCount; i++) {
        ranks.push(board[i].rank());
        suits[board[i].suit()]++;
    }
    ranks.sort((a, b) => b - a);
    let wet = 0;
    for (let i = 0; i < ranks.length - 1; i++) {
        const gap = ranks[i] - ranks[i + 1];
        if (gap === 1) wet += 0.15;
        else if (gap === 2) wet += 0.08;
    }
    const maxSuit = Math.max(...suits);
    if (maxSuit >= 3) wet += 0.25;
    if (maxSuit >= 4) wet += 0.20;
    if (ranks[0] >= 11) wet -= 0.05;
    return Math.max(0, Math.min(1, wet));
}

function checkFlushDraw(hole, board, boardCount) {
    const holeSuits = [0, 0, 0, 0];
    const boardSuits = [0, 0, 0, 0];
    for (const c of hole) holeSuits[c.suit()]++;
    for (let i = 0; i < boardCount; i++) boardSuits[board[i].suit()]++;
    // 必须至少有一张手牌参与，否则「公共牌四花色」会被误判成听牌
    for (let s = 0; s < 4; s++) {
        if (holeSuits[s] > 0 && holeSuits[s] + boardSuits[s] === 4) return true;
    }
    return false;
}

function checkStraightDraw(hole, board, boardCount) {
    const ranks = new Set();
    ranks.add(hole[0].rank());
    ranks.add(hole[1].rank());
    for (let i = 0; i < boardCount; i++) ranks.add(board[i].rank());
    const arr = [...ranks];
    if (arr.includes(12)) arr.push(-1);
    arr.sort((a, b) => a - b);
    for (let i = 0; i < arr.length - 3; i++) {
        const span = arr[i + 3] - arr[i];
        if (span === 3) return "oesd";
        if (span === 4) return "gutshot";
    }
    return null;
}

function classifyPostflop(hole, board, boardCount) {
    if (boardCount < 3) return { type: "preflop", strength: 0 };

    const myCode = eval7(hole[0].v, hole[1].v,
        board[0].v, board[1].v, board[2].v,
        board[3].v, board[4].v);
    const myCat = myCode >> 20;

    const boardRanks = [];
    for (let i = 0; i < boardCount; i++) boardRanks.push(board[i].rank());
    const sortedBoard = boardRanks.slice().sort((a, b) => b - a);

    const r0 = hole[0].rank(), r1 = hole[1].rank();
    const isPocket = (r0 === r1);
    const r0OnBoard = boardRanks.includes(r0);
    const r1OnBoard = boardRanks.includes(r1);

    if (myCat >= 5) return { type: "monster", strength: 95 };
    if (myCat === 4) return { type: "monster", strength: 88 };
    if (myCat === 3) {
        if (isPocket && r0OnBoard) return { type: "set", strength: 92 };
        return { type: "trips", strength: 85 };
    }
    if (myCat === 2) {
        if (r0OnBoard && r1OnBoard) return { type: "two_pair", strength: 78 };
        return { type: "two_pair_weak", strength: 70 };
    }
    if (myCat === 1) {
        if (isPocket) {
            const boardMax = Math.max(...boardRanks);
            if (r0 > boardMax) return { type: "overpair", strength: 68 };
            if (r0 < Math.min(...boardRanks)) return { type: "underpair", strength: 32 };
            return { type: "middle_pair", strength: 48 };
        }
        if (r0OnBoard || r1OnBoard) {
            const pairRank = r0OnBoard ? r0 : r1;
            const kicker = r0OnBoard ? r1 : r0;
            const isTop = pairRank === sortedBoard[0];
            if (isTop && kicker === 12) return { type: "tptk", strength: 72 };
            if (isTop) return { type: "top_pair", strength: 60 };
            if (pairRank === sortedBoard[1]) return { type: "middle_pair", strength: 45 };
            return { type: "bottom_pair", strength: 38 };
        }
        return { type: "paired_board", strength: 42 };
    }

    const fd = checkFlushDraw(hole, board, boardCount);
    const sd = checkStraightDraw(hole, board, boardCount);
    if (fd && sd) return { type: "combo_draw", strength: 45 };
    if (fd) return { type: "flush_draw", strength: 36 };
    if (sd === "oesd") return { type: "straight_draw", strength: 32 };
    if (sd === "gutshot") return { type: "gutshot", strength: 22 };
    return { type: "air", strength: 12 };
}

// ---------------------------------------------------------------------------
//  电脑玩家
// ---------------------------------------------------------------------------
function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), 1 | t);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

class Bot {
    constructor(seed) {
        this.rnd = mulberry32(seed || ((Math.random() * 0xFFFFFFFF) >>> 0));
        this.aggr = 0.85 + this.rnd() * 0.35;
        this.bluff = 0.06 + this.rnd() * 0.10;
        this.tight = 0.9 + this.rnd() * 0.25;
    }

    decide(t, seat) {
        const p = t.players[seat];
        if (!p.canAct()) return { action: ACT.CHECK, amount: 0 };
        if (!p.hole[0].valid() || !p.hole[1].valid()) return { action: ACT.CHECK, amount: 0 };
        if (t.street === ST_PREFLOP) return this.preflop(t, seat);
        return this.postflop(t, seat);
    }

    preflop(t, seat) {
        const p = t.players[seat];
        const toCall = Math.max(0, t.currentBet - p.betRound);
        const n = t.activeCount;
        const pos = positionName(t, seat);
        const hs = handStrength01(p.hole[0], p.hole[1]);

        let base;
        if (pos === "BTN") base = 0.49;
        else if (pos === "CO") base = 0.53;
        else if (pos === "HJ") base = 0.56;
        else if (pos === "MP") base = 0.60;
        else if (pos === "UTG") base = 0.65;
        else if (pos === "SB") base = 0.54;
        else if (pos === "BB") base = 0.59;
        else base = 0.58;

        base += Math.max(0, n - 6) * 0.012;
        base *= this.tight;

        const facingRaise = t.currentBet > t.bigBlind * 1.6;
        const facing3Bet = t.currentBet > t.bigBlind * 4.0;

        // 大盲免费看牌
        if (toCall === 0) {
            if (hs > 0.80 && this.rnd() < 0.45 * this.aggr) {
                return this.raiseTo(t, p, Math.round(t.bigBlind * 3 + t.pot * 0.5));
            }
            return { action: ACT.CHECK, amount: 0 };
        }

        if (facing3Bet) {
            if (hs > 0.86 && this.rnd() < 0.55) {
                return { action: ACT.CALL, amount: 0 };
            }
            if (hs > 0.93 && this.rnd() < 0.25) {
                return { action: ACT.ALLIN, amount: 0 };
            }
            return { action: ACT.FOLD, amount: 0 };
        }

        if (facingRaise) {
            const potOdds = toCall / (t.pot + toCall);
            if (hs > 0.82 && this.rnd() < 0.42 * this.aggr) {
                return this.raiseTo(t, p, Math.round(t.currentBet * 2.7 + t.pot * 0.25));
            }
            // 小注、盲注防守可以宽一点
            const discount = toCall <= t.bigBlind * 1.2 ? 0.05 : 0;
            if (hs > base + 0.04 - discount && (hs > 0.38 || potOdds < 0.28)) {
                return { action: ACT.CALL, amount: 0 };
            }
            return { action: ACT.FOLD, amount: 0 };
        }

        // 无人加注
        if (hs > base) {
            if (this.rnd() < 0.62 * this.aggr || hs > 0.86) {
                return this.raiseTo(t, p, Math.round(t.bigBlind * (2.5 + this.rnd() * 1.5) + t.pot * 0.4));
            }
            return { action: ACT.CALL, amount: 0 };
        }
        if (hs > base - 0.07 && (pos === "BTN" || pos === "CO" || pos === "SB" || pos === "BB")) {
            return { action: ACT.CALL, amount: 0 };
        }
        return { action: ACT.FOLD, amount: 0 };
    }

    raiseTo(t, p, target) {
        const maxTo = p.betRound + p.stack;
        const minTo = t.currentBet + t.minRaise;
        const to = Math.max(minTo, Math.min(maxTo, Math.round(target)));
        if (to >= maxTo) return { action: ACT.ALLIN, amount: 0 };
        return { action: t.currentBet > 0 ? ACT.RAISE : ACT.BET, amount: to };
    }

    liveOpponents(t, seat) {
        return t.players.filter(p => p.seat !== seat && p.inHand && !p.folded);
    }

    equity(t, seat, iters) {
        const hero = t.players[seat];
        const board = [];
        for (let i = 0; i < t.boardCount; i++) board.push(t.board[i].v);
        const known = new Set([hero.hole[0].v, hero.hole[1].v, ...board]);
        const remaining = [];
        for (let v = 0; v < 52; v++) if (!known.has(v)) remaining.push(v);

        const opps = this.liveOpponents(t, seat).length;
        const needBoard = 5 - board.length;
        const need = opps * 2 + needBoard;
        if (need > remaining.length) return 0.5;

        let score = 0;
        const rounds = iters || 220;
        for (let it = 0; it < rounds; it++) {
            const deck = remaining.slice();
            for (let i = 0; i < need; i++) {
                const j = i + Math.floor(this.rnd() * (deck.length - i));
                const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
            }

            const fullBoard = board.slice();
            for (let i = 0; i < needBoard; i++) {
                fullBoard.push(deck[opps * 2 + i]);
            }

            const heroCode = eval7(
                hero.hole[0].v, hero.hole[1].v,
                fullBoard[0], fullBoard[1], fullBoard[2],
                fullBoard[3], fullBoard[4]
            );
            let best = heroCode;
            let tied = 1;
            let lost = false;

            for (let k = 0; k < opps; k++) {
                const c0 = deck[k * 2], c1 = deck[k * 2 + 1];
                const code = eval7(c0, c1,
                    fullBoard[0], fullBoard[1], fullBoard[2],
                    fullBoard[3], fullBoard[4]);
                if (code > best) { best = code; lost = true; break; }
                if (code === best) tied++;
            }

            if (!lost) score += 1 / tied;
        }
        return score / rounds;
    }

    postflop(t, seat) {
        const p = t.players[seat];
        const toCall = Math.max(0, t.currentBet - p.betRound);
        const pot = t.pot;
        const opps = this.liveOpponents(t, seat).length;
        const eq = this.equity(t, seat, opps >= 4 ? 150 : 240);
        const hand = classifyPostflop(p.hole, t.board, t.boardCount);
        const texture = boardTexture(t.board, t.boardCount);
        const potOdds = toCall > 0 ? toCall / (pot + toCall) : 0;

        const strong = ["monster", "set", "trips", "two_pair", "tptk", "overpair"].includes(hand.type);
        const medium = ["two_pair_weak", "top_pair", "middle_pair", "paired_board"].includes(hand.type);
        const draw = ["flush_draw", "straight_draw", "oesd", "gutshot", "combo_draw"].includes(hand.type);

        // 无人下注
        if (toCall === 0) {
            let betFrac = 0;
            if (strong) {
                if (this.rnd() < 0.78) betFrac = 0.55 + this.rnd() * 0.30;
            } else if (draw) {
                if (this.rnd() < 0.40 * this.aggr) betFrac = 0.50;
            } else if (medium) {
                if (this.rnd() < 0.30 * this.aggr) betFrac = 0.45;
            } else {
                if (this.rnd() < this.bluff * (texture < 0.45 ? 1.5 : 0.7)) betFrac = 0.50;
            }

            if (betFrac > 0) {
                const target = Math.round(Math.max(t.bigBlind, pot * betFrac));
                return this.raiseTo(t, p, target + p.betRound);
            }
            return { action: ACT.CHECK, amount: 0 };
        }

        // 面对下注
        const allInCall = toCall >= p.stack;
        const required = potOdds + (opps >= 3 ? 0.06 : 0.025);

        if (allInCall) {
            if (eq > required + 0.04 || (draw && eq > required)) {
                return { action: ACT.ALLIN, amount: 0 };
            }
            return { action: ACT.FOLD, amount: 0 };
        }

        if (eq < required) {
            // 便宜的跟注偶尔诈唬/抓鸡
            if (toCall <= t.bigBlind && this.rnd() < 0.12) {
                return { action: ACT.CALL, amount: 0 };
            }
            return { action: ACT.FOLD, amount: 0 };
        }

        if (strong) {
            if (eq > 0.72 && this.rnd() < 0.40 * this.aggr && p.stack > toCall * 2.5) {
                const target = t.currentBet + Math.round((pot + toCall) * 0.75);
                return this.raiseTo(t, p, target);
            }
            return { action: ACT.CALL, amount: 0 };
        }

        if (draw) {
            if (this.rnd() < 0.16 * this.aggr && p.stack > toCall * 3) {
                const target = t.currentBet + Math.round((pot + toCall) * 0.65);
                return this.raiseTo(t, p, target);
            }
            return { action: ACT.CALL, amount: 0 };
        }

        if (medium && eq > required + 0.10) {
            return { action: ACT.CALL, amount: 0 };
        }

        if (this.rnd() < 0.10) return { action: ACT.CALL, amount: 0 };
        return { action: ACT.FOLD, amount: 0 };
    }
}

if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
        Card, INV, eval5, eval7, Table, Player, Bot,
        ACT, ST_UNSTARTED, ST_PREFLOP, ST_FLOP, ST_TURN, ST_RIVER, ST_SHOWDOWN, ST_OVER,
        STREET_NAMES, CAT_NAMES, describeHand, positionName, handStrength01,
    };
}
if (typeof window !== 'undefined') {
    window.PokerEngine = {
        Card, INV, eval5, eval7, Table, Player, Bot,
        ACT, ST_UNSTARTED, ST_PREFLOP, ST_FLOP, ST_TURN, ST_RIVER, ST_SHOWDOWN, ST_OVER,
        STREET_NAMES, CAT_NAMES, describeHand, positionName, handStrength01,
    };
}
/* ==================== ENGINE END ==================== */

</script>
<script>
/* ============================================================================
 *  界面 / 操作 / 联机
 * ==========================================================================*/
(function () {
    'use strict';

    const E = window.PokerEngine;
    const {
        Table, Bot, ACT,
        ST_PREFLOP, ST_FLOP, ST_TURN, ST_RIVER, ST_OVER,
        describeHand, positionName
    } = E;

    const RANKS = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
    const SUITS = ['♣', '♦', '♥', '♠'];
    const POKER_PREFIX = 'dsh-holdem-v2-';
    const W = 1200, H = 760;

    const $ = id => document.getElementById(id);
    const canvas = $('table');
    const ctx = canvas.getContext('2d');

    const fmt = n => Number(n || 0).toLocaleString('en-US');
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const esc = s => String(s).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
    const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

    function cardText(c) {
        const v = (c && typeof c === 'object') ? c.v : c;
        if (v == null || v < 0 || v >= 52) return '?';
        return RANKS[v >> 2] + SUITS[v & 3];
    }
    function cardsText(hole) {
        if (!hole) return '';
        return hole.map(cardText).join(' ');
    }
    function boardText(t, from, to) {
        const arr = [];
        for (let i = from; i < to; i++) arr.push(cardText(t.board[i].v));
        return arr.join(' ');
    }

    function seed() {
        return (Date.now() ^ ((Math.random() * 0xFFFFFFFF) >>> 0)) >>> 0;
    }

    // -----------------------------------------------------------------------
    //  状态
    // -----------------------------------------------------------------------
    const app = {
        stage: 'lobby',          // lobby | host-lobby | playing | over
        mode: null,              // solo | host | client
        config: null,
        table: null,
        mySeat: 0,
        bots: [],
        log: [],
        view: null,
        notice: '',
        raiseTo: 0,
        turnKey: '',
        stageToken: 0,
        botTimer: null,
        humanTimer: null,
        nextTimer: null,
        peer: null,
        code: '',
        conns: new Map(),        // seat -> {seat,name,conn}
        clientConn: null,
        joined: false,
        spectator: false,
        lastCenterHand: null,
    };

    // -----------------------------------------------------------------------
    //  通用 UI
    // -----------------------------------------------------------------------
    let toastTimer = null;
    function showToast(msg, ms = 2200) {
        const el = $('toast');
        el.textContent = msg;
        el.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), ms);
    }

    function addLog(text, cls = '', to = null) {
        app.log.push({ text, cls, to });
        if (app.log.length > 220) app.log.shift();
    }

    function clearTimers() {
        if (app.botTimer) { clearTimeout(app.botTimer); app.botTimer = null; }
        if (app.humanTimer) { clearTimeout(app.humanTimer); app.humanTimer = null; }
        if (app.nextTimer) { clearTimeout(app.nextTimer); app.nextTimer = null; }
        app.stageToken++;
    }

    function readConfig() {
        const name = ($('nickname').value.trim() || '玩家').slice(0, 12);
        const seats = clamp(parseInt($('seatCount').value, 10) || 6, 2, 12);
        const [sb, bb] = $('blinds').value.split('-').map(Number);
        let stack = parseInt($('startStack').value, 10);
        if (!Number.isFinite(stack)) stack = 200;
        stack = clamp(stack, 20, 100000);
        return { name, seats, sb, bb, stack };
    }

    function showGame() {
        app.lastCenterHand = null;
        $('lobby').classList.add('hidden');
        $('game').classList.remove('hidden');
        $('overlay').classList.add('hidden');
        if (window.innerWidth <= 820) {
            showToast('牌桌可左右滑动，查看其他座位', 3000);
        }
    }

    function showLobby() {
        app.stage = 'lobby';
        clearTimers();
        if (app.clientConn) { try { app.clientConn.close(); } catch (e) { } }
        if (app.peer) { try { app.peer.destroy(); } catch (e) { } }
        app.peer = null;
        app.clientConn = null;
        app.conns.clear();
        app.mode = null;
        app.table = null;
        app.view = null;
        app.log = [];
        app.notice = '';
        app.mySeat = 0;
        app.bots = [];
        app.joined = false;
        app.spectator = false;
        app.raiseTo = 0;
        app.turnKey = '';
        $('game').classList.add('hidden');
        $('hostInfo').classList.add('hidden');
        $('joinInfo').classList.add('hidden');
        $('lobbyForm').classList.remove('hidden');
        $('lobby').classList.remove('hidden');
        $('overlay').classList.add('hidden');
        $('btnHost').disabled = false;
        $('btnHost').textContent = '创建房间';
        $('btnConnect').disabled = false;
        $('btnConnect').textContent = '连接';
        $('joinStatus').textContent = '';
        $('hostStatus').textContent = '';
        $('btnStartGame').disabled = false;
        $('raisePanel').classList.add('hidden');
    }

    function showOverlay(title, text, buttons) {
        $('overlayTitle').textContent = title;
        $('overlayText').textContent = text || '';
        const box = $('overlayButtons');
        box.innerHTML = '';
        (buttons || []).forEach(b => {
            const btn = document.createElement('button');
            btn.textContent = b.label;
            if (b.primary) btn.className = 'primary';
            btn.addEventListener('click', b.fn);
            box.appendChild(btn);
        });
        $('overlay').classList.remove('hidden');
    }
    function hideOverlay() { $('overlay').classList.add('hidden'); }

    // -----------------------------------------------------------------------
    //  单机 / 牌局启动
    // -----------------------------------------------------------------------
    function makeBots(table) {
        return table.players.map((p, i) =>
            p.isHuman ? null : new Bot((seed() ^ (i * 104729)) >>> 0)
        );
    }

    function startSolo() {
        const cfg = readConfig();
        app.config = cfg;
        app.mode = 'solo';
        app.mySeat = 0;
        app.stage = 'playing';
        app.log = [];
        app.notice = '';
        app.spectator = false;
        app.bots = [];
        const t = new Table(cfg.seats, cfg.sb, cfg.bb, cfg.stack);
        t.seatPlayer(0, cfg.name, cfg.stack, true);
        for (let i = 1; i < cfg.seats; i++) {
            t.seatPlayer(i, '电脑 ' + i, cfg.stack, false);
        }
        app.table = t;
        app.bots = makeBots(t);
        hideOverlay();
        showGame();
        beginHand();
    }

    function restartSolo() {
        if (!app.config) { showLobby(); return; }
        const cfg = app.config;
        app.mode = 'solo';
        app.mySeat = 0;
        app.stage = 'playing';
        app.log = [];
        app.notice = '';
        app.spectator = false;
        const t = new Table(cfg.seats, cfg.sb, cfg.bb, cfg.stack);
        t.seatPlayer(0, cfg.name, cfg.stack, true);
        for (let i = 1; i < cfg.seats; i++) t.seatPlayer(i, '电脑 ' + i, cfg.stack, false);
        app.table = t;
        app.bots = makeBots(t);
        hideOverlay();
        showGame();
        beginHand();
    }

    function beginHand() {
        if (app.mode === 'client') return;
        if (app.stage !== 'playing') return;
        clearTimers();
        const t = app.table;
        if (!t) return;
        if (t.playersWithChips().length < 2) {
            endGame('牌局结束', '已经没有足够的玩家继续了。');
            return;
        }
        app.notice = '';
        app.turnKey = '';
        const ok = t.startHand(seed());
        if (!ok || t.street === ST_OVER) {
            endGame('牌局结束', '无法开始下一手。');
            return;
        }
        addLog(`—— 第 ${t.handNo} 手 ——`, 'hand');
        const inHand = t.players.filter(p => p.inHand).length;
        addLog(`按钮：${t.players[t.button].name} · 盲注 ${t.smallBlind}/${t.bigBlind} · ${inHand} 人入局`, 'system');
        for (const p of t.players) {
            if (p.isHuman && p.inHand) {
                addLog(`你的手牌：${cardsText(p.hole)}`, 'you', p.seat);
            }
        }
        renderAll();
        scheduleTurn();
    }

    function scheduleTurn() {
        if (app.mode === 'client' || app.stage !== 'playing') return;
        if (app.humanTimer) { clearTimeout(app.humanTimer); app.humanTimer = null; }
        const t = app.table;
        if (!t || t.street === ST_OVER) return;
        const seat = t.toAct;
        if (seat < 0) return;
        const p = t.players[seat];
        if (!p) return;

        if (p.isHuman) {
            // 联机时给远端玩家 40 秒行动时间，超时自动过牌/弃牌，避免整桌卡死
            if (app.mode === 'host' && seat !== app.mySeat) {
                const token = ++app.stageToken;
                app.humanTimer = setTimeout(() => {
                    app.humanTimer = null;
                    if (app.stageToken !== token || app.stage !== 'playing') return;
                    const tt = app.table;
                    if (!tt || tt.street === ST_OVER || tt.toAct !== seat) return;
                    const q = tt.players[seat];
                    const toCall = Math.max(0, tt.currentBet - q.betRound);
                    addLog(`${q.name} 行动超时，自动${toCall > 0 ? '弃牌' : '过牌'}`, 'system');
                    applyAction(seat, toCall > 0 ? ACT.FOLD : ACT.CHECK, 0);
                }, 40000);
            }
            return;
        }

        const token = ++app.stageToken;
        const delay = 420 + Math.random() * 520;
        app.botTimer = setTimeout(() => {
            app.botTimer = null;
            if (app.stageToken !== token || app.stage !== 'playing') return;
            const tt = app.table;
            if (!tt || tt.street === ST_OVER || tt.toAct !== seat) return;
            let d;
            try {
                d = app.bots[seat].decide(tt, seat);
            } catch (e) {
                console.error(e);
                d = { action: ACT.FOLD, amount: 0 };
            }
            applyAction(seat, d.action, d.amount);
        }, delay);
    }

    function applyAction(seat, action, amount) {
        if (app.mode === 'client') return false;
        const t = app.table;
        if (!t || app.stage !== 'playing' || t.street === ST_OVER) return false;
        if (t.toAct !== seat) return false;
        const p = t.players[seat];
        if (!p || !p.canAct()) return false;

        amount = Number(amount);
        if (!Number.isFinite(amount)) amount = 0;
        action = Number(action);

        const beforeBoard = t.boardCount;
        const toCall = Math.max(0, t.currentBet - p.betRound);
        const stackBefore = p.stack;

        if (action === ACT.CHECK && toCall > 0) action = ACT.CALL;
        if (action === ACT.CALL && toCall === 0) action = ACT.CHECK;
        if (action === ACT.BET && t.currentBet > 0) action = ACT.RAISE;
        if (action === ACT.RAISE && t.currentBet === 0) action = ACT.BET;

        let ok = t.act(action, amount);
        if (!ok) {
            if (toCall > 0) { action = ACT.CALL; ok = t.act(ACT.CALL, 0); }
            else { action = ACT.CHECK; ok = t.act(ACT.CHECK, 0); }
            if (!ok) { action = ACT.FOLD; ok = t.act(ACT.FOLD, 0); }
            if (!ok) return false;
        }

        logAction(p, action, toCall, stackBefore);
        if (t.boardCount > beforeBoard) logNewBoard(t, beforeBoard);

        if (t.street === ST_OVER) {
            endHand();
        } else {
            renderAll();
            scheduleTurn();
        }
        return true;
    }

    function logAction(p, action, toCall, stackBefore) {
        switch (action) {
            case ACT.FOLD: addLog(`${p.name} 弃牌`, 'action'); break;
            case ACT.CHECK: addLog(`${p.name} 过牌`, 'action'); break;
            case ACT.CALL: {
                const paid = Math.min(toCall, stackBefore);
                const allin = paid >= stackBefore && p.allIn;
                addLog(`${p.name} ${allin ? '全下跟注' : '跟注'} ${fmt(paid)}`, 'action');
                break;
            }
            case ACT.BET: addLog(`${p.name} 下注 ${fmt(p.betRound)}`, 'action'); break;
            case ACT.RAISE: addLog(`${p.name} 加注到 ${fmt(p.betRound)}`, 'action'); break;
            case ACT.ALLIN: addLog(`${p.name} 全下 ${fmt(p.betRound)}`, 'action'); break;
        }
    }

    function logNewBoard(t, before) {
        if (before < 3 && t.boardCount >= 3) addLog('翻牌：' + boardText(t, 0, 3), 'street');
        if (before < 4 && t.boardCount >= 4) addLog('转牌：' + cardText(t.board[3].v), 'street');
        if (before < 5 && t.boardCount >= 5) addLog('河牌：' + cardText(t.board[4].v), 'street');
    }

    function endHand() {
        const t = app.table;
        if (!t) return;

        if (t.wentToShowdown) {
            for (const p of t.players) {
                if (!p.inHand || p.folded) continue;
                const code = t.showdownHands.get(p.seat) || 0;
                addLog(`摊牌 · ${p.name}：${cardsText(p.hole)} — ${describeHand(code)}`, 'showdown');
            }
        }
        for (const s of t.winners) {
            const amt = t.wonAmount[s];
            if (amt > 0) {
                addLog(`${t.players[s].name} 赢得 ${fmt(amt)}${t.winners.length > 1 ? '（平分）' : ''}`, 'win');
            }
        }
        if (!t.winners.length) addLog('本手结束，无人获胜', 'system');

        const withChips = t.players.filter(p => p.occupied && p.stack > 0);
        if (withChips.length < 2) {
            renderAll();
            endGame('牌局结束', withChips.length === 1
                ? `${withChips[0].name} 是最后的赢家。`
                : '所有玩家都没有筹码了。');
            return;
        }
        if (app.mode === 'solo') {
            const me = t.players[app.mySeat];
            if (!me || me.stack <= 0) {
                renderAll();
                endGame('你输光了', '筹码已经归零，要不要再来一局？', true);
                return;
            }
        }
        scheduleNextHand();
    }

    function scheduleNextHand() {
        app.notice = '下一手即将开始…';
        renderAll();
        const token = ++app.stageToken;
        app.nextTimer = setTimeout(() => {
            app.nextTimer = null;
            if (app.stageToken !== token || app.stage !== 'playing') return;
            beginHand();
        }, 4600);
    }

    function endGame(title, text, soloRestart, remote) {
        if (app.stage === 'over') return;
        clearTimers();
        app.stage = 'over';
        app.notice = '';
        if (app.mode === 'host' && !remote) {
            for (const m of app.conns.values()) {
                if (m.conn && m.conn.open) {
                    try { m.conn.send({ t: 'over', title, text }); } catch (e) { }
                }
            }
        }
        const buttons = [];
        if (soloRestart && app.mode === 'solo') {
            buttons.push({ label: '再来一局', primary: true, fn: restartSolo });
        }
        buttons.push({ label: '返回大厅', fn: showLobby });
        showOverlay(title, text, buttons);
    }

    // -----------------------------------------------------------------------
    //  视图构建
    // -----------------------------------------------------------------------
    function buildView(t, yourSeat) {
        const street = t.street;
        const showdown = street === ST_OVER && t.wentToShowdown;
        const seats = t.players.map((p, i) => {
            let hole = null;
            if (p.occupied && p.inHand && !p.folded && (i === yourSeat || showdown)) {
                hole = [p.hole[0].v, p.hole[1].v];
            }
            let label = '';
            if (showdown && p.alive() && t.showdownHands.has(i)) {
                label = describeHand(t.showdownHands.get(i));
            }
            return {
                seat: i,
                name: p.name,
                isHuman: p.isHuman,
                occupied: p.occupied,
                stack: p.stack,
                betRound: p.betRound,
                betTotal: p.betTotal,
                inHand: p.inHand,
                folded: p.folded,
                allIn: p.allIn,
                hole,
                pos: p.occupied ? positionName(t, i) : '',
                isDealer: i === t.button,
                isTurn: i === t.toAct && street !== ST_OVER,
                isWinner: street === ST_OVER && t.wonAmount[i] > 0,
                won: t.wonAmount[i],
                handLabel: label,
            };
        });

        let legal = null;
        const me = t.players[yourSeat];
        if (yourSeat >= 0 && me && street !== ST_OVER && t.toAct === yourSeat && me.canAct()) {
            const toCall = Math.max(0, t.currentBet - me.betRound);
            const maxTo = me.betRound + me.stack;
            let minTo = t.currentBet > 0 ? t.currentBet + t.minRaise : t.bigBlind;
            minTo = Math.max(minTo, t.bigBlind);
            legal = {
                turn: true,
                toCall: Math.min(toCall, me.stack),
                canCheck: toCall === 0,
                canCall: toCall > 0,
                canRaise: maxTo > t.currentBet && me.stack > toCall,
                minRaiseTo: Math.min(minTo, maxTo),
                maxRaiseTo: maxTo,
                stack: me.stack,
            };
        }

        let result = '';
        if (street === ST_OVER) {
            const winners = t.winners.filter(s => t.wonAmount[s] > 0);
            if (winners.length === 1) {
                result = `${t.players[winners[0]].name} 赢得 ${fmt(t.wonAmount[winners[0]])}`;
            } else if (winners.length > 1) {
                result = `平分底池：${winners.map(s => t.players[s].name).join('、')}`;
            } else {
                result = '本手结束';
            }
        }

        const log = app.log
            .filter(e => e.to == null || e.to === yourSeat)
            .slice(-80);

        return {
            numSeats: t.numSeats,
            smallBlind: t.smallBlind,
            bigBlind: t.bigBlind,
            handNo: t.handNo,
            street,
            board: t.board.map(c => c.v),
            boardCount: t.boardCount,
            pot: t.pot,
            currentBet: t.currentBet,
            minRaise: t.minRaise,
            button: t.button,
            toAct: t.toAct,
            seats,
            yourSeat,
            legal,
            winners: t.winners.slice(),
            wentToShowdown: t.wentToShowdown,
            result,
            notice: app.notice,
            log,
        };
    }

    function renderAll() {
        if (app.mode === 'client' || !app.table) return;
        const view = buildView(app.table, app.mySeat);
        app.view = view;
        renderView(view);
        if (app.mode === 'host') broadcastState();
    }

    function broadcastState() {
        if (!app.table || app.stage !== 'playing') return;
        for (const [seat, m] of app.conns) {
            if (!m.conn || !m.conn.open) continue;
            try {
                m.conn.send({ t: 'state', view: buildView(app.table, seat) });
            } catch (e) { }
        }
    }

    function renderView(view) {
        app.view = view;
        try {
            drawTable(view);
        } catch (e) {
            console.error('draw error', e);
        }
        // 手机端牌桌比屏幕宽，横向滚动；每一手开始时自动居中
        if (window.innerWidth <= 820 && app.lastCenterHand !== view.handNo) {
            app.lastCenterHand = view.handNo;
            requestAnimationFrame(() => {
                const wrap = $('tableWrap');
                if (wrap) wrap.scrollLeft = Math.max(0, (wrap.scrollWidth - wrap.clientWidth) / 2);
            });
        }
        renderTopbar(view);
        renderStatus(view);
        renderLog(view);
        renderControls(view);
    }

    function renderTopbar(view) {
        $('tableInfo').innerHTML =
            `<b>${view.numSeats}</b> 人桌 · 盲注 <b>${view.smallBlind}/${view.bigBlind}</b> · 第 <b>${view.handNo}</b> 手`;
    }

    function renderStatus(view) {
        let s = '';
        const me = view.seats[view.yourSeat];
        if (view.notice) s = view.notice;
        else if (view.street === ST_OVER) s = view.result || '本手结束';
        else if (view.toAct === view.yourSeat) s = '轮到你行动';
        else if (view.toAct >= 0 && view.seats[view.toAct]) s = `${view.seats[view.toAct].name} 行动中…`;
        if (!view.notice && view.street !== ST_OVER && me && me.stack <= 0) {
            s = '你已出局，观战中';
        }
        $('status').textContent = s;
    }

    function renderLog(view) {
        const el = $('log');
        const list = view.log || [];
        el.innerHTML = list.map(e =>
            `<div class="log-line ${e.cls || 'white'}">${esc(e.text)}</div>`
        ).join('');
        el.scrollTop = el.scrollHeight;
    }

    // -----------------------------------------------------------------------
    //  操作控件
    // -----------------------------------------------------------------------
    function renderControls(view) {
        const legal = view.legal;
        const turn = !!(legal && legal.turn);

        $('btnFold').disabled = !turn;
        $('btnCheckCall').disabled = !turn;
        $('btnRaise').disabled = !turn || !legal.canRaise;
        $('btnAllIn').disabled = !turn || !legal || legal.stack <= 0;

        if (turn) {
            $('btnCheckCall').textContent = legal.canCheck ? '过牌' : `跟注 ${fmt(legal.toCall)}`;
            $('btnRaise').textContent = view.currentBet > 0 ? '加注' : '下注';
        } else {
            $('btnCheckCall').textContent = '过牌';
            $('btnRaise').textContent = '加注';
        }

        if (turn && legal.canRaise) {
            $('raisePanel').classList.remove('hidden');
            const key = `${view.handNo}|${view.street}|${view.toAct}|${view.currentBet}|${legal.minRaiseTo}|${legal.maxRaiseTo}`;
            if (key !== app.turnKey) {
                app.turnKey = key;
                app.raiseTo = legal.minRaiseTo;
            }
            setRaiseTo(app.raiseTo);
        } else {
            $('raisePanel').classList.add('hidden');
        }
    }

    function setRaiseTo(v) {
        const view = app.view;
        if (!view || !view.legal) return;
        const legal = view.legal;
        let val = Math.round(Number(v) || 0);
        val = clamp(val, legal.minRaiseTo, legal.maxRaiseTo);
        app.raiseTo = val;
        $('raiseSlider').min = legal.minRaiseTo;
        $('raiseSlider').max = legal.maxRaiseTo;
        $('raiseSlider').value = val;
        $('raiseAmount').value = val;
        $('raiseLabel').textContent =
            (view.currentBet > 0 ? '加注到 ' : '下注 ') + fmt(val);
    }

    function quickRaise(frac) {
        const view = app.view;
        if (!view || !view.legal) return;
        const legal = view.legal;
        let target;
        if (view.currentBet === 0) {
            target = Math.max(legal.minRaiseTo, Math.round(view.pot * frac));
        } else {
            target = view.currentBet + Math.round((view.pot + legal.toCall) * frac);
        }
        setRaiseTo(target);
    }

    function doAction(action, amount) {
        const view = app.view;
        if (!view || !view.legal || !view.legal.turn) return;
        if (app.mode === 'client') {
            if (app.clientConn && app.clientConn.open) {
                try {
                    app.clientConn.send({ t: 'action', action, amount: amount || 0 });
                } catch (e) { }
                $('btnFold').disabled = true;
                $('btnCheckCall').disabled = true;
                $('btnRaise').disabled = true;
                $('btnAllIn').disabled = true;
                $('raisePanel').classList.add('hidden');
            }
            return;
        }
        applyAction(app.mySeat, action, amount);
    }

    // -----------------------------------------------------------------------
    //  绘画
    // -----------------------------------------------------------------------
    function roundRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
        ctx.lineTo(x + rr, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
        ctx.lineTo(x, y + rr);
        ctx.quadraticCurveTo(x, y, x + rr, y);
        ctx.closePath();
    }

    function drawCard(x, y, w, h, v, faceUp) {
        ctx.save();
        if (faceUp && v != null && v >= 0 && v < 52) {
            ctx.shadowColor = 'rgba(0,0,0,.45)';
            ctx.shadowBlur = Math.max(4, w * 0.10);
            ctx.shadowOffsetY = Math.max(2, h * 0.03);
            roundRect(x, y, w, h, w * 0.11);
            ctx.fillStyle = '#f8f6ef';
            ctx.fill();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#c9c3b4';
            ctx.stroke();

            const rank = RANKS[v >> 2];
            const suit = SUITS[v & 3];
            const red = (v & 3) === 1 || (v & 3) === 2;
            ctx.fillStyle = red ? '#c0392b' : '#1b2430';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = `800 ${Math.max(11, Math.round(w * 0.32))}px Consolas, "Microsoft YaHei", sans-serif`;
            ctx.fillText(rank, x + w * 0.09, y + h * 0.05);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `${Math.max(14, Math.round(w * 0.38))}px "Segoe UI Symbol", "Microsoft YaHei", sans-serif`;
            ctx.fillText(suit, x + w * 0.5, y + h * 0.62);
            ctx.font = `700 ${Math.max(8, Math.round(w * 0.18))}px Consolas, sans-serif`;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.globalAlpha = 0.55;
            ctx.fillText(suit, x + w * 0.90, y + h * 0.95);
        } else {
            ctx.shadowColor = 'rgba(0,0,0,.45)';
            ctx.shadowBlur = Math.max(4, w * 0.10);
            ctx.shadowOffsetY = Math.max(2, h * 0.03);
            roundRect(x, y, w, h, w * 0.11);
            const g = ctx.createLinearGradient(x, y, x + w, y + h);
            g.addColorStop(0, '#1e3358');
            g.addColorStop(1, '#101c33');
            ctx.fillStyle = g;
            ctx.fill();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#4b6c9f';
            ctx.stroke();

            ctx.save();
            roundRect(x + 3, y + 3, w - 6, h - 6, w * 0.09);
            ctx.clip();
            ctx.strokeStyle = 'rgba(120,160,220,.13)';
            ctx.lineWidth = 1;
            for (let i = -h; i < w; i += 7) {
                ctx.beginPath();
                ctx.moveTo(x + i, y);
                ctx.lineTo(x + i + h, y + h);
                ctx.stroke();
            }
            ctx.restore();

            ctx.fillStyle = 'rgba(160,195,240,.28)';
            ctx.font = `${Math.max(12, Math.round(w * 0.36))}px "Segoe UI Symbol", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('♠', x + w / 2, y + h / 2);
        }
        ctx.restore();
    }

    function seatPoint(i, n, mySeat) {
        const angle = Math.PI / 2 + ((i - mySeat + n) % n) * (Math.PI * 2 / n);
        return {
            x: 600 + Math.cos(angle) * 505,
            y: 380 + Math.sin(angle) * 288,
            angle,
        };
    }

    function drawChip(x, y, amount) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fillStyle = '#b9792b';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#f0c46a';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 9, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,.45)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ffe2a0';
        ctx.font = '700 12px Consolas, "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(fmt(amount), x, y + 18);
        ctx.restore();
    }

    function drawSeat(view, i) {
        const p = view.seats[i];
        if (!p || !p.occupied) return;
        const pt = seatPoint(i, view.numSeats, view.yourSeat);
        const { x, y } = pt;
        const dense = view.numSeats >= 10;
        const w = dense ? 132 : 150, h = dense ? 76 : 84;

        const dx = 600 - x, dy = 380 - y;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;

        // 下注筹码
        if (p.betRound > 0) {
            const cardDist = (dense ? 72 : 82) + Math.abs(ux) * (dense ? 48 : 60) + Math.abs(uy) * (dense ? 14 : 20);
            const chipDist = cardDist + (dense ? 62 : 72);
            drawChip(x + ux * chipDist, y + uy * chipDist, p.betRound);
        }

        // 手牌
        if (p.inHand && !p.folded) {
            const cardW = dense ? 40 : 48, cardH = dense ? 55 : 66, gap = dense ? 4 : 5;
            const cardDist = (dense ? 72 : 82) + Math.abs(ux) * (dense ? 48 : 60) + Math.abs(uy) * (dense ? 14 : 20);
            const ccx = x + ux * cardDist;
            const ccy = y + uy * cardDist;
            const left = ccx - (cardW * 2 + gap) / 2;
            const top = ccy - cardH / 2;
            if (p.hole && p.hole[0] >= 0) {
                drawCard(left, top, cardW, cardH, p.hole[0], true);
                drawCard(left + cardW + gap, top, cardW, cardH, p.hole[1], true);
            } else {
                drawCard(left, top, cardW, cardH, -1, false);
                drawCard(left + cardW + gap, top, cardW, cardH, -1, false);
            }
        }

        ctx.save();
        if (p.folded) ctx.globalAlpha = 0.42;

        // 座位底板
        let fill = 'rgba(16,22,31,.94)';
        if (p.isWinner) fill = 'rgba(60,47,18,.96)';
