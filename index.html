        else if (p.isTurn) fill = 'rgba(30,45,67,.97)';
        else if (i === view.yourSeat) fill = 'rgba(24,37,57,.95)';
        if (p.folded) fill = 'rgba(15,19,26,.72)';

        roundRect(x - w / 2, y - h / 2, w, h, 13);
        ctx.fillStyle = fill;
        ctx.fill();

        if (p.isWinner) {
            ctx.shadowColor = 'rgba(255,210,90,.7)';
            ctx.shadowBlur = 20;
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffd46b';
        } else if (p.isTurn) {
            ctx.shadowColor = 'rgba(240,192,64,.55)';
            ctx.shadowBlur = 16;
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#e8c05a';
        } else if (i === view.yourSeat) {
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#4f7fb8';
        } else {
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#2d3747';
        }
        ctx.stroke();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;

        // 名字
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = p.folded ? '#7c8698' : '#eef1f6';
        ctx.font = `700 ${dense ? 13 : 14}px "Microsoft YaHei", sans-serif`;
        ctx.fillText(trunc(p.name, dense ? 7 : 9), x - w / 2 + 12, y - (dense ? 12 : 14));

        // 位置
        if (p.pos) {
            ctx.textAlign = 'right';
            ctx.fillStyle = '#7f8ba0';
            ctx.font = `${dense ? 9 : 11}px Consolas, "Microsoft YaHei", sans-serif`;
            ctx.fillText(p.pos, x + w / 2 - 10, y - (dense ? 20 : 24));
        }

        // 筹码
        ctx.textAlign = 'left';
        ctx.fillStyle = p.stack <= 0 ? '#8a5a5a' : '#e8c05a';
        ctx.font = `700 ${dense ? 14 : 15}px Consolas, "Microsoft YaHei", sans-serif`;
        ctx.fillText(p.stack <= 0 ? '出局' : '● ' + fmt(p.stack), x - w / 2 + 12, y + (dense ? 12 : 14));

        // 全下标记
        if (p.allIn) {
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ff8f8f';
            ctx.font = `800 ${dense ? 9 : 10}px Consolas, sans-serif`;
            ctx.fillText('ALL IN', x + w / 2 - 10, y + (dense ? 12 : 14));
        }

        // 赢家金额
        if (p.isWinner && p.won > 0) {
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffe08a';
            ctx.font = `800 ${dense ? 11 : 12}px Consolas, "Microsoft YaHei", sans-serif`;
            ctx.fillText('+' + fmt(p.won), x + w / 2 - 10, y + (dense ? 28 : 32));
        }

        // 按钮
        if (p.isDealer) {
            const br = dense ? 10 : 11;
            ctx.beginPath();
            ctx.arc(x + w / 2 - 12, y - h / 2 + 12, br, 0, Math.PI * 2);
            ctx.fillStyle = '#f3f1e8';
            ctx.fill();
            ctx.strokeStyle = '#b7ab8c';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = '#2a2a26';
            ctx.font = `800 ${dense ? 10 : 11}px Consolas, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('D', x + w / 2 - 12, y - h / 2 + 12);
        }

        ctx.restore();
    }

    function drawTable(view) {
        ctx.clearRect(0, 0, W, H);

        const cx = 600, cy = 380;

        // 桌脚阴影
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy + 14, 578, 344, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,.45)';
        ctx.filter = 'blur(18px)';
        ctx.fill();
        ctx.restore();

        // 外圈
        ctx.beginPath();
        ctx.ellipse(cx, cy, 568, 332, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#2b1d13';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#6d4d2a';
        ctx.stroke();

        // 木质内圈
        ctx.beginPath();
        ctx.ellipse(cx, cy, 552, 318, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#432f1e';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,220,160,.18)';
        ctx.stroke();

        // 绒布
        const g = ctx.createRadialGradient(cx, cy - 70, 40, cx, cy, 540);
        g.addColorStop(0, '#1d6c53');
        g.addColorStop(0.55, '#12513f');
        g.addColorStop(1, '#0a3026');
        ctx.beginPath();
        ctx.ellipse(cx, cy, 530, 298, 0, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,.055)';
        ctx.stroke();

        // 内圈线
        ctx.beginPath();
        ctx.ellipse(cx, cy, 430, 228, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,.045)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 公共牌
        const bw = 78, bh = 106, gap = 12;
        const total = bw * 5 + gap * 4;
        const bx = cx - total / 2;
        const by = 336;
        for (let i = 0; i < 5; i++) {
            const x = bx + i * (bw + gap);
            if (i < view.boardCount && view.board[i] >= 0) {
                drawCard(x, by, bw, bh, view.board[i], true);
            } else {
                roundRect(x, by, bw, bh, 9);
                ctx.fillStyle = 'rgba(0,0,0,.15)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,.055)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        // 底池
        if (view.pot > 0) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(240,220,170,.72)';
            ctx.font = '12px "Microsoft YaHei", sans-serif';
            ctx.fillText('底池', cx, by - 44);
            ctx.fillStyle = '#ffe08a';
            ctx.font = '800 27px Consolas, "Microsoft YaHei", sans-serif';
            ctx.fillText(fmt(view.pot), cx, by - 18);
        }

        // 座位
        for (let i = 0; i < view.numSeats; i++) drawSeat(view, i);
    }

    // -----------------------------------------------------------------------
    //  联机：房主
    // -----------------------------------------------------------------------
    let peerPromise = null;

    function loadPeer() {
        if (window.Peer) return Promise.resolve();
        if (peerPromise) return peerPromise;
        peerPromise = new Promise((resolve, reject) => {
            const urls = [
                'https://cdn.bootcdn.net/ajax/libs/peerjs/1.5.4/peerjs.min.js',
                'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
                'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
            ];
            let i = 0;
            const next = () => {
                if (i >= urls.length) { peerPromise = null; reject(new Error('PeerJS 加载失败')); return; }
                const s = document.createElement('script');
                s.src = urls[i++];
                s.async = true;
                s.onload = () => window.Peer ? resolve() : next();
                s.onerror = next;
                document.head.appendChild(s);
            };
            next();
        });
        return peerPromise;
    }

    function randomCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let s = '';
        for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
        return s;
    }

    async function createRoom() {
        if (app.stage !== 'lobby') return;
        const cfg = readConfig();
        app.config = cfg;
        $('btnHost').disabled = true;
        $('btnHost').textContent = '连接中…';
        try {
            await loadPeer();
        } catch (e) {
            $('btnHost').disabled = false;
            $('btnHost').textContent = '创建房间';
            showToast('PeerJS 加载失败，请检查网络');
            return;
        }
        openHostPeer(0);
    }

    function openHostPeer(attempt) {
        const code = randomCode();
        const peer = new Peer(POKER_PREFIX + code, { debug: 0 });
        let opened = false;
        app.peer = peer;

        peer.on('open', () => {
            opened = true;
            app.code = code;
            app.stage = 'host-lobby';
            $('roomCode').textContent = code;
            const cfg = app.config;
            $('hostSeatInfo').textContent = `${cfg.seats} 人桌 · 盲注 ${cfg.sb}/${cfg.bb} · 起始 ${fmt(cfg.stack)}`;
            $('hostStatus').textContent = '正在等待玩家加入…';
            $('hostPlayers').innerHTML = '';
            $('lobbyForm').classList.add('hidden');
            $('hostInfo').classList.remove('hidden');
            updateHostLobby();
        });

        peer.on('connection', conn => setupHostConnection(conn));

        peer.on('error', err => {
            if (!opened && err.type === 'unavailable-id' && attempt < 4) {
                try { peer.destroy(); } catch (e) { }
                openHostPeer(attempt + 1);
                return;
            }
            if (!opened) {
                $('btnHost').disabled = false;
                $('btnHost').textContent = '创建房间';
                showToast('创建房间失败：' + (err.type || err.message));
            } else {
                $('hostStatus').textContent = '连接异常：' + (err.type || err.message);
            }
        });

        peer.on('disconnected', () => {
            if (app.peer === peer && app.stage !== 'lobby') {
                try { peer.reconnect(); } catch (e) { }
            }
        });
    }

    function setupHostConnection(conn) {
        conn.on('data', data => {
            try { onHostData(conn, data); } catch (e) { console.error(e); }
        });
        conn.on('close', () => onHostDisconnect(conn));
        conn.on('error', () => { });
    }

    function onHostData(conn, data) {
        if (!data || typeof data !== 'object') return;
        if (data.t === 'join') {
            if (app.stage !== 'host-lobby') {
                try { conn.send({ t: 'error', msg: '游戏已经开始，无法加入' }); } catch (e) { }
                setTimeout(() => { try { conn.close(); } catch (e) { } }, 300);
                return;
            }
            if (conn.meta) return;
            const used = new Set([0]);
            for (const m of app.conns.values()) used.add(m.seat);
            let seat = -1;
            for (let i = 1; i < app.config.seats; i++) {
                if (!used.has(i)) { seat = i; break; }
            }
            if (seat < 0) {
                try { conn.send({ t: 'error', msg: '房间已满' }); } catch (e) { }
                return;
            }
            const name = (String(data.name || '玩家').trim().slice(0, 12)) || '玩家';
            const meta = { seat, name, conn };
            conn.meta = meta;
            app.conns.set(seat, meta);
            try {
                conn.send({
                    t: 'welcome', seat, code: app.code, config: app.config,
                });
            } catch (e) { }
            updateHostLobby();
        } else if (data.t === 'action') {
            if (app.stage !== 'playing' || !conn.meta) return;
            const ok = applyAction(conn.meta.seat, data.action, data.amount);
            if (!ok && app.table) {
                try {
                    conn.send({ t: 'state', view: buildView(app.table, conn.meta.seat) });
                } catch (e) { }
            }
        } else if (data.t === 'leave') {
            try { conn.close(); } catch (e) { }
        }
    }

    function updateHostLobby() {
        if (app.stage !== 'host-lobby') return;
        const players = [{ seat: 0, name: app.config.name, host: true }];
        for (const [seat, m] of app.conns) players.push({ seat, name: m.name });
        players.sort((a, b) => a.seat - b.seat);
        $('hostPlayers').innerHTML = players.map(p =>
            `<li class="${p.host ? 'host' : ''}">${p.host ? '房主 · ' : ''}${esc(p.name)}</li>`
        ).join('');
        $('hostStatus').textContent =
            `已就座 ${players.length} / ${app.config.seats} 人，空位由电脑补足`;
        for (const m of app.conns.values()) {
            if (!m.conn || !m.conn.open) continue;
            try {
                m.conn.send({
                    t: 'lobby', code: app.code, seats: app.config.seats,
                    players: players.map(p => ({ seat: p.seat, name: p.name })),
                });
            } catch (e) { }
        }
    }

    function startHostGame() {
        if (app.stage !== 'host-lobby') return;
        const cfg = app.config;
        const t = new Table(cfg.seats, cfg.sb, cfg.bb, cfg.stack);
        t.seatPlayer(0, cfg.name, cfg.stack, true);
        for (const m of app.conns.values()) {
            t.seatPlayer(m.seat, m.name, cfg.stack, true);
        }
        for (let i = 0; i < cfg.seats; i++) {
            if (!t.players[i].occupied) {
                t.seatPlayer(i, '电脑 ' + i, cfg.stack, false);
            }
        }
        app.table = t;
        app.mode = 'host';
        app.mySeat = 0;
        app.stage = 'playing';
        app.log = [];
        app.notice = '';
        app.spectator = false;
        app.bots = makeBots(t);

        for (const m of app.conns.values()) {
            if (!m.conn || !m.conn.open) continue;
            try { m.conn.send({ t: 'start', seat: m.seat, config: cfg }); } catch (e) { }
        }
        $('hostInfo').classList.add('hidden');
        $('lobbyForm').classList.add('hidden');
        hideOverlay();
        showGame();
        beginHand();
    }

    function onHostDisconnect(conn) {
        const meta = conn.meta;
        if (!meta) return;
        conn.meta = null;
        app.conns.delete(meta.seat);
        if (app.stage === 'host-lobby') {
            updateHostLobby();
            return;
        }
        if (app.stage === 'playing' && app.table) {
            const p = app.table.players[meta.seat];
            if (p && p.occupied && p.isHuman) {
                p.isHuman = false;
                p.name = meta.name + '·托管';
                app.bots[meta.seat] = new Bot((seed() ^ (meta.seat * 7919)) >>> 0);
                addLog(`${meta.name} 掉线，由电脑接管`, 'system');
                renderAll();
                if (app.table.toAct === meta.seat && app.table.street !== ST_OVER) {
                    scheduleTurn();
                }
            }
        }
    }

    // -----------------------------------------------------------------------
    //  联机：客户端
    // -----------------------------------------------------------------------
    async function joinRoom() {
        if (app.joined) return;
        const cfg = readConfig();
        const code = ($('joinCode').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
        if (code.length !== 5) { $('joinStatus').textContent = '请输入 5 位房间码'; return; }
        $('btnConnect').disabled = true;
        $('btnConnect').textContent = '连接中…';
        $('joinStatus').textContent = '正在连接…';
        try {
            await loadPeer();
        } catch (e) {
            resetJoinButton();
            $('joinStatus').textContent = 'PeerJS 加载失败，请检查网络';
            return;
        }

        const peer = new Peer({ debug: 0 });
        app.peer = peer;
        let welcomeTimer = null;

        peer.on('open', () => {
            const conn = peer.connect(POKER_PREFIX + code, { reliable: true });
            app.clientConn = conn;

            conn.on('open', () => {
                try { conn.send({ t: 'join', name: cfg.name }); } catch (e) { }
                welcomeTimer = setTimeout(() => {
                    if (!app.joined) {
                        $('joinStatus').textContent = '连接超时，请确认房间码和网络';
                        resetJoinButton();
                    }
                }, 10000);
            });

            conn.on('data', data => {
                try { onClientData(data); } catch (e) { console.error(e); }
            });

            conn.on('close', () => {
                if (welcomeTimer) clearTimeout(welcomeTimer);
                onClientClose();
            });

            conn.on('error', () => {
                $('joinStatus').textContent = '连接出错';
                resetJoinButton();
            });
        });

        peer.on('error', err => {
            if (err.type === 'peer-unavailable') {
                $('joinStatus').textContent = '房间不存在，或房主已经离开';
            } else {
                $('joinStatus').textContent = '连接失败：' + (err.type || err.message);
            }
            resetJoinButton();
        });

        peer.on('disconnected', () => {
            if (app.peer === peer) { try { peer.reconnect(); } catch (e) { } }
        });
    }

    function resetJoinButton() {
        if (app.stage === 'join-lobby' || app.stage === 'lobby') {
            $('btnConnect').disabled = false;
            $('btnConnect').textContent = '连接';
        }
    }

    function onClientData(data) {
        if (!data || typeof data !== 'object') return;
        if (data.t === 'welcome') {
            app.joined = true;
            app.mySeat = data.seat;
            app.config = data.config;
            app.code = data.code;
            $('joinStatus').textContent =
                `已加入房间（座位 ${data.seat + 1}），等待房主开始…`;
            $('btnConnect').disabled = true;
            $('btnConnect').textContent = '已加入';
        } else if (data.t === 'lobby') {
            if (!app.joined) return;
            const names = (data.players || []).map(p => p.name).join('、');
            $('joinStatus').textContent =
                `房间 ${data.players.length}/${data.seats} 人：${names}。等待房主开始…`;
        } else if (data.t === 'start') {
            app.config = data.config;
            app.mySeat = data.seat;
            app.mode = 'client';
            app.stage = 'playing';
            app.log = [];
            app.notice = '';
            app.spectator = false;
            $('joinInfo').classList.add('hidden');
            $('lobbyForm').classList.add('hidden');
            hideOverlay();
            showGame();
            $('status').textContent = '正在同步牌桌…';
        } else if (data.t === 'state') {
            const v = data.view;
            if (!v) return;
            if (app.stage !== 'playing') {
                app.stage = 'playing';
                showGame();
            }
            app.mySeat = v.yourSeat;
            app.view = v;
            renderView(v);
        } else if (data.t === 'over') {
            endGame(data.title || '牌局结束', data.text || '', false, true);
        } else if (data.t === 'error') {
            $('joinStatus').textContent = data.msg || '发生错误';
        }
    }

    function onClientClose() {
        if (app.stage === 'lobby' || app.stage === 'host-lobby') return;
        if (app.stage === 'playing' || app.stage === 'over') {
            clearTimers();
            app.stage = 'over';
            showOverlay('连接断开', '与房主的连接已断开。', [
                { label: '返回大厅', primary: true, fn: showLobby },
            ]);
        } else {
            app.joined = false;
            $('joinStatus').textContent = '连接已断开';
            resetJoinButton();
        }
    }

    function leaveGame() {
        if (app.stage === 'playing' && (app.mode === 'host' || app.mode === 'client')) {
            if (!window.confirm('离开将结束当前房间，确定吗？')) return;
        }
        showLobby();
    }

    // -----------------------------------------------------------------------
    //  初始化
    // -----------------------------------------------------------------------
    function setupCanvas() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function init() {
        setupCanvas();

        $('btnSolo').addEventListener('click', startSolo);

        $('btnHost').addEventListener('click', createRoom);
        $('btnCancelHost').addEventListener('click', showLobby);
        $('btnStartGame').addEventListener('click', startHostGame);

        $('btnJoin').addEventListener('click', () => {
            app.stage = 'join-lobby';
            $('lobbyForm').classList.add('hidden');
            $('joinInfo').classList.remove('hidden');
            $('joinCode').focus();
        });
        $('btnCancelJoin').addEventListener('click', showLobby);
        $('btnConnect').addEventListener('click', joinRoom);
        $('joinCode').addEventListener('keydown', e => {
            if (e.key === 'Enter') joinRoom();
        });

        $('btnLeave').addEventListener('click', leaveGame);

        $('btnFold').addEventListener('click', () => doAction(ACT.FOLD, 0));
        $('btnCheckCall').addEventListener('click', () => {
            const v = app.view;
            if (!v || !v.legal) return;
            doAction(v.legal.canCheck ? ACT.CHECK : ACT.CALL, 0);
        });
        $('btnRaise').addEventListener('click', () => {
            const v = app.view;
            if (!v || !v.legal || !v.legal.canRaise) return;
            doAction(v.currentBet > 0 ? ACT.RAISE : ACT.BET, app.raiseTo);
        });
        $('btnAllIn').addEventListener('click', () => doAction(ACT.ALLIN, 0));

        $('raiseSlider').addEventListener('input', e => setRaiseTo(e.target.value));
        $('raiseAmount').addEventListener('change', e => setRaiseTo(e.target.value));
        document.querySelectorAll('.quick-row button[data-frac]').forEach(btn => {
            btn.addEventListener('click', () => quickRaise(parseFloat(btn.dataset.frac)));
        });
        $('btnMaxRaise').addEventListener('click', () => {
            if (app.view && app.view.legal) setRaiseTo(app.view.legal.maxRaiseTo);
        });

        // 调试/截图：?demo=1&seats=12 直接开一局单机
        const params = new URLSearchParams(location.search);
        if (params.has('demo')) {
            const s = parseInt(params.get('seats'), 10);
            if (s >= 2 && s <= 12) $('seatCount').value = String(s);
            if (params.get('name')) $('nickname').value = params.get('name');
            setTimeout(startSolo, 120);
        }
    }

    init();

    // 调试入口（控制台可用；不影响正常玩）
    window.PokerDebug = {
        app,
        startSolo,
        beginHand,
        applyAction,
        buildView: seat => app.table ? buildView(app.table, seat) : null,
        renderAll,
    };
})();

</script>
</body>
